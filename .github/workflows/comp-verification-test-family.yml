name: Comp one verification test family (one-off, 2026-08-27)

# One-off, narrowly-scoped tool: grants billing_exempt to the exact
# +homatest account created this session to live-verify gh#1007/#1014/
# #1015 (sswift+homatest-verify1020@swiftdrtv.com), so it can be used
# without a card, the same way `sandbox` marks a family as a test
# family (apps/web/app/admin/actions.ts, setFamilySandboxAction) but
# for the billing_exempt column, which wall.ts documents as "a billing
# state the founder set by hand" with no existing admin UI action.
# Deleted immediately after use; not a standing capability.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type COMP TEST FAMILY
        required: true
        type: string

permissions:
  contents: read

jobs:
  comp:
    if: >-
      github.repository == 'sidneyswift/homa' &&
      github.repository_owner == 'sidneyswift' &&
      github.ref == 'refs/heads/main' &&
      github.ref_name == 'main' &&
      github.actor == 'sidneyswift' &&
      github.triggering_actor == 'sidneyswift'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - name: Validate confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "COMP TEST FAMILY" ]; then
            echo "Confirmation must exactly match COMP TEST FAMILY."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Comp the exact verification test family (one row only)
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
        run: node --experimental-strip-types -e '
          const postgres = (await import("postgres")).default;
          const TARGET_EMAIL = "sswift+homatest-verify1020@swiftdrtv.com";
          if (!TARGET_EMAIL.includes("+homatest")) throw new Error("refusing: target is not a +homatest address");
          const url = process.env.NEXT_PUBLIC_SUPABASE_URL || "https://kzplntcdtsvdowntvlza.supabase.co";
          const projectRef = new URL(url).hostname.split(".")[0];
          const sql = postgres({
            host: "aws-0-us-east-1.pooler.supabase.com",
            port: 6543,
            database: "postgres",
            username: `postgres.${projectRef}`,
            password: process.env.SUPABASE_DB_PASSWORD,
            ssl: "require",
            prepare: false,
            max: 1,
          });
          const rows = await sql`
            select f.id, f.billing_exempt, f.sandbox, f.stripe_subscription_status
            from public.families f
            join public.family_members fm on fm.family_id = f.id
            join auth.users u on u.id = fm.user_id
            where u.email = ${TARGET_EMAIL}
          `;
          if (rows.length !== 1) throw new Error(`expected exactly 1 family for ${TARGET_EMAIL}, found ${rows.length}`);
          const family = rows[0];
          if (family.stripe_subscription_status) throw new Error("refusing: family already has a Stripe subscription status, not a fresh test account");
          if (family.billing_exempt) { console.log("already billing_exempt, nothing to do:", JSON.stringify(family)); await sql.end(); process.exit(0); }
          const updated = await sql`
            update public.families
            set billing_exempt = true, sandbox = true
            where id = ${family.id}
            returning id, billing_exempt, sandbox, status
          `;
          console.log("comped:", JSON.stringify(updated[0]));
          await sql.end();
        '
