name: Apply issue 878 account deletion containment

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY ISSUE 878 ACCOUNT DELETION CONTAINMENT
        required: true
        type: string
      reviewed_repair_sha:
        description: Paste the exact reviewed pull request head SHA
        required: true
        type: string
      production_deployed_sha:
        description: Paste the exact READY production deployment commit SHA
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-issue-878-account-deletion-containment
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.repository == 'sidneyswift/homa' &&
      github.repository_owner == 'sidneyswift' &&
      github.ref == 'refs/heads/main' &&
      github.ref_name == 'main' &&
      github.event.repository.default_branch == 'main' &&
      github.actor == 'sidneyswift' &&
      github.triggering_actor == 'sidneyswift'
    name: Fence every legacy account deletion entry point
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate authorization and immutable inputs
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          GITHUB_TOKEN: ${{ github.token }}
          REVIEWED_REPAIR_SHA: ${{ inputs.reviewed_repair_sha }}
          PRODUCTION_DEPLOYED_SHA: ${{ inputs.production_deployed_sha }}
        run: |
          if [ "$CONFIRMATION" != "APPLY ISSUE 878 ACCOUNT DELETION CONTAINMENT" ]; then
            echo "Confirmation does not match the account-deletion containment."
            exit 1
          fi
          if ! [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
            echo "The GitHub run attempt is not a positive integer."
            exit 1
          fi
          if ! [[ "$REVIEWED_REPAIR_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The reviewed repair SHA must be an exact lowercase Git SHA."
            exit 1
          fi
          if ! [[ "$PRODUCTION_DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The production deployment SHA must be an exact lowercase Git SHA."
            exit 1
          fi
          if [ "$PRODUCTION_DEPLOYED_SHA" != "$GITHUB_SHA" ]; then
            echo "The confirmed READY production deployment must match this main commit."
            exit 1
          fi
          if [ "$GITHUB_REPOSITORY" != "sidneyswift/homa" ] \
            || [ "$GITHUB_REPOSITORY_OWNER" != "sidneyswift" ]; then
            echo "This containment may run only in sidneyswift/homa."
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ] \
            || [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "This containment may run only from main."
            exit 1
          fi
          default_branch="$(jq -r '.repository.default_branch // ""' "$GITHUB_EVENT_PATH")"
          if [ "$default_branch" != "main" ]; then
            echo "This containment requires main as the default branch."
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ] \
            || [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "The workflow checkout is not the exact clean dispatch commit."
            exit 1
          fi

          if [ "$GITHUB_RUN_ATTEMPT" = "1" ]; then
            echo "ISSUE_878_CONTAINMENT_RECOVERY=false" >> "$GITHUB_ENV"
          else
            previous_attempt="$((GITHUB_RUN_ATTEMPT - 1))"
            previous_run="$(curl --fail --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$previous_attempt")"
            previous_binding="$(printf '%s' "$previous_run" | jq -r \
              '[.id, .run_attempt, .head_sha, .head_branch, .event, .status, .conclusion, .actor.login, .triggering_actor.login, .head_repository.full_name] | @tsv')"
            IFS=$'\t' read -r \
              previous_run_id previous_run_attempt previous_head_sha \
              previous_head_branch previous_event previous_status \
              previous_conclusion previous_actor previous_triggering_actor \
              previous_repository <<< "$previous_binding"
            if [ "$previous_run_id" != "$GITHUB_RUN_ID" ] \
              || [ "$previous_run_attempt" != "$previous_attempt" ] \
              || [ "$previous_head_sha" != "$GITHUB_SHA" ] \
              || [ "$previous_head_branch" != "main" ] \
              || [ "$previous_event" != "workflow_dispatch" ] \
              || [ "$previous_status" != "completed" ]; then
              echo "The previous attempt is not the same completed main dispatch."
              exit 1
            fi
            if [ "$previous_actor" != "sidneyswift" ] \
              || [ "$previous_triggering_actor" != "sidneyswift" ] \
              || [ "$previous_repository" != "sidneyswift/homa" ]; then
              echo "The previous attempt has the wrong repository or actor."
              exit 1
            fi
            case "$previous_conclusion" in
              cancelled|failure|timed_out)
                ;;
              *)
                echo "Only an unsuccessful prior attempt may enter recovery."
                exit 1
                ;;
            esac
            echo "ISSUE_878_CONTAINMENT_RECOVERY=true" >> "$GITHUB_ENV"
          fi

          read -r -a merge_line <<< "$(git rev-list --parents -n 1 "$GITHUB_SHA")"
          if [ "${#merge_line[@]}" -ne 3 ]; then
            echo "The deployed main commit must be a normal two-parent merge."
            exit 1
          fi
          if [ "${merge_line[2]}" != "$REVIEWED_REPAIR_SHA" ]; then
            echo "The reviewed repair is not the deployed merge's second parent."
            exit 1
          fi

          reviewed_paths=(
            .github/workflows/ci.yml
            .github/workflows/issue-878-account-deletion-containment.yml
            apps/mobile/scripts/android-release-guard.mjs
            apps/mobile/scripts/android-release-guard.test.mjs
            apps/mobile/src/app/settings/delete-account.tsx
            apps/web/agent/schedules/account-deletions.ts
            apps/web/app/api/account-deletion/route.ts
            apps/web/app/app/settings/delete-family-data-card.tsx
            apps/web/app/app/settings/page.tsx
            apps/web/lib/account-deletion-containment.test.ts
            docs/homa-design/evidence/authoring-rails.json
            docs/homa-design/evidence/legacy-removal.json
            docs/homa-design/evidence/marketing-production.json
            docs/homa-design/evidence/surfaces.json
            package.json
            scripts/migration-version-check.mjs
            scripts/issue-878-account-deletion-containment-postgres.mjs
            scripts/issue-878-account-deletion-containment.test.mjs
            scripts/issue-878-account-deletion-containment.sql
            supabase/migrations/20260809030000_pause_legacy_account_deletion.sql
          )
          if ! git diff --quiet "$REVIEWED_REPAIR_SHA" "$GITHUB_SHA" -- "${reviewed_paths[@]}"; then
            echo "A reviewed containment input changed while merging to main."
            exit 1
          fi
          node scripts/migration-version-check.mjs

          migration="supabase/migrations/20260809030000_pause_legacy_account_deletion.sql"
          expected_migration="d654b9c3666a67fadcf667861063850394e805aee5d9522e9ea62407c075b96a"
          actual_migration="$(sha256sum "$migration" | cut -d' ' -f1)"
          if [ "$actual_migration" != "$expected_migration" ]; then
            echo "The account-deletion containment migration hash changed."
            exit 1
          fi

          repair="scripts/issue-878-account-deletion-containment.sql"
          expected_repair="c5e535c22a4d3df2e87c5e461e1b14197cb93ac47fa784b3f37eff37f8181051"
          actual_repair="$(sha256sum "$repair" | cut -d' ' -f1)"
          if [ "$actual_repair" != "$expected_repair" ]; then
            echo "The account-deletion containment repair hash changed."
            exit 1
          fi

      - name: Prove the reviewed deployment is still main
        run: |
          remote_main_sha="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          if [ "$remote_main_sha" != "$GITHUB_SHA" ]; then
            echo "Main moved after the containment was dispatched."
            exit 1
          fi

      - name: Confirm PostgreSQL client availability
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client-16
          fi
          psql --version

      - name: Build a masked production database URL
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          node <<'NODE'
          const { appendFileSync } = require("node:fs");
          const publicUrl = process.env.NEXT_PUBLIC_SUPABASE_URL;
          const password = process.env.SUPABASE_DB_PASSWORD;
          if (!publicUrl || !password) {
            throw new Error("Production Supabase URL or database password is missing");
          }
          const ref = new URL(publicUrl).hostname.split(".")[0];
          if (ref !== "kzplntcdtsvdowntvlza") {
            throw new Error("The production Supabase project does not match Homa");
          }
          const databaseUrl = new URL("postgresql://aws-0-us-east-1.pooler.supabase.com:6543/postgres");
          databaseUrl.username = `postgres.${ref}`;
          databaseUrl.password = password;
          databaseUrl.searchParams.set("sslmode", "require");
          process.stdout.write(`::add-mask::${databaseUrl.toString()}\n`);
          appendFileSync(process.env.GITHUB_ENV, `MIGRATION_DATABASE_URL=${databaseUrl.toString()}\n`);
          NODE

      - name: Apply and verify the exact containment
        run: |
          first_result="$(psql "$MIGRATION_DATABASE_URL" -qX -v ON_ERROR_STOP=1 \
            -f scripts/issue-878-account-deletion-containment.sql)"
          mapfile -t first_markers < <(
            printf '%s\n' "$first_result" \
              | grep '^ISSUE_878_ACCOUNT_DELETION_CONTAINMENT='
          )
          if [ "${#first_markers[@]}" -ne 1 ]; then
            echo "The first connection did not report exactly one marker."
            exit 1
          fi
          if [ "$ISSUE_878_CONTAINMENT_RECOVERY" = "false" ] \
            && [ "${first_markers[0]}" != "ISSUE_878_ACCOUNT_DELETION_CONTAINMENT=applied" ]; then
            echo "A first attempt must apply the reviewed containment."
            exit 1
          fi
          if [ "$ISSUE_878_CONTAINMENT_RECOVERY" = "true" ] \
            && [ "${first_markers[0]}" != "ISSUE_878_ACCOUNT_DELETION_CONTAINMENT=applied" ] \
            && [ "${first_markers[0]}" != "ISSUE_878_ACCOUNT_DELETION_CONTAINMENT=verified_noop" ]; then
            echo "A recovery attempt returned an unknown containment state."
            exit 1
          fi

          second_result="$(psql "$MIGRATION_DATABASE_URL" -qX -v ON_ERROR_STOP=1 \
            -f scripts/issue-878-account-deletion-containment.sql)"
          mapfile -t second_markers < <(
            printf '%s\n' "$second_result" \
              | grep '^ISSUE_878_ACCOUNT_DELETION_CONTAINMENT='
          )
          if [ "${#second_markers[@]}" -ne 1 ] \
            || [ "${second_markers[0]}" != "ISSUE_878_ACCOUNT_DELETION_CONTAINMENT=verified_noop" ]; then
            echo "The fresh verification connection did not prove an exact no-op."
            exit 1
          fi

          echo "${first_markers[0]}"
          echo "${second_markers[0]}"

      - name: Record aggregate containment evidence
        run: |
          non_complete_jobs="$(psql "$MIGRATION_DATABASE_URL" -qXAt \
            -v ON_ERROR_STOP=1 \
            -c "select count(*) from public.account_deletion_jobs where status <> 'complete'")"
          if [ "$non_complete_jobs" != "0" ]; then
            echo "Non-complete account-deletion jobs remain after containment."
            exit 1
          fi
          echo "ISSUE_878_NON_COMPLETE_JOB_COUNT=0"

      - name: Prove main stayed frozen through containment
        run: |
          remote_main_sha="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          if [ "$remote_main_sha" != "$GITHUB_SHA" ]; then
            echo "Main moved while the containment was running."
            exit 1
          fi
