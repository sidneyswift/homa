name: State requirements seed

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed main commit to seed
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: state-requirements-production-seed
  cancel-in-progress: false

jobs:
  seed:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Refuse a moving or unreviewed target
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reverify reviewed snapshots
        run: |
          pnpm check:state-pack
          pnpm check:deadline-anchors

      - name: Seed and read back production state requirements
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: pnpm seed:state-requirements -- --confirm-prod
