name: Repair trial claim migration

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY ISSUE 873
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-trial-claim-migration-repair
  cancel-in-progress: false

jobs:
  apply:
    name: Apply one audited additive migration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate authorization and immutable migration input
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "APPLY ISSUE 873" ]; then
            echo "Confirmation must exactly match APPLY ISSUE 873."
            exit 1
          fi
          node scripts/migration-version-check.mjs
          migration="supabase/migrations/20260805200000_reconcile_trial_claim_migration.sql"
          expected="8860638b33901e0ea06998f5b62dce986969ddfec349224d1747f24f02dcc70c"
          actual="$(sha256sum "$migration" | cut -d' ' -f1)"
          if [ "$actual" != "$expected" ]; then
            echo "Migration hash does not match the reviewed issue #873 input."
            exit 1
          fi
          repair_script="scripts/trial-claim-migration-repair.sql"
          expected_repair="e52785921a24f638dabbcb2700cd9b0a5b5583a61f421f635f3aa262bdb048e1"
          actual_repair="$(sha256sum "$repair_script" | cut -d' ' -f1)"
          if [ "$actual_repair" != "$expected_repair" ]; then
            echo "Repair transaction hash does not match the reviewed issue #873 input."
            exit 1
          fi
          if [ "$GITHUB_REPOSITORY" != "sidneyswift/homa" ]; then
            echo "This repair may run only in sidneyswift/homa."
            exit 1
          fi

      - name: Confirm PostgreSQL client availability
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client-16
          fi
          psql --version

      - name: Build a masked production database URL
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          node <<'NODE'
          const { appendFileSync } = require("node:fs");
          const publicUrl = process.env.NEXT_PUBLIC_SUPABASE_URL;
          const password = process.env.SUPABASE_DB_PASSWORD;
          if (!publicUrl || !password) {
            throw new Error("Production Supabase URL or database password is missing");
          }
          const ref = new URL(publicUrl).hostname.split(".")[0];
          if (ref !== "kzplntcdtsvdowntvlza") {
            throw new Error("The production Supabase project does not match Homa");
          }
          const databaseUrl = new URL("postgresql://aws-0-us-east-1.pooler.supabase.com:6543/postgres");
          databaseUrl.username = `postgres.${ref}`;
          databaseUrl.password = password;
          databaseUrl.searchParams.set("sslmode", "require");
          process.stdout.write(`::add-mask::${databaseUrl.toString()}\n`);
          appendFileSync(process.env.GITHUB_ENV, `MIGRATION_DATABASE_URL=${databaseUrl.toString()}\n`);
          NODE

      - name: Apply and record the exact repair in one transaction
        run: |
          result="$(psql "$MIGRATION_DATABASE_URL" -qX -v ON_ERROR_STOP=1 -f scripts/trial-claim-migration-repair.sql)"
          echo "$result"
          if ! grep -Eq '^ISSUE_873_REPAIR=(repaired|verified_noop)$' <<<"$result"; then
            echo "The atomic repair did not return a recognized result."
            exit 1
          fi

      - name: Prove an immediate repeat is a no-op
        run: |
          result="$(psql "$MIGRATION_DATABASE_URL" -qX -v ON_ERROR_STOP=1 -f scripts/trial-claim-migration-repair.sql)"
          echo "$result"
          if ! grep -q '^ISSUE_873_REPAIR=verified_noop$' <<<"$result"; then
            echo "The second repair pass was not a verified no-op."
            exit 1
          fi

      - name: Verify table, RLS, grants, and migration history
        run: |
          verification="$(psql "$MIGRATION_DATABASE_URL" -AtX -v ON_ERROR_STOP=1 -c "
            select concat_ws(
              '|',
              (to_regclass('public.stripe_trial_card_claims') is not null)::text,
              coalesce((
                select relrowsecurity
                from pg_class
                where oid = 'public.stripe_trial_card_claims'::regclass
              ), false)::text,
              has_table_privilege(
                'anon',
                'public.stripe_trial_card_claims',
                'SELECT,INSERT,UPDATE,DELETE,TRUNCATE,REFERENCES,TRIGGER'
              )::text,
              has_table_privilege(
                'authenticated',
                'public.stripe_trial_card_claims',
                'SELECT,INSERT,UPDATE,DELETE,TRUNCATE,REFERENCES,TRIGGER'
              )::text,
              exists(
                select 1
                from pg_constraint
                where conrelid = 'public.stripe_trial_card_claims'::regclass
                  and contype = 'p'
                  and pg_get_constraintdef(oid) = 'PRIMARY KEY (card_fingerprint)'
              )::text,
              exists(
                select 1
                from pg_constraint
                where conrelid = 'public.stripe_trial_card_claims'::regclass
                  and contype = 'f'
                  and confrelid = 'public.families'::regclass
                  and confdeltype = 'c'
              )::text,
              (to_regclass('public.stripe_trial_card_claims_family_idx') is not null)::text,
              not exists(
                select 1
                from pg_policy
                where polrelid = 'public.stripe_trial_card_claims'::regclass
                  and polpermissive
              )::text,
              exists(
                select 1
                from supabase_migrations.schema_migrations
                where version = '20260805200000'
              )::text
            )
          ")"
          if [ "$verification" != "true|true|false|false|true|true|true|true|true" ]; then
            echo "Production verification failed without reading claim rows."
            exit 1
          fi
          echo "Production verification passed: exact keys and index present, RLS on, client grants and permissive policies absent, migration recorded."
