name: Repair trial claim migration

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY ISSUE 873
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-trial-claim-migration-repair
  cancel-in-progress: false

jobs:
  apply:
    name: Apply one audited additive migration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate authorization and immutable migration input
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "APPLY ISSUE 873" ]; then
            echo "Confirmation must exactly match APPLY ISSUE 873."
            exit 1
          fi
          node scripts/migration-version-check.mjs
          migration="supabase/migrations/20260805200000_reconcile_trial_claim_migration.sql"
          expected="8860638b33901e0ea06998f5b62dce986969ddfec349224d1747f24f02dcc70c"
          actual="$(sha256sum "$migration" | cut -d' ' -f1)"
          if [ "$actual" != "$expected" ]; then
            echo "Migration hash does not match the reviewed issue #873 input."
            exit 1
          fi

      - uses: supabase/setup-cli@v2
        with:
          version: 2.111.0

      - name: Confirm PostgreSQL client availability
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client-16
          fi
          psql --version

      - name: Build a masked production database URL
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          node <<'NODE'
          const { appendFileSync } = require("node:fs");
          const publicUrl = process.env.NEXT_PUBLIC_SUPABASE_URL;
          const password = process.env.SUPABASE_DB_PASSWORD;
          if (!publicUrl || !password) {
            throw new Error("Production Supabase URL or database password is missing");
          }
          const ref = new URL(publicUrl).hostname.split(".")[0];
          const databaseUrl = new URL("postgresql://aws-0-us-east-1.pooler.supabase.com:6543/postgres");
          databaseUrl.username = `postgres.${ref}`;
          databaseUrl.password = password;
          databaseUrl.searchParams.set("sslmode", "require");
          process.stdout.write(`::add-mask::${databaseUrl.toString()}\n`);
          appendFileSync(process.env.GITHUB_ENV, `MIGRATION_DATABASE_URL=${databaseUrl.toString()}\n`);
          NODE

      - name: Apply only the issue 873 migration and repair its ledger entry
        run: |
          version="20260805200000"
          migration="supabase/migrations/20260805200000_reconcile_trial_claim_migration.sql"
          state="$(psql "$MIGRATION_DATABASE_URL" -AtX -v ON_ERROR_STOP=1 -v version="$version" -c "
            select
              (to_regclass('public.stripe_trial_card_claims') is not null)::text
              || '|'
              || exists(
                select 1
                from supabase_migrations.schema_migrations
                where version = :'version'
              )::text
          ")"

          case "$state" in
            "true|true")
              echo "The schema and migration ledger are already repaired."
              ;;
            "true|false")
              echo "The additive schema exists; repairing only its missing ledger entry."
              supabase migration repair "$version" --status applied --db-url "$MIGRATION_DATABASE_URL"
              ;;
            "false|false")
              echo "Applying the one reviewed additive migration."
              psql "$MIGRATION_DATABASE_URL" -X -v ON_ERROR_STOP=1 --single-transaction -f "$migration"
              supabase migration repair "$version" --status applied --db-url "$MIGRATION_DATABASE_URL"
              ;;
            "false|true")
              echo "Migration history claims the repair ran, but the table is absent. Stopping."
              exit 1
              ;;
            *)
              echo "Unexpected production preflight result."
              exit 1
              ;;
          esac

      - name: Verify table, RLS, grants, and migration history
        run: |
          verification="$(psql "$MIGRATION_DATABASE_URL" -AtX -v ON_ERROR_STOP=1 -c "
            select concat_ws(
              '|',
              (to_regclass('public.stripe_trial_card_claims') is not null)::text,
              coalesce((
                select relrowsecurity
                from pg_class
                where oid = 'public.stripe_trial_card_claims'::regclass
              ), false)::text,
              has_table_privilege(
                'anon',
                'public.stripe_trial_card_claims',
                'SELECT,INSERT,UPDATE,DELETE,TRUNCATE,REFERENCES,TRIGGER'
              )::text,
              has_table_privilege(
                'authenticated',
                'public.stripe_trial_card_claims',
                'SELECT,INSERT,UPDATE,DELETE,TRUNCATE,REFERENCES,TRIGGER'
              )::text,
              exists(
                select 1
                from supabase_migrations.schema_migrations
                where version = '20260805200000'
              )::text
            )
          ")"
          if [ "$verification" != "true|true|false|false|true" ]; then
            echo "Production verification failed without reading claim rows."
            exit 1
          fi
          echo "Production verification passed: table present, RLS on, client grants absent, migration recorded."
