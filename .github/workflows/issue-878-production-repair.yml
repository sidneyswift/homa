name: Apply issue 878 production repair

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY ISSUE 878
        required: true
        type: string
      production_deployed_sha:
        description: Paste the exact READY production deployment commit SHA
        required: true
        type: string
      reviewed_repair_sha:
        description: Paste the exact reviewed PR head commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-issue-878-repair-v2
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.repository == 'sidneyswift/homa' &&
      github.repository_owner == 'sidneyswift' &&
      github.ref == 'refs/heads/main' &&
      github.ref_name == 'main' &&
      github.event.repository.default_branch == 'main' &&
      github.actor == 'sidneyswift' &&
      github.triggering_actor == 'sidneyswift'
    name: Apply two audited issue 878 migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Validate authorization and immutable inputs
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          PRODUCTION_DEPLOYED_SHA: ${{ inputs.production_deployed_sha }}
          REVIEWED_REPAIR_SHA: ${{ inputs.reviewed_repair_sha }}
        run: |
          if [ "$CONFIRMATION" != "APPLY ISSUE 878" ]; then
            echo "Confirmation must exactly match APPLY ISSUE 878."
            exit 1
          fi
          if [ "$PRODUCTION_DEPLOYED_SHA" != "$GITHUB_SHA" ]; then
            echo "The confirmed READY production deployment must match this main commit."
            exit 1
          fi
          if [ "$(printf '%s' "$REVIEWED_REPAIR_SHA" | wc -c | tr -d ' ')" -ne 40 ]; then
            echo "The reviewed repair commit must be one full lowercase Git SHA."
            exit 1
          fi
          if [ "$REVIEWED_REPAIR_SHA" != "$(printf '%s' "$REVIEWED_REPAIR_SHA" | tr -cd '0-9a-f')" ]; then
            echo "The reviewed repair commit must be one full lowercase Git SHA."
            exit 1
          fi
          if [ "$GITHUB_REPOSITORY" != "sidneyswift/homa" ]; then
            echo "This repair may run only in sidneyswift/homa."
            exit 1
          fi
          if [ "$GITHUB_REPOSITORY_OWNER" != "sidneyswift" ]; then
            echo "This repair may run only for the sidneyswift repository owner."
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ] || [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "This repair may run only from the main branch."
            exit 1
          fi
          default_branch="$(jq -r '.repository.default_branch // ""' "$GITHUB_EVENT_PATH")"
          if [ "$default_branch" != "main" ]; then
            echo "This repair may run only when main is the repository default branch."
            exit 1
          fi
          checked_out_sha="$(git rev-parse HEAD)"
          if [ "$checked_out_sha" != "$GITHUB_SHA" ]; then
            echo "The checked-out commit does not match the dispatched workflow commit."
            exit 1
          fi

          read -r -a merge_line <<< "$(git rev-list --parents -n 1 "$GITHUB_SHA")"
          if [ "${#merge_line[@]}" -ne 3 ]; then
            echo "The deployed main commit must be the two-parent merge of the reviewed repair."
            exit 1
          fi
          if [ "${merge_line[2]}" != "$REVIEWED_REPAIR_SHA" ]; then
            echo "The reviewed repair commit is not the deployed merge's second parent."
            exit 1
          fi
          reviewed_paths=(
            .github/workflows/issue-878-production-repair.yml
            scripts/migration-version-check.mjs
            scripts/issue-878-production-repair-marker-policy.mjs
            scripts/issue-878-production-repair.sql
            supabase/migrations/20260806034000_sandbox_live_auth_fixtures.sql
            supabase/migrations/20260806035000_family_delete_progress_trigger.sql
          )
          if ! git diff --quiet "$REVIEWED_REPAIR_SHA" "$GITHUB_SHA" -- "${reviewed_paths[@]}"; then
            echo "A reviewed issue #878 release input changed while merging to main."
            exit 1
          fi
          node scripts/migration-version-check.mjs

          sandbox_migration="supabase/migrations/20260806034000_sandbox_live_auth_fixtures.sql"
          expected_sandbox="e1ccac4fab7d7346e91e39ae864d35e82b35ce13894f3ed2d6811492fdf993c7"
          actual_sandbox="$(sha256sum "$sandbox_migration" | cut -d' ' -f1)"
          if [ "$actual_sandbox" != "$expected_sandbox" ]; then
            echo "Sandbox migration hash does not match the reviewed issue #878 input."
            exit 1
          fi

          delete_migration="supabase/migrations/20260806035000_family_delete_progress_trigger.sql"
          expected_delete="841ce177e122e393a8d5e37590b3290e2c6b3e1f1a813f158995ee0681c854d8"
          actual_delete="$(sha256sum "$delete_migration" | cut -d' ' -f1)"
          if [ "$actual_delete" != "$expected_delete" ]; then
            echo "Family deletion migration hash does not match the reviewed issue #878 input."
            exit 1
          fi

          repair_script="scripts/issue-878-production-repair.sql"
          expected_repair="d9ac8309217392e7cd54308c1202d7e723cd01c2f5047dc22b182d002267de3b"
          actual_repair="$(sha256sum "$repair_script" | cut -d' ' -f1)"
          if [ "$actual_repair" != "$expected_repair" ]; then
            echo "Repair wrapper hash does not match the reviewed issue #878 input."
            exit 1
          fi

          marker_policy="scripts/issue-878-production-repair-marker-policy.mjs"
          expected_marker_policy="c63d049650f26e80c36f8bd984ecc4ddfd23d4acdfb29ad4a117874a3a9786cd"
          actual_marker_policy="$(sha256sum "$marker_policy" | cut -d' ' -f1)"
          if [ "$actual_marker_policy" != "$expected_marker_policy" ]; then
            echo "Repair marker policy hash does not match the reviewed issue #878 input."
            exit 1
          fi

      - name: Prove the reviewed commit is still the main head
        run: |
          remote_main_sha="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          if [ "$remote_main_sha" != "$GITHUB_SHA" ]; then
            echo "The main branch moved after this workflow was dispatched."
            exit 1
          fi

      - name: Confirm PostgreSQL client availability
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client-16
          fi
          psql --version

      - name: Build a masked production database URL
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          node <<'NODE'
          const { appendFileSync } = require("node:fs");
          const publicUrl = process.env.NEXT_PUBLIC_SUPABASE_URL;
          const password = process.env.SUPABASE_DB_PASSWORD;
          if (!publicUrl || !password) {
            throw new Error("Production Supabase URL or database password is missing");
          }
          const ref = new URL(publicUrl).hostname.split(".")[0];
          if (ref !== "kzplntcdtsvdowntvlza") {
            throw new Error("The production Supabase project does not match Homa");
          }
          const databaseUrl = new URL("postgresql://aws-0-us-east-1.pooler.supabase.com:6543/postgres");
          databaseUrl.username = `postgres.${ref}`;
          databaseUrl.password = password;
          databaseUrl.searchParams.set("sslmode", "require");
          process.stdout.write(`::add-mask::${databaseUrl.toString()}\n`);
          appendFileSync(process.env.GITHUB_ENV, `MIGRATION_DATABASE_URL=${databaseUrl.toString()}\n`);
          NODE

      - name: Apply the exact repair in one fresh connection
        run: |
          result="$(psql "$MIGRATION_DATABASE_URL" -qX -v ON_ERROR_STOP=1 -f scripts/issue-878-production-repair.sql)"
          echo "$result"
          mapfile -t repair_markers < <(
            printf '%s\n' "$result" | grep '^ISSUE_878_REPAIR='
          )
          if [ "${#repair_markers[@]}" -ne 1 ]; then
            echo "The first issue #878 connection did not report exactly one marker."
            exit 1
          fi
          node scripts/issue-878-production-repair-marker-policy.mjs \
            apply "${repair_markers[@]}"

      - name: Prove an immediate repeat is a verified no-op
        run: |
          result="$(psql "$MIGRATION_DATABASE_URL" -qX -v ON_ERROR_STOP=1 -f scripts/issue-878-production-repair.sql)"
          echo "$result"
          mapfile -t repair_markers < <(
            printf '%s\n' "$result" | grep '^ISSUE_878_REPAIR='
          )
          node scripts/issue-878-production-repair-marker-policy.mjs \
            verify "${repair_markers[@]}"

      - name: Prove main stayed frozen through the repair
        run: |
          remote_main_sha="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          if [ "$remote_main_sha" != "$GITHUB_SHA" ]; then
            echo "The main branch moved while the issue #878 repair was running."
            exit 1
          fi
