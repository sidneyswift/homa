name: CI

# Enforces BUILD.md law #1 ("isolation tests green in CI always") and the
# M1-07 requirement that the adversarial suite runs in CI from the FIRST
# schema migration. Also runs the MJ-08 events-registry parity check, the
# map content + scorer checks, the skills-targeting checks, and lint.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          # Matches apps/web engines ("node": "24.x").
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: ChildProgress unit and compatibility checks
        run: pnpm check:child-progress

      - name: Progress UI checks
        run: pnpm check:progress-ui

      - name: Map content + scorer checks (claims law, citations, golden kids)
        run: pnpm check:map

      - name: Events-registry parity check (MJ-08)
        run: pnpm check:events

      - name: Skills-bank targeting checks
        run: pnpm check:skills-targeting

      - name: Taxonomy checks (skill graph integrity, id law, DAG)
        run: pnpm check:taxonomy

      - name: Conversation continuity checks (episodes, replies, deliveries)
        run: pnpm check:continuity

      - name: Morning research brief format
        run: pnpm check:research-brief

      - name: Homa's tasks UI checks (cards, editor dialog)
        run: pnpm check:tasks-ui

      - name: Chat UI checks (attachment markers, transcript, worked-for, snap card)
        run: pnpm check:chat-ui

      - name: Install PostgreSQL 16 for disposable E2E
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-16
          echo "HOMA_POSTGRES_BIN=/usr/lib/postgresql/16/bin" >> "$GITHUB_ENV"

      - name: ChildProgress disposable PostgreSQL E2E
        timeout-minutes: 10
        run: pnpm child-progress:e2e

      - name: Conversation continuity database E2E (multi-parent causality)
        run: pnpm continuity:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # Vercel's pipeline runs eve build after next build; it compiles agent
      # tool modules outside Next's bundler, so imports that Next tolerates
      # can still sink the deploy (2026-07-10 incident: next/server + a JSON
      # corpus loader in a tool module). Run it here so CI fails first.
      - name: Eve channel build (agent tool modules)
        run: pnpm --filter web exec eve build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Tenancy isolation smoke check (M1-07 seed)
        run: pnpm check:isolation
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
