name: CI

# Enforces BUILD.md law #1 ("isolation tests green in CI always") and the
# M1-07 requirement that the adversarial suite runs in CI from the FIRST
# schema migration. Also runs the MJ-08 events-registry parity check, the
# map content + scorer checks, the fleet-skill package checks, the
# (now-retired-system) skills-targeting checks, and lint.
#
# Layout (2026-07-31 restructure, no coverage removed): the old single
# build-and-check job ran ~45 steps serially and took ~9.5 minutes. The
# same steps now run as parallel jobs: "build" (compile chain), three
# balanced guard shards ("checks", "db-checks", "e2e-checks", split by
# measured step time; all export HOMA_POSTGRES_BIN so a suite can move
# between them freely), plus scope-independent "brand-checks" and
# "mobile-checks". Turborepo and Next build caches make
# unchanged packages replay instantly. Mobile typecheck/lint run ONLY in
# mobile-checks; the build job filters mobile out of its turbo run
# because running them twice per commit bought nothing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same PR supersedes the in-flight run. Pushes to main
# are never cancelled: each one maps to a deploy we want evidence for.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests that only change documentation or the mobile app do not
  # need five web runners. The classifier recognizes a deliberately tiny
  # safe set; empty, mixed, unknown, workflow, dependency, database, and
  # runtime changes all fall back to the full suite. Main always runs full.
  classify-changes:
    runs-on: ubuntu-24.04
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          # PR checkouts are synthetic merge commits. Depth two retains the
          # base parent, so HEAD^..HEAD is the complete pull-request diff.
          fetch-depth: 2

      - name: Classify pull-request changes
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/ci-change-scope.mjs github >> "$GITHUB_OUTPUT"
          else
            echo "scope=full" >> "$GITHUB_OUTPUT"
          fi

  # Fast paths still enforce the repository-wide style law and test the
  # classifier that decides which expensive web and database jobs may skip.
  light-checks:
    needs: classify-changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Change classifier tests
        run: node --test scripts/ci-change-scope.test.mjs

      - name: Supabase migration versions are unique
        run: node scripts/migration-version-check.mjs && node --test scripts/migration-version-check.test.mjs

      - name: Repository cleanup guardrails (113 focused tests)
        run: node --test scripts/git-safety-hook.test.mjs scripts/remove-worktree-safely.test.mjs scripts/retire-damaged-worktree-registrations.test.mjs

      - name: "No-em-dash style law (AGENTS.md: no em dash, ever, anywhere)"
        run: node scripts/em-dash-check.mjs

      - name: SEO contract
        # This job deliberately has no dependency install. Keep the SEO
        # contract dependency-free so the fast gate can execute it directly.
        run: node --experimental-strip-types scripts/seo-contract-check.mts

  # Brand truth crosses product code, mobile code, authoring docs, generated
  # evidence, marketing, and provider handoffs. It runs for every scope so a
  # docs-only or mobile-only change cannot bypass manifest freshness, residue,
  # removal-ledger, or projection checks while the expensive web and database
  # shards retain their fast paths.
  brand-checks:
    needs: classify-changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch PR base and head for delivery-delta guards
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"
          git fetch --no-tags origin "${{ github.event.pull_request.head.sha }}"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Design-token check (colour utilities name a declared token)
        run: pnpm check:design-tokens

      - name: Brand-surface manifest check (coverage, provenance, legacy baseline)
        run: pnpm check:brand-surfaces

      - name: Legacy removal ledger check (exact bindings and invalidation)
        run: pnpm check:legacy-removal

      - name: Marketing production contract check (bundles, queues, generators, publishers)
        run: pnpm check:marketing-production

      - name: Channel evidence contract check (fresh fingerprints and hard gates)
        run: pnpm check:channel-evidence

      - name: Provider handoff contract check (owned fields and external read-back gates)
        run: pnpm check:provider-handoffs

      - name: Handwrytten stationery contract check (source inventory and irreversible-delivery gates)
        run: pnpm check:handwrytten-stationery

      - name: Brand asset generation and fingerprint check
        run: pnpm check:brand-assets

      - name: Canonical identity asset manifest and residue check
        run: pnpm check:identity-assets

      - name: Design authoring rails check (coverage, contract, residue, fingerprints)
        run: pnpm check:design-authoring

      - name: Licensed font system contract and residue check
        run: pnpm check:font-system

      - name: Durable artifact design-era check (classification and Quiet print markers)
        run: pnpm check:artifact-brand-era

      - name: Active brand residue check (changed files cannot revive legacy identity)
        run: pnpm check:brand-residue

      - name: Design contract parity check (byte-stable projections)
        run: pnpm check:design-parity

      - name: Design fixture gallery check (stable IDs, profiles, and checksums)
        run: pnpm check:design-fixtures

      - name: Web interface gauntlet contract check
        run: pnpm check:interface-gauntlet

      - name: Design contract type and semantic tests
        run: pnpm check:design-contract

      - name: Semantic icon direct-import residue check
        run: pnpm check:icon-residue

  # Branch protection on main requires a status context named exactly
  # "build-and-check" (the old single job's name). This gate carries that
  # name and verifies the exact job set required by the classified scope.
  # If a job is added below, add it to `needs` here or it stops gating merges.
  build-and-check:
    needs: [classify-changes, light-checks, brand-checks, mobile-checks, build, checks, db-checks, e2e-checks]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: All jobs green
        run: node scripts/ci-change-scope.mjs gate
        env:
          CI_SCOPE: ${{ needs.classify-changes.outputs.scope }}
          CI_CLASSIFY: ${{ needs.classify-changes.result }}
          CI_LIGHT: ${{ needs.light-checks.result }}
          CI_BRAND: ${{ needs.brand-checks.result }}
          CI_MOBILE: ${{ needs.mobile-checks.result }}
          CI_BUILD: ${{ needs.build.result }}
          CI_CHECKS: ${{ needs.checks.result }}
          CI_DB: ${{ needs.db-checks.result }}
          CI_E2E: ${{ needs.e2e-checks.result }}

  # Runs independently of the web jobs (no Supabase secrets needed) so
  # mobile regressions surface fast. Until 2026-07-28 these tests existed
  # (check:mobile-chat) but ran in no pipeline that ships to phones; the
  # mobile-ota-update.yml workflow now runs the same suite before publish.
  mobile-checks:
    needs: classify-changes
    if: needs.classify-changes.outputs.scope == 'full' || needs.classify-changes.outputs.scope == 'mobile-only'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # GitHub's Ubuntu image carries several large toolchains this job never
      # invokes. The first blocking Gradle proof exhausted the runner disk
      # before completion, so reclaim only unrelated SDKs and emulator assets.
      - name: Reclaim runner disk for Android compilation
        run: |
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/lib/android/sdk/system-images
          sudo rm -rf /usr/local/lib/android/sdk/emulator
          sudo apt-get clean
          df -h /

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck mobile
        run: pnpm --filter mobile typecheck

      - name: Lint mobile
        run: pnpm --filter mobile lint

      - name: Mobile brand contract and icon registry
        run: pnpm check:mobile-brand

      - name: Event registry and capture-loop staging guard
        run: pnpm check:event-registry

      - name: Mobile chat unit tests
        run: pnpm check:mobile-chat

      - name: Mobile bootstrap unit tests
        run: pnpm check:mobile-bootstrap

      - name: Cross-platform password recovery contract
        run: pnpm check:auth-recovery

      - name: Mobile planner unit tests
        run: pnpm check:mobile-planner

      - name: Mobile Progress unit tests
        run: pnpm check:mobile-progress

      - name: Mobile voice unit tests
        run: pnpm check:mobile-voice

      - name: Mobile accessibility contract
        run: pnpm check:mobile-accessibility

      - name: Native interface gauntlet
        run: pnpm check:native-interface-gauntlet

      - name: Mobile release-rail contracts
        run: pnpm check:mobile-release-rails

      - name: Android JavaScript bundle export
        run: pnpm --filter mobile exec expo export --platform android --output-dir ${{ runner.temp }}/homa-android-compile

      # Expo owns the Android project in this managed app. Generate it before
      # setup-java computes Gradle's dependency-cache key, otherwise the
      # action finds no Gradle inputs and fails before native compilation.
      - name: Generate Android project for native compile
        run: pnpm --filter mobile exec expo prebuild --platform android --no-install --clean

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Android native compile-only assembly
        run: bash apps/mobile/android/gradlew --project-dir apps/mobile/android :app:assembleDebug --no-daemon

  # The compile chain plus the checks that need real Supabase secrets.
  # Typecheck, lint, and build go through one turbo invocation so turbo
  # can schedule them across the runner's cores and reuse the shared
  # ^build package outputs instead of computing them twice.
  build:
    needs: classify-changes
    if: needs.classify-changes.outputs.scope == 'full'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          # Matches apps/web engines ("node": "24.x").
          node-version: 24
          cache: pnpm

      # Turborepo's local cache: an unchanged package replays its cached
      # typecheck/lint/build instantly. Keyed on the commit with a prefix
      # fallback so every run reuses the newest prior cache.
      - name: Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # Next, TypeScript, and ESLint share this incremental cache. Turbo's
      # outputs exclude .next/cache on purpose because it is machine state,
      # not a replayable build artifact. Persist it on both PRs and main so
      # cache-miss typechecks and lint runs do not start from zero.
      - name: Next.js and static analysis cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Mobile is excluded on purpose: mobile-checks already typechecks and
      # lints it, and doing it twice per commit is pure waste.
      #
      # TURBO_CACHE_DIR pins the local cache to the .turbo path the cache
      # step above saves. Without it turbo 2 writes to
      # node_modules/.cache/turbo and the actions/cache entry silently
      # carries nothing (observed on this workflow's second run: web tasks
      # cache-missed despite unchanged inputs).
      #
      # Typecheck and lint run on every event: Vercel's build does not run
      # eslint, and next build only type-checks app code, not packages or
      # scripts.
      - name: Typecheck, lint
        run: pnpm exec turbo run typecheck lint --filter=!mobile
        env:
          TURBO_CACHE_DIR: .turbo/cache

      # Founder ruling 2026-07-31 (`ci-pr-build-via-vercel`): on pull
      # requests the Next and eve builds are carried by Vercel's preview
      # deployment, which runs the same pipeline and reports on the PR as
      # the REQUIRED "Vercel" status check. CI runs the build only on main
      # pushes, as the belt for direct-to-main pushes that get no preview
      # deployment gate.
      - name: Build (main pushes only; PRs are gated by Vercel's preview build)
        if: github.event_name == 'push'
        run: pnpm exec turbo run build --filter=!mobile
        env:
          TURBO_CACHE_DIR: .turbo/cache
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # Vercel's pipeline runs eve build after next build; it compiles agent
      # tool modules outside Next's bundler, so imports that Next tolerates
      # can still sink the deploy (2026-07-10 incident: next/server + a JSON
      # corpus loader in a tool module). Run it here so CI fails first.
      #
      # Standalone `eve build` skips normalizeEveVercelFunctionOutput unless it
      # sees a co-deployed Next+Eve experimentalServices config (the shape
      # Vercel production writes). Seed that signal so CI exercises the same
      # eve/__server.func + maxDuration path production ships.
      - name: Eve channel build (agent tool modules)
        if: github.event_name == 'push'
        run: |
          mkdir -p apps/web/.vercel/output
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const configPath = path.join(
            "apps",
            "web",
            ".vercel",
            "output",
            "config.json",
          );
          fs.writeFileSync(
            configPath,
            `${JSON.stringify(
              {
                version: 3,
                experimentalServices: {
                  next: { framework: "nextjs", entrypoint: "." },
                  eve: {
                    framework: "eve",
                    entrypoint: ".",
                    routePrefix: "/eve",
                  },
                },
              },
              null,
              2,
            )}\n`,
          );
          NODE
          VERCEL=1 pnpm --filter web exec eve build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # Eve's shared /eve/__server.func hosts the long-lived NDJSON stream.
      # Without maxDuration it inherits Fluid Compute's 300s default and
      # production kills in-progress chat streams (2026-07-11 through 2026-07-16).
      # Must run after a VERCEL=1 eve build so the shared function config is rewritten.
      - name: Eve stream maxDuration guard
        if: github.event_name == 'push'
        run: VERCEL=1 pnpm check:eve-stream-duration

  # Guard shard 1 of 3. The guards never depended on the compile chain
  # (they all ran before the Build step in the old single job), so they
  # run in parallel with it. The two shards are balanced by measured step
  # time, not by theme; both export HOMA_POSTGRES_BIN, so moving a suite
  # between shards is always safe.
  checks:
    needs: classify-changes
    if: needs.classify-changes.outputs.scope == 'full'
    runs-on: ubuntu-24.04
    steps:
      # The residue ratchet compares the PR head with its base SHA. A shallow
      # checkout hides that object and forces the checker into its historical
      # fallback, which would scan unrelated main-branch files.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch PR base and head for delivery-delta guards
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"
          git fetch --no-tags origin "${{ github.event.pull_request.head.sha }}"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The ubuntu-24.04 runner image ships PostgreSQL 16 preinstalled, so
      # the apt path is only a fallback for image changes.
      - name: Ensure PostgreSQL 16 for disposable clusters
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-16
          fi
          echo "HOMA_POSTGRES_BIN=/usr/lib/postgresql/16/bin" >> "$GITHUB_ENV"

      - name: ChildProgress unit and compatibility checks
        run: pnpm check:child-progress

      - name: Progress UI checks
        run: pnpm check:progress-ui

      - name: Map content + scorer checks (claims law, citations, golden kids)
        run: pnpm check:map

      - name: Agent context checks (chart parity, injection escaping)
        run: pnpm check:agent-context

      - name: Agent context budget ratchet (always-on bytes per component)
        run: pnpm check:agent-budget

      - name: Instructions split and voice-mirror invariants (phone persona)
        run: pnpm check:instructions-split

      - name: Runtime prompt asset checks
        run: pnpm check:runtime-prompts

      - name: Eval-host isolation checks (no prod writes from local eval runs)
        run: pnpm check:eval-isolation

      - name: Events-registry parity check (MJ-08)
        run: pnpm check:events

      - name: Tool deadline guard (no unbounded tool can freeze a turn)
        run: pnpm check:tool-deadlines

      - name: Dynamic tool event guard (no tool vanishes on a cold isolate)
        run: pnpm check:dynamic-tool-events

      - name: "No-em-dash style law (AGENTS.md: no em dash, ever, anywhere)"
        run: pnpm check:em-dash

      - name: Fleet-skill package checks (frontmatter, size limits, slash-menu parity)
        run: pnpm check:fleet-skills

      - name: Fleet-skill dormant-window guard (retired files, no live queries)
        run: pnpm check:fleet-skills-dormant

      - name: Skills-bank targeting checks (retired-system regression guard)
        run: pnpm check:skills-targeting

      - name: Taxonomy checks (skill graph integrity, id law, DAG)
        run: pnpm check:taxonomy

      - name: Conversation continuity checks (episodes, replies, deliveries)
        run: pnpm check:continuity

      - name: Homa's tasks UI checks (cards, editor dialog)
        run: pnpm check:tasks-ui

      - name: Hours page checks (day grouping, totals, filter, editor dialog)
        run: pnpm check:hours-ui

      - name: Calendar page checks (per-kid/family lanes, scheduling, voice digest)
        run: pnpm check:calendar-ui

      - name: Dynamic prompt suggestion checks
        run: pnpm check:prompt-suggestions

      # Fixture integrity only, no model calls: free and deterministic.
      # The paid run (pnpm eval:journaling-trigger) measures whether Homa
      # actually journals a mother's report, the stage that failed
      # silently in production until 2026-07-21.
      # The lesson-listen pipeline went fleet-wide 2026-07-21 with its
      # tests never running in CI: the trust gate, the timestamp
      # normalizer, and the pronoun law all guard parent-facing output.
      - name: Lesson pipeline checks
        run: pnpm check:lessons

      - name: Journaling trigger fixtures
        run: pnpm check:journaling-trigger

      - name: Chat UI checks (attachment markers, transcript, worked-for, snap card)
        run: pnpm check:chat-ui

      - name: Job contract registry (schemas parse, skills resolve)
        run: pnpm check:jobs

      - name: Drip checks (eligibility, priority, beat-keyed audiences)
        run: pnpm check:drip

      - name: Billing gate checks (wall exemptions, account access, wall + landing copy pins)
        run: pnpm check:billing

      # Fixture hygiene only, no model call. The paid routing eval is
      # pnpm eval:ask-user-questions, run by hand.
      - name: Choice-card routing fixtures
        run: pnpm check:ask-user-questions

      - name: Materials checks (page shell pagination, packet bodies, binder model)
        run: pnpm check:materials

      - name: Family Library ingestion contract and eval fixtures
        run: pnpm check:family-library-ingestion

      - name: Ingestion ledger (every #homa-inspo drop has exactly one record)
        run: pnpm check:ingestion

  # Guard shard 2 of 3: the Postgres-backed suites and the fast
  # disposable E2Es. See the shard-1 comment for the balancing rule.
  db-checks:
    needs: classify-changes
    if: needs.classify-changes.outputs.scope == 'full'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Voice action receipts run through the full eval sandbox so their
      # compensators are exercised against the complete migration graph.
      # That graph includes semantic recall's vector column.
      - name: Ensure PostgreSQL 16 and pgvector for disposable clusters
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-16 postgresql-16-pgvector
          echo "HOMA_POSTGRES_BIN=/usr/lib/postgresql/16/bin" >> "$GITHUB_ENV"

      - name: Trial claim repair survives a reused PostgreSQL session
        run: pnpm test:trial-claim-repair:postgres

      - name: Morning research brief format
        run: pnpm check:research-brief

      - name: Fleet research controls (dedup, manual request, runner)
        run: pnpm check:research

      - name: Photo search (token signing, result normalization)
        run: pnpm check:photo-search

      - name: Web page reading (scrape normalization, url hygiene)
        run: pnpm check:web-fetch

      - name: Onboarding checks (state, directives, first-making status, job gating)
        run: pnpm check:onboarding

      - name: Materials preview raster E2E (previews must come from the PDF bytes)
        run: pnpm check:materials-preview

      - name: State pack (derivation across all 51 reviewed snapshots)
        run: pnpm check:state-pack

      - name: State pack deadline anchors still match their source text
        run: pnpm check:deadline-anchors

      - name: ChildProgress disposable PostgreSQL E2E
        timeout-minutes: 10
        run: pnpm child-progress:e2e

      - name: Live fixture sandbox classification disposable PostgreSQL E2E
        timeout-minutes: 10
        run: pnpm test:live-fixture-sandbox:postgres

      - name: Issue 606 privacy containment disposable PostgreSQL E2E
        timeout-minutes: 10
        run: |
          pnpm check:issue-606-containment
          pnpm test:issue-606-containment:postgres
          pnpm conversation-privacy:e2e
          pnpm test:issue-606-production-repair:postgres

      - name: Issue 878 production repair disposable PostgreSQL E2E
        timeout-minutes: 10
        run: pnpm test:issue-878-production-repair:postgres

      - name: Issue 878 account deletion containment disposable PostgreSQL E2E
        timeout-minutes: 10
        run: |
          pnpm check:account-deletion-containment
          pnpm test:issue-878-account-deletion-containment:postgres

      - name: Issue 878 account deletion schema release disposable PostgreSQL E2E
        timeout-minutes: 10
        run: |
          pnpm check:account-deletion-schema-release
          pnpm test:issue-878-account-deletion-schema-release:postgres

      - name: Issue 888 production repair disposable PostgreSQL E2E
        timeout-minutes: 10
        run: pnpm test:issue-888-production-repair:postgres

      - name: Issue 887 production repair disposable PostgreSQL E2E
        timeout-minutes: 10
        run: |
          pnpm check:migration-versions
          pnpm test:issue-887-production-repair:postgres

      # hours_log is compliance evidence: the unique index, the cleanup
      # migration, and both writers' raced-insert handling (issue #215).
      - name: hours_log dedupe disposable PostgreSQL E2E
        timeout-minutes: 10
        run: pnpm hours-log:e2e

      - name: Voice action receipts disposable PostgreSQL E2E
        timeout-minutes: 10
        run: pnpm test:voice-action-receipts:postgres

      - name: Recurring family event occurrence disposable PostgreSQL E2E
        timeout-minutes: 10
        run: pnpm test:family-event-occurrences:postgres

      # A retry locks the family-scoped lesson row before failed -> uploaded.
      # This proves concurrent requests consume only one analysis attempt.
      - name: Recorded lesson retry disposable PostgreSQL E2E
        timeout-minutes: 10
        run: pnpm test:lesson-retry:postgres

      - name: Family Library retrieval disposable PostgreSQL E2E
        timeout-minutes: 10
        run: pnpm test:family-library-retrieval:postgres

      - name: Family Library grounded-output disposable PostgreSQL E2E
        timeout-minutes: 10
        run: pnpm test:family-library-output:postgres

      - name: Family curriculum mapping disposable PostgreSQL E2E
        timeout-minutes: 10
        run: pnpm test:family-curriculum-mapping:postgres

      - name: Family Library training provenance disposable PostgreSQL E2E
        timeout-minutes: 10
        run: pnpm test:family-library-training:postgres

      # Planner check-offs are positional until the stable-ID migration.
      # This proves stale clients fail closed and concurrent keys survive.
      - name: Planner stale-safe check-off disposable PostgreSQL E2E
        timeout-minutes: 10
        run: pnpm test:planner-checkoff:postgres

      # A rebuild changes positional activity meaning. This proves old
      # completion is archived, exact matches remap, and clients cannot
      # forge or alter the family-readable receipt.
      - name: Planner rebuild history disposable PostgreSQL E2E
        timeout-minutes: 10
        run: pnpm test:plan-rebuild-history:postgres

      # Scheduling is positional too. This proves a stale plan revision or
      # changed activity text cannot attach a date after a rebuild.
      - name: Planner schedule stale-safe disposable PostgreSQL E2E
        timeout-minutes: 10
        run: pnpm test:plan-schedule-stale-safe:postgres

      - name: Planner learning log disposable PostgreSQL E2E
        timeout-minutes: 10
        run: pnpm test:planner-learning-log:postgres

  # Guard shard 3 of 3: the acceptance E2Es and the two secret-needing
  # database checks, the three longest steps in the roster (each 24-50s),
  # so they share a runner instead of tailing another shard.
  e2e-checks:
    needs: classify-changes
    if: needs.classify-changes.outputs.scope == 'full'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The ubuntu-24.04 runner image ships PostgreSQL 16 preinstalled, so
      # the apt path is only a fallback for image changes.
      - name: Ensure PostgreSQL 16 for disposable clusters
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-16
          fi
          echo "HOMA_POSTGRES_BIN=/usr/lib/postgresql/16/bin" >> "$GITHUB_ENV"

      - name: Morning research brief v2 disposable acceptance
        timeout-minutes: 10
        run: |
          pnpm check:morning-research-brief-v2
          pnpm check:admin

      - name: Conversation continuity database E2E (multi-parent causality)
        run: pnpm continuity:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Tenancy isolation smoke check (M1-07 seed)
        run: pnpm check:isolation
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
