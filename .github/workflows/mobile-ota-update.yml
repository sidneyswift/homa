name: Mobile OTA update

# Keeps installed phone apps in sync with main, IF a production build with
# a matching native fingerprint exists. When mobile code (or the shared
# core package it imports) changes, this publishes an EAS Update: matching
# installed builds download the new JavaScript on next launch, no App
# Store release needed. Native changes (a new package with native code,
# an Expo SDK upgrade) do NOT ship this way; they need a new store build:
#   cd apps/mobile
#   eas build --platform ios --profile production
#   eas submit --platform ios --latest
# The update only applies to builds with a matching native fingerprint, so
# an out-of-date binary can never receive incompatible JavaScript, and (the
# failure mode this workflow silently had for weeks) an up-to-date checkout
# with no matching binary at all publishes into a void. The fingerprint
# guard step below makes that failure loud instead of silent.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mobile-ota-update.yml"
      - "apps/mobile/**"
      - "packages/core/**"
      - "packages/design/**"
  workflow_dispatch: {}

concurrency:
  group: mobile-ota-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: read

jobs:
  publish-update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck mobile
        run: pnpm --filter mobile typecheck

      - name: Event registry and capture-loop staging guard
        run: pnpm check:event-registry

      - name: Mobile chat unit tests
        run: pnpm check:mobile-chat

      - name: Mobile bootstrap unit tests
        run: pnpm check:mobile-bootstrap

      - name: Mobile planner unit tests
        run: pnpm check:mobile-planner

      - name: Mobile Progress unit tests
        run: pnpm check:mobile-progress

      - name: Mobile voice unit tests
        run: pnpm check:mobile-voice

      - name: Mobile accessibility contract
        run: pnpm check:mobile-accessibility

      # A red mobile test suite must never reach an installed phone: this
      # runs before publish, not just in CI, since CI and this workflow
      # fire on the same push independently.

      # EXPO_PUBLIC_ values are inlined into the JavaScript bundle at
      # publish time. Read them from eas.json so OTA updates and store
      # builds always ship the exact same public config.
      - name: Load public app config from eas.json
        working-directory: apps/mobile
        run: jq -r '.build.production.env | to_entries[] | "\(.key)=\(.value)"' eas.json >> "$GITHUB_ENV"

      # expo-updates matches an OTA update to an installed binary by exact
      # native fingerprint. A mismatch is not a warning, it is silence: the
      # 2026-07-27 to 2026-07-28 window published updates for weeks that no
      # installed phone could receive. This must run on a clean checkout
      # (no apps/mobile/ios directory) or it computes a wrong result; see
      # the script's own comment and .agents/skills/ios-release.
      - name: OTA fingerprint guard (refuse to publish into a void)
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: node scripts/check-ota-fingerprint.mjs

      # GitHub starts this workflow and Vercel in parallel. A same-commit
      # mobile client can depend on a new server contract, so publishing the
      # client first would put installed phones in front of an old API.
      - name: Wait for the production web deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 90); do
            # Vercel reports through GitHub's commit-status API, not the
            # check-runs API. The wrong endpoint stranded the 2026-08-02
            # Progress OTA even after its production deployment succeeded.
            state="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status" --jq '(.statuses | map(select(.context == "Vercel")) | sort_by(.created_at) | last) // {state:"missing"} | .state')"
            case "$state" in
              success)
                exit 0
                ;;
              failure|error)
                printf 'Vercel deployment did not succeed: %s\n' "$state"
                exit 1
                ;;
              pending|missing)
                ;;
              *)
                printf 'Unexpected Vercel deployment state: %s\n' "$state"
                exit 1
                ;;
            esac
            sleep 10
          done
          printf 'Timed out waiting for the Vercel deployment check.\n'
          exit 1

      - name: Publish EAS Update to the production channel
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          MSG="$(printf '%s\n' "${COMMIT_MESSAGE:-Manual OTA update}" | head -n 1 | cut -c 1-200)"
          npx eas-cli@21.4.0 update --channel production --environment production --platform ios --non-interactive --message "$MSG"
