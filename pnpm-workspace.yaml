packages:
  - "apps/*"
  - "packages/*"

# pnpm 10 reads patchedDependencies here, not from package.json's "pnpm"
# field (which it now ignores and warns about). Keeps the eve stream-recovery
# patch applied on a clean install (2026-07-11 review, CR-55).
patchedDependencies:
  eve@0.19.0: patches/eve@0.19.0.patch
