<!-- @dsCard group="Colors" viewport="700x150" name="Sage & accents" subtitle="Sage secondary, gold + sky accents" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-card);font-family:var(--font-sans);padding:20px;}
  .row{display:flex;gap:10px;}
  .sw{flex:1;height:82px;border-radius:var(--radius-md);display:flex;flex-direction:column;justify-content:flex-end;padding:8px;box-sizing:border-box;color:#fff;}
  .n{font-size:0.68rem;font-weight:700;}.h{font-size:0.6rem;opacity:0.85;font-family:var(--font-mono);}
</style></head><body>
<div class="row">
  <div class="sw" style="background:var(--sage-300);color:var(--sage-700)"><span class="n">sage 300</span><span class="h">#9AAF82</span></div>
  <div class="sw" style="background:var(--sage-500)"><span class="n">sage 500 ·secondary</span><span class="h">#627A50</span></div>
  <div class="sw" style="background:var(--sage-700)"><span class="n">sage 700</span><span class="h">#3B4C33</span></div>
  <div class="sw" style="background:var(--gold-400);color:#402e05"><span class="n">gold 400</span><span class="h">#E8BE5E</span></div>
  <div class="sw" style="background:var(--gold-500);color:#402e05"><span class="n">gold 500 ·accent</span><span class="h">#D9A441</span></div>
  <div class="sw" style="background:var(--sky-500)"><span class="n">sky 500 ·info</span><span class="h">#6E93A8</span></div>
</div>
</body></html>
