<!-- @dsCard group="Colors" viewport="700x150" name="Stone · warm neutrals" subtitle="Warm-tinted grays for text, borders, surfaces" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-card);font-family:var(--font-sans);padding:20px;}
  .row{display:flex;gap:10px;}
  .sw{flex:1;height:82px;border-radius:var(--radius-md);display:flex;flex-direction:column;justify-content:flex-end;padding:8px;box-sizing:border-box;color:#fff;border:1px solid var(--border-subtle);}
  .n{font-size:0.7rem;font-weight:700;}.h{font-size:0.62rem;opacity:0.85;font-family:var(--font-mono);}
</style></head><body>
<div class="row">
  <div class="sw" style="background:var(--stone-50);color:var(--stone-700)"><span class="n">50</span><span class="h">#FBF7F0</span></div>
  <div class="sw" style="background:var(--stone-100);color:var(--stone-700)"><span class="n">100</span><span class="h">#F3ECE1</span></div>
  <div class="sw" style="background:var(--stone-200);color:var(--stone-700)"><span class="n">200</span><span class="h">#E7DDCE</span></div>
  <div class="sw" style="background:var(--stone-300);color:var(--stone-700)"><span class="n">300</span><span class="h">#D6C8B4</span></div>
  <div class="sw" style="background:var(--stone-400)"><span class="n">400</span><span class="h">#B3A492</span></div>
  <div class="sw" style="background:var(--stone-500)"><span class="n">500</span><span class="h">#8A7D6C</span></div>
  <div class="sw" style="background:var(--stone-600)"><span class="n">600</span><span class="h">#6B6259</span></div>
  <div class="sw" style="background:var(--stone-700)"><span class="n">700</span><span class="h">#4E463E</span></div>
  <div class="sw" style="background:var(--stone-800)"><span class="n">800</span><span class="h">#332E29</span></div>
  <div class="sw" style="background:var(--stone-900)"><span class="n">900</span><span class="h">#221E1A</span></div>
</div>
</body></html>
