<!-- @dsCard group="Social" viewport="1080x1080" name="Notification moment" subtitle="1080×1080 · the suggestion, as a lock-screen story" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Hanken+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;}
  .post{width:1080px;height:1080px;box-sizing:border-box;background:var(--bg-page);padding:92px 88px;display:flex;flex-direction:column;position:relative;font-family:var(--font-sans);}
  .top{display:flex;align-items:center;justify-content:space-between;}
  .wm{font-family:var(--font-display);font-weight:600;font-size:42px;color:var(--text-strong);display:flex;align-items:center;gap:10px;}
  .idx{font-family:var(--font-mono);font-size:23px;letter-spacing:0.1em;color:var(--text-subtle);white-space:nowrap;}
  .rule{height:1px;background:var(--stone-300);margin-top:44px;}
  .eyebrow{font-size:23px;font-weight:700;letter-spacing:0.22em;text-transform:uppercase;color:var(--brand);margin-top:66px;}
  .headline{font-family:var(--font-display);font-size:96px;line-height:0.99;font-weight:500;color:var(--text-strong);letter-spacing:-0.025em;margin:24px 0 0;}
  .headline em{font-style:italic;font-weight:400;color:var(--clay-600);}
  .notif{margin-top:56px;background:rgba(255,255,255,0.92);border-radius:36px;box-shadow:var(--shadow-xl);padding:34px 38px;max-width:820px;}
  .nhead{display:flex;align-items:center;gap:16px;margin-bottom:16px;}
  .nicon{width:64px;height:64px;border-radius:16px;background:var(--brand);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .nname{font-weight:700;font-size:27px;color:var(--text-strong);}
  .ntime{font-family:var(--font-mono);font-size:21px;color:var(--text-subtle);margin-left:auto;}
  .nbody{font-size:29px;line-height:1.45;color:var(--text-body);}
  .nbtns{display:flex;gap:14px;margin-top:22px;}
  .nb{padding:14px 28px;border-radius:999px;font-size:24px;font-weight:700;}
  .nb.go{background:var(--brand);color:#fff;}
  .nb.later{background:var(--stone-100);color:var(--text-muted);}
  .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;font-size:24px;color:var(--text-subtle);}
  .foot .brand{font-family:var(--font-display);font-style:italic;font-size:30px;color:var(--text-muted);}
</style></head><body>
<div class="post">
  <div class="top">
    <div class="wm"><svg width="38" height="38" viewBox="0 0 48 48" fill="none" stroke="var(--brand)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M9 22 L24 9 L39 22 V37 A2 2 0 0 1 37 39 H11 A2 2 0 0 1 9 37 Z"/><path d="M24 20 C24.7 25 25.5 25.8 30 26.5 C25.5 27.2 24.7 28 24 33 C23.3 28 22.5 27.2 18 26.5 C22.5 25.8 23.3 25 24 20 Z" fill="var(--brand)" stroke="none"/></svg>HOMA</div>
    <div class="idx">No. 12</div>
  </div>
  <div class="rule"></div>
  <div class="eyebrow">She&rsquo;s already on it</div>
  <div class="headline">She knows what<br>Saturday is <em>for</em>.</div>
  <div class="notif">
    <div class="nhead">
      <div class="nicon"><svg width="38" height="38" viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M9 22 L24 9 L39 22 V37 A2 2 0 0 1 37 39 H11 A2 2 0 0 1 9 37 Z"/><path d="M24 20 C24.7 25 25.5 25.8 30 26.5 C25.5 27.2 24.7 28 24 33 C23.3 28 22.5 27.2 18 26.5 C22.5 25.8 23.3 25 24 20 Z" fill="#fff" stroke="none"/></svg></div>
      <span class="nname">HOMA</span>
      <span class="ntime">now</span>
    </div>
    <div class="nbody">Maya&rsquo;s on her space unit this week, and the Bullock has a family space day Saturday. Want me to hold tickets?</div>
    <div class="nbtns"><span class="nb go">Get tickets</span><span class="nb later">Not this week</span></div>
  </div>
  <div class="foot"><span>#homeschool · #fieldtrip</span><span class="brand">homeschooling, made calm</span></div>
</div>
</body></html>
