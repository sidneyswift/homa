<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Web App Shell" description="HOMA app shell, sidebar nav, greeting header, dashboard cards. Built on the design system." -->
<helmet>
<script src="./ds-base.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>(()=>{let n=0;const t=setInterval(()=>{if(window.lucide){window.lucide.createIcons();}if(++n>25)clearInterval(t);},200);})();</script>
</helmet>
<div style="display:flex;height:100vh;background:var(--bg-page);font-family:var(--font-sans);overflow:hidden;">

  <aside style="width:248px;flex-shrink:0;background:var(--surface-card);border-right:1px solid var(--border-subtle);display:flex;flex-direction:column;padding:20px 14px;">
    <div style="padding:4px 10px 22px;">
      <x-import component-from-global-scope="HOMADesignSystem_113bd2.Logo" size="26" hint-size="120px,30px"></x-import>
    </div>
    <nav style="display:flex;flex-direction:column;gap:2px;">
      <a href="#" style="display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--radius-md);background:var(--brand-soft);color:var(--clay-700);font-weight:700;text-decoration:none;"><i data-lucide="sparkles" style="width:20px;height:20px;"></i>Ask HOMA</a>
      <a href="#" style="display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--radius-md);color:var(--text-muted);font-weight:500;text-decoration:none;"><i data-lucide="chart-line" style="width:20px;height:20px;"></i>Progress</a>
      <a href="#" style="display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--radius-md);color:var(--text-muted);font-weight:500;text-decoration:none;"><i data-lucide="calendar" style="width:20px;height:20px;"></i>Week planner</a>
      <a href="#" style="display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--radius-md);color:var(--text-muted);font-weight:500;text-decoration:none;"><i data-lucide="file-pen" style="width:20px;height:20px;"></i>Worksheets</a>
    </nav>
    <div style="margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px;border-top:1px solid var(--border-subtle);">
      <span style="width:34px;height:34px;border-radius:50%;background:var(--sage-500);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;">S</span>
      <div><div style="font-size:0.85rem;font-weight:600;color:var(--text-body);">Sarah</div><div style="font-size:0.72rem;color:var(--text-subtle);">Family plan</div></div>
    </div>
  </aside>

  <main style="flex:1;overflow-y:auto;padding:32px 40px;">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:28px;">
      <div>
        <div style="font-size:0.68rem;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--text-subtle);">Tuesday, May 13</div>
        <h1 style="font-family:var(--font-display);font-size:2rem;font-weight:500;color:var(--text-strong);letter-spacing:-0.02em;margin:6px 0 0;">Good morning, Sarah</h1>
      </div>
      <x-import component-from-global-scope="HOMADesignSystem_113bd2.Button" hint-size="160px,44px">Auto-plan this week</x-import>
    </div>

    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:22px;">
      <x-import component-from-global-scope="HOMADesignSystem_113bd2.Card" padding="md" hint-size="100%,120px">
        <div style="font-size:0.8rem;color:var(--text-muted);font-weight:600;">Streak</div>
        <div style="font-family:var(--font-display);font-size:2rem;font-weight:600;color:var(--text-strong);margin-top:6px;">12 days</div>
      </x-import>
      <x-import component-from-global-scope="HOMADesignSystem_113bd2.Card" padding="md" hint-size="100%,120px">
        <div style="font-size:0.8rem;color:var(--text-muted);font-weight:600;">This week</div>
        <div style="font-family:var(--font-display);font-size:2rem;font-weight:600;color:var(--text-strong);margin-top:6px;">9.5 hrs</div>
      </x-import>
      <x-import component-from-global-scope="HOMADesignSystem_113bd2.Card" padding="md" hint-size="100%,120px">
        <div style="font-size:0.8rem;color:var(--text-muted);font-weight:600;">Milestones</div>
        <div style="font-family:var(--font-display);font-size:2rem;font-weight:600;color:var(--text-strong);margin-top:6px;">7</div>
      </x-import>
    </div>

    <x-import component-from-global-scope="HOMADesignSystem_113bd2.Callout" tone="sage" title="A note from HOMA" hint-size="100%,90px">
      Maya&rsquo;s right on pace for the term, and her reading is really taking off. Nothing to worry about this week.
    </x-import>
  </main>

</div>
</x-dc>
</body>
</html>
