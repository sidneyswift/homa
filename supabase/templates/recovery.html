<!doctype html>
<html lang="en">
  <body style="margin: 0; background: #f6f7f2; color: #262925; font-family: Arial, sans-serif;">
    <div style="margin: 0 auto; max-width: 560px; padding: 40px 24px;">
      <h1 style="font-size: 28px; line-height: 1.2; margin: 0;">Reset your Homa password</h1>
      <p style="font-size: 16px; line-height: 1.6; margin: 20px 0 0;">
        A password reset was requested for your Homa account.
      </p>
      <p style="margin: 28px 0;">
        <a
          href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=recovery"
          style="background: #235c4b; border-radius: 999px; color: #ffffff; display: inline-block; font-size: 16px; font-weight: 700; padding: 14px 22px; text-decoration: none;"
        >Choose a new password</a>
      </p>
      <p style="font-size: 14px; line-height: 1.6; margin: 0;">
        If you did not ask to reset your password, you can ignore this email. Your password will stay the same.
      </p>
    </div>
  </body>
</html>
