<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Homa report loading screen · refined prototype</title>
  <style>
    :root {
      --stone-50: #fbf7f0;
      --stone-100: #f3ece1;
      --stone-200: #e7ddce;
      --stone-300: #d6c8b4;
      --stone-500: #8a7d6c;
      --stone-600: #6b6259;
      --stone-800: #332e29;
      --stone-900: #221e1a;
      --clay-50: #fff0e8;
      --clay-100: #ffddc9;
      --clay-300: #fb9868;
      --clay-400: #f1793f;
      --clay-500: #e7602f;
      --clay-600: #c44c22;
      --clay-700: #9c3b1b;
      --sage-50: #eaf6ec;
      --sage-100: #d2ecd6;
      --sage-500: #3d9a50;
      --sage-600: #2f7c40;
      --sage-700: #275f34;
      --gold-100: #fff3c2;
      --gold-300: #ffe175;
      --gold-400: #ffd43b;
      --gold-ink: #8a6410;
      --gold-ink-strong: #402e05;
      --sky-100: #ddf3f9;
      --sky-300: #9fdcec;
      --sky-500: #4fb4d6;
      --pop-navy: #23304f;
      --font-display: "Schibsted Grotesk", "Avenir Next", "Segoe UI", sans-serif;
      --font-sans: "Hanken Grotesk", "Avenir Next", "Segoe UI", sans-serif;
      --font-serif: "EB Garamond", Georgia, serif;
      --font-wordmark: Fredoka, "Arial Rounded MT Bold", sans-serif;
      --font-mono: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
      --ease-out: cubic-bezier(.22, .8, .28, 1);
      --shadow-sm: 0 1px 3px rgba(51, 42, 33, .08), 0 1px 2px rgba(51, 42, 33, .04);
      --shadow-lg: 0 12px 28px rgba(51, 42, 33, .10), 0 4px 10px rgba(51, 42, 33, .05);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: var(--stone-50);
      color: var(--stone-800);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }
    button:focus-visible {
      outline: 3px solid rgba(241, 121, 63, .36);
      outline-offset: 3px;
    }

    .screen {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-height: 100svh;
      padding: 22px clamp(18px, 4vw, 52px) 18px;
    }
    .topbar {
      display: flex;
      width: min(1080px, 100%);
      margin-inline: auto;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .brand-word {
      display: inline-flex;
      margin-top: -1px;
      color: var(--stone-900);
      font-family: var(--font-wordmark);
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1;
    }
    .brand-word span:nth-child(1) { transform: translateY(-.05em) rotate(-3deg); }
    .brand-word span:nth-child(2) { transform: translateY(.05em); }
    .brand-word span:nth-child(3) { transform: translateY(-.04em) rotate(2deg); }
    .brand-word span:nth-child(4) { transform: translateY(.06em) rotate(-2deg); }
    .prototype-badge {
      border: 1px solid var(--gold-300);
      border-radius: 999px;
      background: var(--gold-100);
      padding: 7px 10px;
      color: var(--gold-ink-strong);
      font-family: var(--font-mono);
      font-size: .6rem;
      font-weight: 600;
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    .loading {
      display: grid;
      width: min(660px, 100%);
      margin: auto;
      align-content: center;
      padding-block: 28px;
    }
    .status-header {
      text-align: center;
    }
    .status-header h1 {
      margin: 0;
      color: var(--stone-900);
      font-family: var(--font-display);
      font-size: clamp(1.7rem, 4vw, 2.65rem);
      line-height: 1.08;
      letter-spacing: -.025em;
    }
    .status-header p {
      max-width: 560px;
      margin: 8px auto 0;
      color: var(--stone-600);
      font-size: .92rem;
      line-height: 1.5;
    }
    .real-status {
      display: inline-flex;
      margin-top: 14px;
      align-items: center;
      gap: 7px;
      border: 1px solid var(--sky-300);
      border-radius: 999px;
      background: var(--sky-100);
      padding: 7px 11px;
      color: var(--pop-navy);
      font-size: .7rem;
      font-weight: 750;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--sky-500);
      animation: breathe 1600ms var(--ease-out) infinite;
    }

    .idea-card {
      display: grid;
      min-height: 380px;
      margin-top: 24px;
      border: 1px solid var(--stone-200);
      border-radius: 22px;
      background: #fff;
      padding: clamp(24px, 5vw, 42px);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      transition: border-color 160ms var(--ease-out), transform 160ms var(--ease-out), box-shadow 160ms var(--ease-out);
    }
    .idea-card[data-interactive="true"] {
      cursor: pointer;
    }
    .idea-card[data-interactive="true"]:hover {
      transform: translateY(-1px);
      border-color: var(--clay-300);
      box-shadow: var(--shadow-lg);
    }
    .idea-card:focus-visible {
      outline: 3px solid rgba(241, 121, 63, .36);
      outline-offset: 3px;
    }
    .idea {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      align-items: center;
      text-align: center;
      animation: idea-in 320ms var(--ease-out) both;
    }
    .idea-copy {
      min-width: 0;
      max-width: 540px;
      margin-inline: auto;
    }
    .eyebrow {
      color: var(--clay-600);
      font-family: var(--font-mono);
      font-size: .7rem;
      font-weight: 650;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .idea-copy h2 {
      margin: 8px 0 0;
      color: var(--stone-900);
      font-family: var(--font-display);
      font-size: clamp(1.65rem, 4vw, 2.7rem);
      line-height: 1.04;
      letter-spacing: -.03em;
    }
    .idea-copy h2 span { color: var(--clay-600); }
    .idea-copy p {
      margin: 12px 0 0;
      color: var(--stone-600);
      font-size: .93rem;
      line-height: 1.55;
    }
    .visual {
      display: grid;
      width: min(430px, 100%);
      min-height: 170px;
      margin-inline: auto;
      place-items: center;
    }

    .quote {
      width: 100%;
      border-radius: 18px;
      background:
        linear-gradient(90deg, transparent 0 22px, rgba(231, 96, 47, .28) 22px 24px, transparent 24px),
        repeating-linear-gradient(to bottom, #fff 0, #fff 29px, rgba(46, 107, 230, .08) 29px, rgba(46, 107, 230, .08) 30px);
      padding: 22px 20px 22px 40px;
      color: var(--stone-800);
      font-family: var(--font-serif);
      font-size: 1.18rem;
      font-style: italic;
      line-height: 1.45;
      box-shadow: var(--shadow-sm);
    }
    .quote small {
      display: block;
      margin-top: 10px;
      color: var(--stone-600);
      font-family: var(--font-sans);
      font-size: .75rem;
      font-style: normal;
    }

    .question-path {
      display: grid;
      width: 100%;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      align-items: center;
    }
    .math-card {
      border: 1px solid var(--stone-200);
      border-radius: 18px;
      background: var(--stone-50);
      padding: 20px 12px;
      color: var(--stone-900);
      font-family: var(--font-display);
      font-size: 1.2rem;
      font-weight: 700;
      text-align: center;
    }
    .math-card.next {
      border-color: var(--gold-300);
      background: var(--gold-100);
      color: var(--gold-ink-strong);
    }
    .path-arrow {
      width: 32px;
      height: 2px;
      border-radius: 2px;
      background: var(--stone-300);
    }
    .path-arrow::after {
      display: block;
      width: 7px;
      height: 7px;
      margin: -3px 0 0 auto;
      transform: rotate(45deg);
      border-top: 2px solid var(--stone-300);
      border-right: 2px solid var(--stone-300);
      content: "";
    }
    .dinosaur-math {
      display: grid;
      width: 100%;
      gap: 12px;
      border-radius: 22px;
      background: var(--clay-50);
      padding: 22px;
    }
    .fossil-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--clay-700);
      font-size: .75rem;
      font-weight: 750;
    }
    .fossil {
      width: 24px;
      height: 18px;
      transform: rotate(var(--turn, 0deg));
      border: 2px solid var(--clay-400);
      border-radius: 55% 45% 60% 40%;
      background: #fff;
    }
    .rounds {
      display: grid;
      width: 100%;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .round {
      min-height: 94px;
      border: 1px solid var(--sage-500);
      border-radius: 16px;
      background: var(--sage-50);
      padding: 14px 10px;
    }
    .round small {
      color: var(--sage-700);
      font-family: var(--font-mono);
      font-size: .65rem;
      letter-spacing: .07em;
      text-transform: uppercase;
    }
    .round strong {
      display: block;
      margin-top: 7px;
      color: var(--stone-900);
      font-size: .72rem;
    }

    .card-action {
      display: flex;
      width: min(320px, 100%);
      justify-self: center;
      justify-content: center;
      border-radius: 999px;
      background: var(--clay-50);
      padding: 10px 14px;
      color: var(--clay-700);
      font-size: .75rem;
      font-weight: 750;
    }
    .end-note {
      margin: 14px 0 0;
      color: var(--stone-600);
      font-size: .72rem;
      text-align: center;
    }
    .end-note {
      border-radius: 16px;
      background: var(--sage-50);
      padding: 12px 14px;
      color: var(--sage-700);
      font-weight: 650;
    }

    @keyframes breathe {
      0%, 100% { opacity: .45; transform: scale(.85); }
      50% { opacity: 1; transform: scale(1); }
    }
    @keyframes idea-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }

    @media (max-width: 680px) {
      .screen {
        padding: 16px 14px 12px;
      }
      .loading {
        padding-block: 22px;
      }
      .status-header {
        text-align: left;
      }
      .status-header p {
        margin-inline: 0;
      }
      .idea-card {
        min-height: 420px;
        margin-top: 18px;
        border-radius: 22px;
        padding: 24px 20px;
      }
      .idea {
        gap: 20px;
      }
      .idea-copy h2 {
        font-size: 2rem;
      }
      .visual {
        min-height: 170px;
      }
    }

    @media (max-width: 390px) {
      .prototype-badge {
        max-width: 135px;
        white-space: normal;
        text-align: center;
      }
      .idea-copy h2 {
        font-size: 1.75rem;
      }
      .rounds {
        gap: 5px;
      }
      .round {
        min-height: 84px;
        padding-inline: 8px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="screen" aria-busy="true">
    <header class="topbar">
      <div class="brand" aria-label="Homa">
        <span id="logo-mark"></span>
        <span class="brand-word" aria-hidden="true"><span>H</span><span>o</span><span>m</span><span>a</span></span>
      </div>
      <span class="prototype-badge">Demo · invented family data</span>
    </header>

    <section class="loading" aria-label="Maya's report loading screen">
      <div class="status-header">
        <h1>Building Maya’s progress report</h1>
        <p>Your answers are saved. You can leave and come back.<br>HOMA will email the report link when it is ready.</p>
        <div class="real-status" role="status" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          Report status · writing
        </div>
      </div>

      <article class="idea-card" id="idea-card"></article>

      <p class="end-note" id="end-note" hidden>Ideas complete. HOMA is still writing Maya’s report.</p>
    </section>

  </main>

  <script>
    const HOUSE_PATH = "M24 5.6 C22.5 5.6 21 6.2 19.8 7.3 L7.1 18.9 C5.5 20.4 4.6 22.5 4.6 24.7 L4.6 35.2 C4.6 40.1 8.5 44 13.4 44 L34.6 44 C39.5 44 43.4 40.1 43.4 35.2 L43.4 24.7 C43.4 22.5 42.5 20.4 40.9 18.9 L28.2 7.3 C27 6.2 25.5 5.6 24 5.6 Z";
    document.getElementById("logo-mark").innerHTML = `
      <svg width="25" height="25" viewBox="0 0 48 48" aria-hidden="true" style="display:block">
        <path d="${HOUSE_PATH}" fill="var(--clay-500)"></path>
        <circle cx="17.4" cy="26" r="4.8" fill="#fff"></circle>
        <circle cx="30.6" cy="26" r="4.8" fill="#fff"></circle>
        <circle cx="18.3" cy="26.7" r="2.2" fill="#221e1a"></circle>
        <circle cx="31.5" cy="26.7" r="2.2" fill="#221e1a"></circle>
      </svg>`;

    const IDEAS = [
      {
        eyebrow: "What HOMA starts with",
        title: "What Maya <span>can do.</span>",
        body: "This answer stays with Maya’s report.",
        visual: `
          <div class="quote">
            “Maya worked out 7 plus 2 in their head without counting.”
            <small>From Elena’s answer</small>
          </div>`,
      },
      {
        eyebrow: "How HOMA uses the full report",
        title: "HOMA uses <span>every answer.</span>",
        body: "Age-based learning guides help HOMA organize Maya’s answers and choose what to ask next.",
        visual: `
          <div class="question-path">
            <div class="math-card">Maya’s answers</div>
            <span class="path-arrow" aria-hidden="true"></span>
            <div class="math-card next">Age-based learning guides</div>
          </div>`,
      },
      {
        eyebrow: "Example of a later follow-up",
        title: "HOMA can ask <span>you one question later.</span>",
        body: "The report does not wait for this. HOMA can later ask whether Maya uses 7 + 7 to solve 7 + 8.",
        visual: `
          <div class="question-path">
            <div class="math-card">7 + 7</div>
            <span class="path-arrow" aria-hidden="true"></span>
            <div class="math-card next">7 + 8</div>
          </div>`,
      },
      {
        eyebrow: "Example practice · Maya’s interests",
        title: "Dinosaurs can make <span>the example familiar.</span>",
        body: "A dinosaur page can practice the same addition question.",
        visual: `
          <div class="dinosaur-math">
            <div class="fossil-label" aria-hidden="true">
              <span class="fossil"></span>
              Dinosaur fossil cards
            </div>
            <div class="question-path">
              <div class="math-card">5 + 5 = 10</div>
              <span class="path-arrow" aria-hidden="true"></span>
              <div class="math-card next">5 + 6 = ?</div>
            </div>
          </div>`,
      },
      {
        eyebrow: "Example practice · shorter lessons",
        title: "Short lessons can have <span>clear stopping points.</span>",
        body: "A saved preference can split one page into three short rounds.",
        visual: `
          <div class="rounds">
            <div class="round"><small>Round 1</small><strong>One together</strong></div>
            <div class="round"><small>Round 2</small><strong>One for Maya</strong></div>
            <div class="round"><small>Round 3</small><strong>Stop or add one</strong></div>
          </div>`,
      },
    ];

    let ideaIndex = 0;

    const card = document.getElementById("idea-card");
    const endNote = document.getElementById("end-note");

    function ideaMarkup(idea, atEnd) {
      return `
        <div class="idea">
          <div class="idea-copy">
            <span class="eyebrow">${idea.eyebrow}</span>
            <h2>${idea.title}</h2>
            <p>${idea.body}</p>
          </div>
          <div class="visual">${idea.visual}</div>
          ${atEnd ? "" : `<span class="card-action">Tap anywhere on this card for the next idea</span>`}
        </div>`;
    }

    function renderIdea() {
      const atEnd = ideaIndex === IDEAS.length - 1;
      card.innerHTML = ideaMarkup(IDEAS[ideaIndex], atEnd);
      card.dataset.interactive = String(!atEnd);
      if (atEnd) {
        card.removeAttribute("role");
        card.removeAttribute("tabindex");
        card.removeAttribute("aria-label");
      } else {
        card.setAttribute("role", "button");
        card.setAttribute("tabindex", "0");
        card.setAttribute("aria-label", "Show next idea");
      }
      endNote.hidden = !atEnd;
    }

    function advanceIdea() {
      if (ideaIndex === IDEAS.length - 1) return;
      ideaIndex += 1;
      renderIdea();
    }

    card.addEventListener("click", advanceIdea);
    card.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" && event.key !== " ") return;
      event.preventDefault();
      advanceIdea();
    });

    renderIdea();
  </script>
</body>
</html>
