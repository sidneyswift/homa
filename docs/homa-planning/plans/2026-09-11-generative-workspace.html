:root{--canvas:#F7F4EE;--ink:#20242B;--paper:#FFFEFC;--midnight:#27374D;--coral:#E7602F;--line:#918B83;--muted:color-mix(in srgb,var(--ink) 64%,var(--canvas));--soft:color-mix(in srgb,var(--line) 28%,transparent)}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:16px/1.5 'DM Sans',sans-serif}button,input{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid var(--midnight);outline-offset:4px}button:disabled{opacity:.5;cursor:default}
button{border:1px solid var(--soft);border-radius:12px;background:var(--paper);padding:12px 16px;min-height:44px}button:hover{border-color:var(--line)}button.primary,button[aria-pressed=true]{background:var(--midnight);color:var(--paper);border-color:var(--midnight)}
.screen{min-height:100svh;display:flex;flex-direction:column;position:relative;padding:32px 24px 24px}.stage{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:64px 0 40px;gap:24px}.identity{display:flex;flex-direction:column;align-items:center;text-align:center;max-width:600px;width:100%}
.character{width:120px;height:120px;display:grid;place-items:center;position:relative;isolation:isolate;flex-shrink:0}.character img{width:64px;height:64px;transform:none}.character::before{content:'';position:absolute;inset:-12px;border-radius:50%;z-index:-1;background:radial-gradient(circle,color-mix(in srgb,var(--coral) 24%,transparent),color-mix(in srgb,var(--coral) 10%,transparent) 42%,transparent 70%);opacity:0;transform:scale(1)}
[data-speaking=true] .character::before{opacity:.65;animation:voice-halo 320ms cubic-bezier(.5,0,0.2,1) infinite alternate}@keyframes voice-halo{from{opacity:.55;transform:scale(.98)}to{opacity:.85;transform:scale(1.02)}}
.status{font-size:14px;color:var(--muted);margin:12px 0 0}.utterance{font-size:clamp(20px,3vw,28px);line-height:1.4;letter-spacing:-.02em;margin:20px 0 0;max-width:560px;text-wrap:balance}.utterance:empty{display:none}
.controls{display:flex;justify-content:center;gap:24px;margin:0 auto;padding:16px 0 40px}.control{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;padding:0;min-width:64px;font-size:13px}.control:hover{background:none}.control .icon{width:56px;height:56px;border:1px solid var(--soft);border-radius:50%;display:grid;place-items:center;background:var(--paper)}.control.active .icon{background:var(--midnight);color:var(--paper)}svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.review-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:1440px;width:100%;margin:0 auto;font-size:12px;color:var(--muted)}.review-bar button{padding:8px 12px;font-size:13px;background:transparent;border-color:transparent}.review-bar button:hover{border-color:var(--soft)}
.work-card{width:min(100%,420px);border:1px solid var(--soft);border-radius:18px;background:var(--paper);padding:20px}.work-card .meta{font-size:13px;color:var(--muted);margin:0 0 8px}.work-card h2{font-size:18px;line-height:1.4;margin:0 0 8px}.work-card p{margin:0;font-size:14px;color:var(--muted)}.work-card button{margin-top:20px;width:100%}.progress{display:flex;gap:8px;align-items:center;font-size:13px;margin-top:16px}.progress i{width:8px;height:8px;border-radius:50%;background:var(--coral)}
.composer{display:flex;gap:8px;width:min(100%,600px);margin:0 auto 32px}.composer input{min-width:0;flex:1;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}.text-note{max-width:520px;font-size:16px;text-align:center}.quiet .character{width:56px;height:56px}.quiet .character img{width:32px;height:32px}.quiet .character::before,.paused .character::before,.ended .character::before{display:none}
dialog{width:min(420px,calc(100% - 32px));max-height:calc(100svh - 48px);overflow:auto;background:var(--paper);color:var(--ink);border:1px solid var(--soft);border-radius:18px;padding:24px}dialog::backdrop{background:color-mix(in srgb,var(--ink) 14%,transparent)}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}.dialog-head h2{font-size:20px;margin:0}.dialog-head button{font-size:13px}.state-list{display:grid;gap:8px}.state-list button{text-align:left}.state-list small{display:block;font-size:13px;font-weight:400}.dialog-note{font-size:12px;color:var(--muted);margin:16px 0 0}.paper h3{font:600 28px/1.1 'EB Garamond',serif}.paper p{font-size:14px}.tracing{font:600 56px/1.8 'EB Garamond',serif;word-spacing:16px;color:var(--paper);-webkit-text-stroke:1px var(--line);border-bottom:1px solid var(--soft)}
@media(max-width:600px){.screen{padding:20px 20px 12px}.stage{padding:48px 0 24px;gap:20px}.controls{padding-bottom:24px;gap:20px}.character{width:104px;height:104px}.utterance{font-size:22px}.work-card{padding:16px}.review-bar{font-size:11px}.composer{margin-bottom:20px}.composer button{padding:12px}.quiet .stage{padding-top:32px}}
@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important;transform:none!important}}
</style></head><body>
<main class="screen" id="screen"></main>
<dialog id="states" aria-labelledby="states-title"><div class="dialog-head"><h2 id="states-title">Preview a state</h2><button data-close>Close</button></div><div class="state-list" id="state-list"></div><p class="dialog-note">Design preview only. No microphone, audio, model, or family data is connected.</p></dialog>
<dialog id="worksheet" aria-labelledby="worksheet-title"><div class="dialog-head"><h2 id="worksheet-title">Sample worksheet</h2><button data-close>Close</button></div><div class="paper"><p>For Cleo · fictional sample</p><h3>Little m,<br>big practice.</h3><p>Trace each m. Take your time.</p><div class="tracing">m m m</div><div class="tracing">m m m</div><div class="tracing">m m m</div></div></dialog>
<script>
const MARK='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0OCA0OCI+CiAgPCEtLSBUaGUgbGl0dGxlLWhvbWUgbWFyayBmcm9tIHRoZSByZWFsIExvZ28gY29tcG9uZW50LCB0b2tlbiB2YWx1ZXMKICAgICAgIGlubGluZWQuIEdlbmVyYXRlZCBieSBzY3JpcHRzL2JyYW5kLWFzc2V0cy5tdHMsIGRvIG5vdCBlZGl0IGJ5IGhhbmQuIC0tPgogIDxwYXRoIGQ9Ik0yNCA1LjYgQzIyLjUgNS42IDIxIDYuMiAxOS44IDcuMyBMNy4xIDE4LjkgQzUuNSAyMC40IDQuNiAyMi41IDQuNiAyNC43IEw0LjYgMzUuMiBDNC42IDQwLjEgOC41IDQ0IDEzLjQgNDQgTDM0LjYgNDQgQzM5LjUgNDQgNDMuNCA0MC4xIDQzLjQgMzUuMiBMNDMuNCAyNC43IEM0My40IDIyLjUgNDIuNSAyMC40IDQwLjkgMTguOSBMMjguMiA3LjMgQzI3IDYuMiAyNS41IDUuNiAyNCA1LjYgWiIgZmlsbD0iI0U3NjAyRiIvPgogIDxjaXJjbGUgY3g9IjE3LjQiIGN5PSIyNiIgcj0iNC44IiBmaWxsPSIjRkZGRUZDIi8+CiAgPGNpcmNsZSBjeD0iMzAuNiIgY3k9IjI2IiByPSI0LjgiIGZpbGw9IiNGRkZFRkMiLz4KICA8Y2lyY2xlIGN4PSIxOC4zIiBjeT0iMjYuNyIgcj0iMi4yIiBmaWxsPSIjMjAyNDJCIi8+CiAgPGNpcmNsZSBjeD0iMzEuNSIgY3k9IjI2LjciIHI9IjIuMiIgZmlsbD0iIzIwMjQyQiIvPgo8L3N2Zz4K';
const states=[['listening','Listening','Voice just started'],['thinking','Thinking','Homa is preparing a reply'],['speaking','Speaking','Homa answers'],['working','Working in the background','You can keep talking'],['ready','Something is ready','A result arrives'],['paused','Voice paused','Microphone and audio off'],['text','Text only','Keep the same conversation'],['ended','Conversation ended','Start again when you want']];
let current='listening',quiet=false,paused=false,talking=false,timer,latestMessage='';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icons={mic:'<rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/>',text:'<rect x="2" y="4" width="20" height="16" rx="3"/><path d="M6 8h1m4 0h1m4 0h1M6 12h1m4 0h1m4 0h1M7 16h10"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',play:'<path d="m8 4 12 8-12 8z"/>'};
function control(action,label,icon,active=false){return `<button class="control ${active?'active':''}" data-action="${action}"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true">${icons[icon]}</svg></span><span>${label}</span></button>`}
function render(){const focus=document.activeElement?.dataset.action;const speaking=!quiet&&!paused&&talking;const status=quiet?'Text only':paused?'Voice paused':({listening:'Listening',thinking:'Thinking',speaking:'Speaking',working:'Listening',ready:talking?'Speaking':'Listening',ended:'Voice ended'})[current];const utterance=quiet?'':paused?'':({speaking:'What would make today a little easier?',ready:'Cleo’s worksheet is ready. Take a look.'})[current]||'';
const card=['working','ready'].includes(current)?`<section class="work-card" aria-label="Worksheet task"><p class="meta">For Cleo</p><h2>${current==='working'?'Making your tracing sheet':'Little m, big practice'}</h2><p>${current==='working'?(quiet?'You can keep typing while I work.':paused?'Your sheet is still in progress.':'You can keep talking while I work.'):'One page of lowercase m tracing.'}</p>${current==='working'?'<div class="progress"><i></i>Building the page</div>':'<button class="primary" data-action="preview">Open worksheet</button>'}</section>`:'';
$('screen').className='screen '+(quiet?'quiet':paused?'paused':current==='ended'?'ended':'');$('screen').innerHTML=`<div class="stage"><section class="identity" data-speaking="${speaking}" aria-label="Homa"><div class="character"><img src="${MARK}" alt="Homa"></div><p class="status" role="status">${status}</p><p class="utterance">${utterance}</p>${quiet?'<p class="status">Microphone off. Replies stay on screen.</p>':''}</section>${card}${quiet&&latestMessage?`<p class="text-note">${esc(latestMessage)}</p>`:''}</div>${quiet?'<form class="composer" id="composer"><input aria-label="Message" id="message" placeholder="Type a message…" autocomplete="off"><button type="submit">Send sample</button></form>':''}<nav class="controls" aria-label="Conversation controls">${current==='ended'?control('restart','Start voice','play'):quiet?control('voice','Use voice','mic')+control('end','End','close'):control('mute',paused?'Resume':'Mute','mic',paused)+control('text','Text only','text')+control('end','End','close')}</nav><footer class="review-bar"><span>Concept · no audio or model</span><button data-action="states">States</button></footer>`;
$('state-list').innerHTML=states.map(([id,name,description])=>`<button data-state="${id}" aria-pressed="${id==='text'?quiet:id===current&&!quiet}">${name}<small>${description}</small></button>`).join('');if(focus)document.querySelector(`[data-action="${focus}"]`)?.focus();}
function choose(state){clearTimeout(timer);current=state==='text'?'listening':state;quiet=state==='text';paused=state==='paused';latestMessage='';talking=['speaking','ready'].includes(state);render();if(talking)timer=setTimeout(()=>{talking=false;if(current==='speaking')current='listening';render()},8000);}
const openers=new WeakMap();function openDialog(id){openers.set($(id),document.activeElement);$(id).showModal();$(id).querySelector('button').focus()}
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;if(b.hasAttribute('data-close')){b.closest('dialog').close();return}if(b.dataset.state){choose(b.dataset.state);$('states').close();return}switch(b.dataset.action){case'states':openDialog('states');break;case'preview':openDialog('worksheet');break;case'mute':clearTimeout(timer);talking=false;if(current==='speaking')current='listening';paused=!paused;if(!paused&&current==='paused')current='listening';render();break;case'text':clearTimeout(timer);talking=false;if(current==='speaking')current='listening';quiet=true;paused=false;render();$('message').focus();break;case'voice':quiet=false;paused=false;if(current==='paused')current='listening';render();document.querySelector('[data-action="mute"]').focus();break;case'end':choose('ended');document.querySelector('[data-action="restart"]').focus();break;case'restart':choose('listening');document.querySelector('[data-action="mute"]').focus();break}});
document.addEventListener('submit',event=>{if(event.target.id!=='composer')return;event.preventDefault();const value=$('message').value.trim();if(!value)return;latestMessage='Sample reply: Of course. We can keep this quiet.';render();$('message').focus()});
for(const dialog of document.querySelectorAll('dialog')){dialog.addEventListener('close',()=>{const old=openers.get(dialog);if(old?.isConnected)old.focus();else document.querySelector('[data-action="states"]')?.focus()});dialog.addEventListener('keydown',event=>{if(event.key!=='Tab')return;const stops=[...dialog.querySelectorAll('button')],first=stops[0],last=stops.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}})}
render();
</script></body></html>
