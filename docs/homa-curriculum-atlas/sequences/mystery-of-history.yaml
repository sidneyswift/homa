notes: >
  All four volumes are extracted at lesson level from publisher tables of
  contents and cross-checked against a second source per volume. Editions
  encoded, matching what the publisher sells as of Jul 2026: Volume I third
  edition (108 lessons), Volume II second edition (84 lessons), Volumes III
  and IV first edition readers (84 lessons each). Chapters here are the
  publisher's quarters, the named unit the program ships by (audiobooks and
  folderbooks sell by quarter). Weeks are strictly three lessons each, so
  week w holds lessons 3w-2 through 3w; Volume I has 36 weeks (9 per
  quarter) and Volumes II to IV have 28 weeks (7 per quarter). The
  publisher also groups quarters into two semesters; that layer is not
  encoded. Quarter titles are as printed, with en dash date spans
  normalized to hyphens; Volume I quarter date spans are omitted because
  the sample extraction was ambiguous about one digit, and Volume II
  quarters carry no era names in any accessible publisher document, so
  they are recorded by number only. Lesson titles drop the TOC's date
  parentheticals (for example "Creation (c. 4004 b.c.)" is recorded as
  "Creation"); parentheticals that are part of the name itself, like
  "Tutankhamen (King Tut)", are kept. The TOC prints key-date lessons in
  bold or all caps; that styling is normalized to the title case the
  reader pages print, and the key-date designation is not encoded. Volume
  II lesson 52 follows the second edition reader sample spelling "Leif
  Erikson", and lesson 60 corrects the notebooking TOC's "Middles Ages"
  typo to "Middle Ages" per two cross-check sources. Grade anchor: the
  publisher positions every volume as multi-age (whole family, K to 12)
  with Younger (K-3), Middle (4-8), and Older (9-12) activity tiers, so no
  per-volume grade ladder exists; the author states each volume reads
  about two grade levels above the last (Volume I about grades 3-4
  reading level, Volume IV about 9-10, commonly recommended for grade 6
  and up). Pacing: three lessons per week plus a review or activity day;
  the publisher prints no per-lesson class periods.
