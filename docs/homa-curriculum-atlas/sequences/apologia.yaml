notes: >
  Two product lines. The eight elementary Young Explorer courses (multi-age,
  publisher-recommended grades K to 6) each hold 14 numbered lessons and no
  chapter layer, so they use structure flat; the suggested pace is about two
  weeks per lesson, roughly 28 weeks per course. Elementary lesson titles are
  taken from the current second-edition course-set pages on apologia.com and
  are published at lesson level. The publisher's Young Explorer scope PDF on
  salsify corroborates the 14-lesson, two-week structure for seven of the
  eight courses, but it reflects first-edition lesson ordering and titles
  (for example it splits the older Astronomy planet lessons differently and
  lists Zoology 1 birds before insects), so where the salsify PDF and the
  current product page disagree the product page wins as the current edition.
  Earth Science (Rachael Yunis, second edition) is absent from the salsify
  PDF and was cross-checked against Christianbook and Classical Education
  Books, which list an identical 14-lesson sequence. The six middle and high
  school courses carry module-level titles only (status chapters); their
  numbered On Your Own sections and study guides are not itemized. General
  Science module titles come from the Christian Liberty sample table of
  contents and match multiple published reviews. Physical Science is the
  fourth edition, 15 modules, from Apologia's own course blog and product
  page. Biology (third edition, 16 modules) and Chemistry (third edition, 16
  modules) module titles come from the Christian Liberty sample tables of
  contents. Physics (second edition, 16 numbered modules plus an unnumbered
  preliminary module on measurement and units) is reconciled across three
  independent sources that agree on numbering: Apologia's own audiobook
  module list, the Milestone Books table of contents, and The Curriculum
  Choice course outline. Marine Biology (second edition, 16 modules) comes
  from the Home Science Tools table of contents and matches an independent
  review. Ellipsis punctuation in Zoology 3 lesson 11 is written as three
  periods. Advanced and elective courses (Advanced Biology, Advanced
  Chemistry, Advanced Physics, Health and Nutrition, High School Astronomy)
  are not extracted yet.
