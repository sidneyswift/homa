# Generated from publisher course book tables of contents; see
# README.md in this folder for schema, protocol, and copyright policy.
# Unit numbers, lesson numbers, and lesson titles are facts about the
# curriculum's organization; publisher em and en dashes are normalized
# per repo law (ranges keep an ASCII hyphen, separators become commas).
id: simply-good-and-beautiful-math
name: Simply Good and Beautiful Math
extracted: 2026-07-13
sources:
  - https://www.goodandbeautiful.com/pages/free-homeschool-math-curriculum
  - https://www.goodandbeautiful.com/pages/free-downloads-simply-good-and-beautiful-math-k (per-level pages, math-1 through math-7 and pre-algebra)
  - https://files.thegoodandthebeautiful.com/Math/Samples/ and https://files.goodandbeautiful.com/Math/Samples/ and https://cdn.shopify.com/s/files/1/0881/0522/2430/files/ (publisher course book sample PDFs with full tables of contents, all 15 course books across the nine levels)
notes: >
  All nine levels are extracted at lesson level from the publisher's course
  book sample PDFs, which print the complete table of contents for each
  level (downloaded 2026-07-13 from the free-downloads pages; the full free
  course PDFs sit behind an email gate, and the publisher's FAQ states
  sample pages are identical to the full course PDFs). Structure only: unit
  numbers, lesson numbers, and lesson titles. Every level has 120 numbered
  lessons. Math K and Math 1 run three units; Math 2 through Pre-Algebra
  run four. Math K through Math 5 are one course book per level, Math 6 is
  two course books (units 1-2 and 3-4), and Math 7 and Pre-Algebra are four
  course books, one unit per book. The publisher names the grade 8 course
  Pre-Algebra and also markets it as Math Level 8. Unit and course
  assessments in Math K through Math 6 span two lesson numbers each and are
  recorded as one entry: lessons 39-40, 79-80, and 119-120 in Math K and
  Math 1; 32-33, 60-61, 89-90, and 119-120 in Math 2; 29-30, 59-60, 89-90,
  and 119-120 in Math 3, Math 4, Math 5, and Math 6. Math 7 and Pre-Algebra
  instead close each unit with single-lesson Unit Review, Unit Assessment,
  and Enrichment entries. Cross-checks: every level's numbering reconciles
  to exactly 120 lessons with no gaps, matching the publisher's stated 120
  lessons per level; Math K, Math 1, and Math 3 titles were extracted twice
  with independent PDF parsers (Firecrawl and PyMuPDF) and agree on all 347
  comparable entries; titles that wrap across lines in the Math 1, Math 2,
  Math 3, Math 5, and Math 6 tables of contents were rejoined and verified
  against printed page numbers. The publisher suggests four lessons per week and
  publishes no per-unit pacing, so no periods are recorded. Editions revise
  frequently; extracted sample file versions: Math K 1.6, Math 1 1.5, Math
  2 1.4, Math 3 1.5, Math 4 1.2, Math 5 1.3, Math 6 Book 1 1.0 and Book 2
  1.1, Math 7 unversioned, Pre-Algebra 1.0. Math 2, Math 4, and Math 5
  cover files carry internal 2021 dates from the line's 2021 redesign.
