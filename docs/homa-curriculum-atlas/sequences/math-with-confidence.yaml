# Generated from publisher scope-and-sequence documents; see README.md in
# this folder for schema, protocol, and copyright policy. Unit, week, and
# activity titles are facts about the curriculum's organization; unicode
# minus signs in fact week titles are written as ASCII hyphens (see notes).
id: math-with-confidence
name: Math with Confidence
extracted: 2026-07-13
sources:
  - https://support.welltrainedmind.com/hc/en-us/articles/360056157554-Tell-me-about-the-Math-With-Confidence-series (series structure, eight-level count)
  - https://docs.google.com/document/d/1nUuKY5gQsyhhaNhG_K0CVkIdraqvQe7sNiGZlePwP_8/ (publisher series scope and sequence, revision May 2026; per-grade unit lists)
  - https://kateshomeschoolmath.com/kindergarten-math-with-confidence/ (and sibling grade pages through sixth-grade-math-with-confidence; structure statements and lesson counts)
  - https://kateshomeschoolmath.com/wp-content/uploads/2020/04/KMwC_Instructor_Sample.pdf (instructor guide sample with full table of contents; siblings for first 2021/04, second 2022/05, third 2023/05, fourth 2024/05, fifth 2025/05, sixth 2026/05 are linked from each grade page)
  - https://welltrainedmind.com/p/preschool-math-at-home/ (Preschool Math at Home product page and its PSM_Sample.pdf table of contents)
notes: >
  The publisher's support center counts eight levels, Preschool plus
  Kindergarten through Sixth Grade; the series scope and sequence
  document covers K to 6 and lists Preschool Math at Home as the
  preschool title. The preschool entry here is Preschool Math at Home:
  its chapters hold numbered activity sequences (59 activities, taught
  in order at roughly five minutes a day several times per week), not
  scripted lessons, and each chapter ends with an unnumbered readiness
  checkpoint that is not itemized. Kindergarten through second grade
  run 32 numbered weeks organized in units; entries beneath each unit
  are the publisher's week titles, written "Week N: Title", because
  weeks are the finest granularity the publisher publishes in full.
  Each K to 2 week holds 4 core lessons, and first and second grade
  add one optional enrichment lesson per week (kindergarten lists
  optional picture book and activity suggestions instead). Daily
  lesson titles for K to 2 are not published in full. Grades three
  through six are status chapters: the publisher's tables of contents
  list only the 16 units per grade, and the author confirms lesson
  titles appear only in unit introductions inside the printed books.
  Published lesson counts: third, fourth, and fifth grade have 144
  lessons each (128 regular plus 16 optional enrichment, one
  enrichment lesson closing each unit); sixth grade has 139 (123
  regular plus 16 enrichment). Grades three and up split the student
  workbook into parts A and B (fifth grade: A covers units 1 to 7, B
  covers units 8 to 16). Unit titles are cross-checked between the
  series scope document and each instructor guide sample table of
  contents; K to 2 week titles come from the sample tables of contents
  (a single publisher document per grade, mirrored by the unit
  overview pages inside each book), so verify against a printed table
  of contents before any product use. Sixth grade unit 15 is "Multiply
  and Divide Decimals" in the printed table of contents and "Multiply
  and Divide Decimals by Decimals" in both scope and sequence
  documents; the fuller name is used here. Preschool chapter titles
  are additionally corroborated by retailer and library listings;
  activity titles come from the publisher sample tables of contents.
  The series completed with Sixth Grade Math with Confidence in June
  2026. Normalization: curly quotes straightened; unicode minus signs
  in fact week titles written as ASCII hyphens (they are minus signs,
  for example "-9 and -8 Facts"); no publisher em or en dashes
  appeared in unit, week, or activity titles.
