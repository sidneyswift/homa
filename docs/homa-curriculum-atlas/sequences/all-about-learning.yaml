# Generated from publisher scope-and-sequence documents; see README.md in
# this folder for schema, protocol, and copyright policy. Lesson and step
# titles are facts about the curricula's organization; normalizations
# (straightened quotes, restored diacritics, dropped sample annotations)
# are recorded in the notes field below.
id: all-about-learning
name: All About Reading + All About Spelling
extracted: 2026-07-13
sources:
  - https://www.allaboutlearningpress.com/scope-and-sequence/
  - https://downloads.allaboutlearningpress.com/samples/ (per-level scope and sequence PDFs, AAR-Pre-reading and AAR-L1 to AAR-L4 and AAS-L1 to AAS-L7 -Scope-and-Sequence.pdf, all 12 levels)
  - https://downloads.allaboutlearningpress.com/samples/ (teacher's manual samples with full tables of contents, AAR-Pre-Reading-TM-Sample.pdf, AAR-L1 to L4-TM-Sample.pdf, AAS-L1 to L3-TM-Sample.pdf, AAS-L4 to L7-TM-WebSample.pdf)
  - https://www.allaboutlearningpress.com/all-about-spelling-level-1-materials/ (and the sibling per-level product pages, which state per-level lesson and step counts)
notes: >
  One file covers both sibling programs under the shared profile id, with
  program-qualified level names: All About Reading (AAR Pre-reading plus
  Levels 1 to 4) and All About Spelling (AAS Levels 1 to 7). All 12
  levels are flat lesson ladders with no chapter layer. Titles are the
  publisher's own numbered lesson titles from the teacher's manual
  tables of contents, cross-checked lesson by lesson against the
  publisher's standalone scope and sequence PDFs (for AAR Level 2
  lessons 1 to 26 the scope PDF's first page scrambled under extraction,
  so those rows were checked by content alignment where legible; the
  manual contents page is authoritative there); counts are further
  corroborated by the publisher's product pages (the AAS pages state 25,
  31, 30, 38, 28, 30, and 30 units) and by the publisher's published AAR
  counts (Level 1 has 53 lessons and 52 stories, Level 4 has 63 lessons
  and 29 stories; the read-a-story lessons in this file reproduce the
  publisher's per-level story counts exactly). No grade keys are
  recorded: the publisher states that level numbers do not refer to
  grade levels, and the repo ELA crosswalk owns the level-to-skill
  translation. Unit naming: the AAS Level 1 to 4 manuals number their
  units as lessons while the Level 5 to 7 manuals number them as steps,
  and the publisher's product pages call the Level 4 to 7 units steps;
  entries here are the numbered units in book order under the schema's
  lessons key either way. AAR read-a-story lesson titles name the
  decodable stories read. Normalizations: publisher curly quotes are
  written straight, italics markers are dropped, "(in this sample)"
  annotations from the sample PDFs are removed, and breve and macron
  vowel marks inside sound slashes are restored where PDF extraction
  scrambled them (the joined double o marks in /o͞o/ and /o͝o/ are
  written with combining characters). Where the standalone scope PDF and
  the manual contents page disagree on a letter, the manual contents
  page is used (AAR Level 4 lesson 48 reads IZE, AAS Level 7 step 16
  reads SS or SSI). AAR Pre-reading lessons 1 and 26 (Capital A and
  Capital Z) were absorbed into section headings by PDF extraction and
  are restored from the alphabetical ladder that both publisher
  documents confirm.
