notes: >
  Six levels are extracted at lesson level: Math 5/4 (third edition), Math
  6/5 (third edition), Math 7/6 (homeschool fourth edition), Math 8/7
  (third edition), Algebra 1/2 (third edition), and Algebra 1 (third
  edition), the editions the current homeschool kits carry. Saxon books
  have no chapters, so these levels use the flat structure. Many lessons
  teach several named topics; the publisher separates topics inside one
  lesson title with a bullet, kept here as the bullet character. Partner
  documents that used dashes or slashes as that separator are normalized
  to the same bullet. Math 5/4 through 8/7 each have exactly 120 lessons
  plus 12 investigations; investigations are publisher numbered sessions,
  not lessons, so they are carried in their own investigations list to
  keep the lessons array positional (lesson n is lessons[n-1]), and
  Investigation N falls after lesson 10N in the publisher sequence.
  Algebra 1/2 has 123 lessons and Algebra 1 has 120 lessons; neither has
  investigations (tests fall after every four lessons per the publisher
  introduction PDF; in 5/4 to 8/7 a cumulative test falls about every
  five lessons). Appendix topics and supplemental practice sections are
  not numbered lessons and are omitted. Extraction and cross checking per
  level: 5/4 and 6/5 titles come from the third edition student text
  tables of contents, cross checked against the Nicole the Math Lady and
  My Math Assistant lesson tables; 7/6 titles come from the homeschool
  fourth edition look inside table of contents with the same two cross
  checks; 8/7 titles come from the two partner tables, with every
  disagreement arbitrated against the third edition student text table
  of contents (that scan is two column and scrambles, so it was used for
  targeted arbitration, not bulk parsing); Algebra 1 titles come from the
  publisher third edition table of contents, cross checked against DIVE
  and My Math Assistant; Algebra 1/2 titles come from the DIVE lesson
  table, cross checked against My Math Assistant, with disagreements
  arbitrated against a scan of the third edition table of contents.
  Mathematical notation in titles is rendered in plain text: the one half
  glyph in 5/4 lesson 103 is written 1/2, Algebra 1/2 lesson 54 ratio
  notation is written P/Q and Q/P, Algebra 1/2 lesson 117 is written
  x^2, and Algebra 1 lesson 94 subscripts are written D1 and D2; 7/6
  lesson 47 keeps the publisher's pi symbol. Algebra 1 lesson 99 carries
  the file's one publisher em dash, normalized to a comma. Grade anchors
  follow the publisher placement rule (Math 5/4 for fourth grade through
  Algebra 1/2 for eighth grade, one level per year after); a dual grade
  level name alone under-determines the grade by a full year, so never
  infer grade from a level name alone; see
  docs/homa-benchmarks/13-curriculum-crosswalk-math.md section 1. Math K to Math 3 are kit based scripted programs whose
  lesson titles are not published in any publisher scope document, so
  they stay pending with sources linked; published lesson counts are 112
  (Math K), 130 (Math 1), 132 (Math 2), and 140 (Math 3). Algebra 2,
  Advanced Mathematics, and Calculus complete the ladder and stay pending
  (lesson tables exist at partner sites but were not extracted or cross
  checked in this pass). The optional separate Geometry course is omitted
  because the publisher's recommended homeschool sequence omits it and it
  has no single grade anchor. Verify against a printed table of contents
  before any product use.
