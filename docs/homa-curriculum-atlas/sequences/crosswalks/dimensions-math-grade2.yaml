notes: >
  Seeded 2026-07-13 by mapping the 15 verified grade 2 chapters in
  ../dimensions-math.yaml against the 503 math topics in the taxonomy
  snapshot, restricted to nodes overlapping ages 6-9. Age-band
  mismatches are recorded as medium confidence with notes; they are
  consistent with the program's documented ahead-lean
  (docs/homa-benchmarks/13-curriculum-crosswalk-math.md §2). Known
  gap: the taxonomy has no dedicated node for bar modeling as a
  strategy; DM's word-problem method rides the word-problem and
  strategy nodes. Requires human review before promotion to reviewed.
