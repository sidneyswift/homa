notes: >
  Mystery Science organizes each grade (K to 5) into several units, and each
  unit into ordered lessons the publisher calls "Mysteries." Units are
  modeled as chapters within a grade level, numbered in the order the live
  site lists them for that grade; unit order is not prescribed (the publisher
  says units may be taught in any order) but Mysteries within a unit are
  sequential and build on one another. Each Mystery's title is the kid-facing
  question prompt, taken verbatim from the current public unit pages on
  mysteryscience.com; a few are read-along Mysteries in the early grades, not
  flagged individually here. Core lesson time is about 30 to 45 minutes per
  Mystery in K to 1 and about an hour in grades 2 to 5, with roughly one to
  two hours of optional extras per Mystery. Cross-check: the publisher's 2019
  K-5 NGSS planning guide PDF corroborates the per-grade unit set, Mystery
  ordering, and pacing, but the live site has since reorganized several units
  (for example the 2019 combined "Plant & Animal Secrets" kindergarten unit
  is now split into "Animal Secrets" and "Plant Secrets") and renamed or
  replaced some Mysteries (notably in grade 5 Web of Life), so the current
  site is treated as authoritative for titles and structure and the planning
  guide as the structural and pacing cross-check. Counts reflect the current
  site: 32 units and 137 Mysteries across K to 5. Titles are preserved with
  their original punctuation, including one curly apostrophe in a grade 2
  title; no em or en dashes appear in any Mystery title.
