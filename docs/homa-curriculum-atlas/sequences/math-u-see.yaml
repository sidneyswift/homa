# Generated from publisher scope-and-sequence documents; see README.md in
# this folder for schema, protocol, and copyright policy. Lesson titles
# are facts about the curriculum's organization; publisher em dashes in
# titles are normalized to commas per repo law, and en dashes used as
# minus signs become ASCII hyphens (see notes).
id: math-u-see
name: Math-U-See
extracted: 2026-07-13
sources:
  - https://mathusee.com/products/math-u-see-curriculum/ (curriculum sequence, per-level skill focus naming)
  - https://mathusee.com/products/math-u-see-curriculum/primer/ (and sibling per-level pages through algebra-1 and algebra-1-psm; each page's scope and sequence section lists the numbered lesson titles)
  - https://store.demmelearning.com/collections/alpha/products/alpha-student-workbooks-and-tests (and sibling per-level Student Workbook and Tests product pages; lesson titles cross-check)
  - https://kateshomeschoolmath.com/math-u-see-review-buying-guide/ (community grade mapping only, not a publisher claim)
notes: >
  Lesson titles for all ten levels come from the publisher's per-level
  scope and sequence lists on mathusee.com, cross-checked against the
  lesson titles lists on the publisher's store product pages at
  store.demmelearning.com; the two documents matched exactly for every
  level. Both are publisher properties (no third party publishes full
  lesson lists), so verify against a printed table of contents before
  any product use. Math-U-See publishes no grade labels; placement is
  by skill readiness. The grade anchors here are the common community
  mapping from Kate Snow's buying guide (Primer = K through Zeta = 6,
  then one level per year), approximate by design. Per the math
  crosswalk (docs/homa-benchmarks/13-curriculum-crosswalk-math.md
  section 3), MUS ladder ORDER diverges from grade-labeled programs:
  multi-digit multiplication arrives early (Gamma) and decimals arrive
  late (Zeta) because Epsilon is fractions only, so map levels by
  items, never by grade. Publisher skill focus naming per level, from
  the curriculum sequence page: Primer "An Introduction to
  Mathematics"; Alpha "Single-Digit Addition & Subtraction"; Beta
  "Multiple-Digit Addition & Subtraction"; Gamma "Single &
  Multiple-Digit Multiplication"; Delta "Single & Multiple-Digit
  Division"; Epsilon "Fractions"; Zeta "Decimals & Percents";
  Pre-Algebra "Negative Numbers, Order of Operations, and Solving for
  the Unknown"; Algebra 1 "Graphing, Simultaneous Equations,
  Exponents, Polynomials, and Unit Multipliers". Each elementary level
  has 30 numbered lessons and one core mastery topic; the program is
  unscheduled (mastery paced, commonly one lesson per week). Algebra 1
  currently ships in two editions and both are included: Legacy
  Edition (traditional flat lesson structure, 35 lessons; the edition
  the curriculum sequence page links as Algebra 1) and Principles of
  Secondary Mathematics (unit structured, 30 lessons in 5 units; 3
  further extension lessons live only in the publisher's Digital
  Toolbox and are omitted here). PSM lesson titles "Scope and Linear
  Functions" and "More Graphic Quadratics" appear exactly that way in
  both publisher documents. Geometry, Algebra 2, PreCalculus, and
  Calculus levels exist and are not extracted in this pass.
  Normalization: publisher em dashes in titles became commas; en
  dashes used as minus signs in subtraction lesson titles became ASCII
  hyphens (for example "Subtraction: -1"), preserving the math; curly
  quotes straightened; cent signs kept; one non-breaking space
  removed.
