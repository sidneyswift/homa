# Generated from publisher scope-and-sequence documents; see README.md in
# this folder for schema, protocol, and copyright policy. Chapter and
# lesson titles are facts about the curriculum's organization; publisher
# em dashes in titles are normalized to commas per repo law.
id: dimensions-math
name: Dimensions Math
extracted: 2026-07-13
sources:
  - https://www.singaporemath.com/pages/scopes-sequences
  - https://singapore-math.s3.us-west-2.amazonaws.com/scopes/DMPK5_Scope.pdf
  - https://singapore-math.s3.us-west-2.amazonaws.com/scopes/DM68_Scope.pdf
  - https://www.singaporemath.com/pages/dimensions-math-grades-prek-5-overviews
  - https://singapore-math.s3.us-west-2.amazonaws.com/Alignments/DM_G2A-Overview.pdf
  - https://singapore-math.s3.us-west-2.amazonaws.com/Alignments/DM_G2B-Overview.pdf
notes: >
  Grade 2 is extracted at lesson level, cross-checked between the PK-5
  scope chart and the per-level overview PDFs (which also carry the
  publisher's suggested class periods per chapter). Cumulative reviews
  follow chapters 5, 7, 11, and 15 in grade 2. Grades 6-8 are extracted
  at chapter level from the 6-8 scope tables; their lesson titles exist
  in the same source and can be extracted next. PK-1 and 3-5 are pending:
  the PK-5 chart's multi-column layout scrambles plain-text extraction,
  so those levels wait for parsing against the per-level overview PDFs
  (linked pattern: DM_G<level>-Overview.pdf) rather than being published
  wrong. Periods for grade 2A chapters 6 and 7 are omitted because the
  two chapters' tables merge in the overview extraction.
