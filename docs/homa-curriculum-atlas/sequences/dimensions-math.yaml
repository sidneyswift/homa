# Generated from publisher scope-and-sequence documents; see README.md in
# this folder for schema, protocol, and copyright policy. Chapter and
# lesson titles are facts about the curriculum's organization; publisher
# em dashes in titles are normalized to commas per repo law.
id: dimensions-math
name: Dimensions Math
extracted: 2026-07-13
sources:
  - https://www.singaporemath.com/pages/scopes-sequences
  - https://singapore-math.s3.us-west-2.amazonaws.com/scopes/DMPK5_Scope.pdf
  - https://singapore-math.s3.us-west-2.amazonaws.com/scopes/DM68_Scope.pdf
  - https://www.singaporemath.com/pages/dimensions-math-grades-prek-5-overviews
  - https://singapore-math.s3.us-west-2.amazonaws.com/Alignments/ (per-level DM_G<level>-Overview.pdf, all 14 PK-5 levels)
notes: >
  All 20 levels are extracted at lesson level. PK-5 lesson lists and
  suggested class periods come from the publisher's per-level overview
  PDFs; chapter numbering and titles are cross-checked against the PK-5
  scope chart, and grade 1 chapter titles the chart scrambled (1A 5-8,
  1B 13) were verified against independently published tables of
  contents. Where the overview PDF merges adjacent chapter tables (2A
  chapters 6-7, 1A chapters 5-8, 1B chapters 10-11, 5B chapters 13-14),
  periods are omitted rather than guessed. Cumulative review sections
  are not numbered lessons and are omitted, except PKB chapter 13,
  which is a review chapter by design. Grades 6-8 chapters and numbered
  sections come from the 6-8 scope tables; the grade 7 chapter list is
  verified against two independent tables of contents (an earlier
  chapter-only extraction had promoted 7A section titles to chapters,
  now corrected). Lettered sub-parts (for example 2.5A) exist beneath
  numbered sections in 6-8 and are not itemized here.
