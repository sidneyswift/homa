# Generated from publisher course book tables of contents; see
# README.md in this folder for schema, protocol, and copyright policy.
# Unit numbers, lesson numbers, and lesson titles are facts about the
# curriculum's organization; publisher em and en dashes are normalized
# per repo law (ranges keep an ASCII hyphen, separators become commas).
id: the-good-and-the-beautiful-language-arts
name: The Good and the Beautiful Language Arts
extracted: 2026-07-13
sources:
  - https://www.goodandbeautiful.com/pages/free-homeschool-language-arts
  - https://www.goodandbeautiful.com/pages/free-downloads-language-arts-level-k (per-level pages, level-1 through level-6 and level-8-book-studies; no level-7 page as of 2026-07-13)
  - https://files.goodandbeautiful.com/Language-Arts/Samples/ and https://files.thegoodandthebeautiful.com/Language-Arts/Samples/ and https://hs-files-git-v2.api.goodandbeautiful.app/Language-Arts/Samples/ (publisher course book sample PDFs with full tables of contents, all 10 course books for Levels K through 6)
notes: >
  Levels K through 3 are extracted at lesson level from the publisher's
  course book sample PDFs, which print the complete table of contents
  (downloaded 2026-07-13; the full free course PDFs sit behind an email
  gate, and the publisher's FAQ states sample pages are identical to the
  full course PDFs). Every level runs 120 numbered lessons: Levels K, 1,
  and 2 in three units, Level 3 in four units, and Levels 4 through 6 in
  six units. Levels 4, 5, and 6 print bare lesson numbers with no titles in
  their tables of contents, so those levels are recorded at chapter level
  with lesson-per-unit spans here: Level 4 units cover lessons 1-21, 22-40,
  41-59, 60-80, 81-101, and 102-120; Level 5 units cover 1-20, 21-43,
  44-63, 64-83, 84-103, and 104-120; Level 6 units cover 1-20, 21-42,
  43-61, 62-80, 81-100, and 101-120. In those three levels the only named
  entries are Project Lessons, twelve per level. Levels 4 through 6 ship as
  two course books each, units 1-3 and 4-6. Level 2 records lessons 97 and
  98 as one Writer's Workshop entry and lessons 103 and 104 as one
  Geography Presentation entry, so its numbering still reaches 120. Level 7
  is pending: the publisher discontinued the prior edition's free download
  and physical components on June 19, 2026 ahead of a new edition announced
  for July 2026, so no current table of contents could be verified. Level 8
  exists as three separate Book Studies rather than a unit-structured
  course; lesson counts (28, 28, and 19 numbered, untitled lessons) come
  from the publisher's product listings, the studies are recorded in
  publisher page order rather than a prescribed sequence, and the
  publisher's Grammar and Writing Guide is a required companion. Non-lesson
  table of contents entries (unit overview pages, teacher tips, important
  reminders, parent pages) are omitted. The em dash the publisher prints
  between a lesson number and its title is structural and dropped; en
  dashes inside titles are numeric ranges and become ASCII hyphens per repo
  law. Cross-checks: every extracted level reconciles to exactly 120
  lessons with no numbering gaps, matching the publisher's stated lesson
  counts. Editions revise frequently; edition evidence per level: Level K
  sample 4.5; Level 1 sample 3.5 with a title page reading First Edition
  That Correlates with the Reading Booster Program, copyright 2022; Level 2
  sample 4.4; Level 3 title page reading Fourth Edition; Level 4 samples
  3.0; Level 5 samples 4.0; Level 6 samples unversioned; Level 8 Abraham
  Lincoln sample copyright 2018.
