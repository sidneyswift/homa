  - http://downloads.peacehillpress.com.s3.amazonaws.com/pdfs/samples/sotw2sample.pdf and http://downloads.peacehillpress.com.s3.amazonaws.com/samples/STOW2_Sampler/StoryOfTheWorldVolume2_Sample.pdf (Volume 2 revised edition samples)
