  - https://www.conklinacademy.com/uploads/6/2/9/5/6295823/sotw3_text_revisededition.pdf (mirror of the publisher's Volume 3 revised edition sample)
  - http://downloads.peacehillpress.com.s3.amazonaws.com/pdfs/samples/sotw4sample.pdf (Volume 4, 2005 edition sample)
  - https://www.memoriapress.com/wp-content/uploads/2021/07/The-Story-of-the-World-Vol-4.pdf (mirror of the publisher's Volume 4 revised edition sample)
  - https://s3.us-east-1.amazonaws.com/samples.welltrainedmind.com/SOTW_Samples/SOTW_PDF_Samples/Volume1/25thAnniversary/SOTW1_25AEE_Text_Sample.pdf (Volume 1 25th Anniversary Expanded Edition sample, see notes)
