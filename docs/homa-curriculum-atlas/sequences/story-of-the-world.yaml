  - https://www.amblesideonline.org/contents-sotw (independent Volume 4 section list cross-check)
notes: >
  All four volumes are extracted at chapter and section level from the
  publisher's sample PDFs, which include the full tables of contents; the
  TOC-listed section titles are recorded as lessons. Editions encoded:
  Volume 1 revised edition (2006), Volume 2 revised edition (2007), Volume
  3 cross-checked between the 2004 sample and the revised edition sample
  with identical chapter and section lists, Volume 4 cross-checked between
  the 2005 sample and the revised edition sample with identical chapter and
  section lists. Chapter lists are additionally cross-checked against
  independent library, retailer, and community tables of contents. Grade
  anchors follow the publisher's suggested spans: Volume 1 grades 1 to 4,
  Volume 2 grades 2 to 5, Volume 3 grades 3 to 6, Volume 4 grades 4 to 8,
  and the publisher does not recommend Volume 4 before grade 4. Each
  volume is one school year of 42 chapters; the publisher prints no
  per-chapter pacing. Unnumbered front matter (the Volume 1 introduction
  with its What Is History? and What Is Archaeology? sections) and the
  appendices are omitted. Publisher em dashes inside titles are normalized
  to commas (for example "China, Vietnam, and France" and "Communism
  Crumbles, but Survives") and en dash year ranges to hyphens ("The Thirty
  Years' War, 1618-1648"); capitalization quirks are kept as printed
  ("Greece's War With Persia", "Armies In China", "The Jakata Tales"). The
  25th Anniversary Expanded Edition of Volume 1 (2026) also has 42
  chapters but resequences and retitles part of the list with new China,
  Korea, and Silk Road material and History-Maker inserts; its sample TOC
  extraction scrambled the chapter order, so that edition stays
  unpublished here with the source linked, and the classic revised edition
  list stands.
