<style>
  html, body { margin: 0; background: var(--bg-page); }
  @media (max-width: 880px) {
    .ht-grid { grid-template-columns: 1fr !important; }
    .ht-gutter, .ht-line { display: none !important; }
    .ht-step { grid-template-columns: 1fr !important; }
    .ht-step .ht-vig { justify-content: flex-start !important; }
  }
  /* Scroll reveals: armed by JS (html.rv-armed), so no-JS, print, and
     reduced-motion always see content. Gentle rise, no bounce. */
  html.rv-armed [data-reveal], html.rv-armed [data-reveal-kids] > * { opacity: 0; transform: translateY(14px); transition: opacity 320ms var(--ease-out), transform 320ms var(--ease-out); }
  html.rv-armed [data-reveal].rv-in, html.rv-armed [data-reveal-kids].rv-in > * { opacity: 1; transform: none; }
  [data-reveal-kids] > *:nth-child(2) { transition-delay: 70ms; }
  [data-reveal-kids] > *:nth-child(3) { transition-delay: 140ms; }
  [data-reveal-kids] > *:nth-child(4) { transition-delay: 210ms; }
  [data-reveal-kids] > *:nth-child(5) { transition-delay: 280ms; }
  [data-reveal-kids] > *:nth-child(6) { transition-delay: 350ms; }
  .rv-d1 { transition-delay: 80ms !important; }
  .rv-d2 { transition-delay: 160ms !important; }
  @keyframes bd-pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .bd-sum { animation: bd-pop 360ms var(--ease-out); }
  @media (prefers-reduced-motion: reduce), print {
    html.rv-armed [data-reveal], html.rv-armed [data-reveal-kids] > * { opacity: 1 !important; transform: none !important; transition: none !important; }
    .bd-sum { animation: none; }
  }
