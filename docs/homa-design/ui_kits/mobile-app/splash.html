<!-- @dsCard group="Brand" viewport="400x680" name="App splash · launch moment" subtitle="Dawn: the sun rises, the home bounces in, eyes wake · click to replay" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0;height:100%;}
  /* Base styles are the FINAL frame; animations run only under body.play,
     so no-JS, print, and reduced-motion always see the finished splash. */
  .screen{width:100%;height:100vh;min-height:640px;background:var(--bg-page);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--font-sans);position:relative;overflow:hidden;}
  .markwrap{position:relative;}
  .glow{position:absolute;left:50%;top:50%;width:340px;height:340px;transform:translate(-50%,-54%);border-radius:50%;background:radial-gradient(circle,var(--gold-100) 0%,rgba(255,243,194,0.35) 42%,transparent 70%);opacity:0.4;pointer-events:none;}
  .mark{width:104px;height:104px;display:block;position:relative;}
  .sun{position:absolute;top:-16px;right:-26px;}
  .body-g{transform-box:fill-box;transform-origin:center bottom;}
  .lids{opacity:0;}
  .lids path{fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;}
  .eyes{transform-box:fill-box;transform-origin:center;}
  .pupil{fill:#221E1A;}
  .word{font-size:2.7rem;color:var(--text-strong);margin-top:24px;display:inline-flex;}
  .word .lw{display:inline-block;}
  .word .b{display:inline-block;font-family:var(--font-wordmark);font-weight:600;}
  .tag{font-family:var(--font-serif);font-style:italic;font-weight:400;font-size:1.15rem;color:var(--text-muted);margin-top:8px;}
  .foot{position:absolute;bottom:40px;font-size:0.78rem;font-weight:600;letter-spacing:0.16em;text-transform:uppercase;color:var(--text-subtle);}

  /* ---- choreography (only when .play) ---- */
  .play{animation:dawn 1.0s var(--ease-out) both;}
  .play .glow{animation:glow-in 0.9s var(--ease-out) 0.1s both;}
  .play .sun{animation:sun-in 0.7s var(--ease-out) 0.18s both;}
  .play .body-g{animation:land 0.85s 0.32s both;}
  .play .lids{animation:lids 0.5s linear 1.0s both;}
  .play .eyes{animation:eyes-in 0.32s var(--ease-out) 1.22s both, blink 0.24s ease-in-out 2.9s 1;}
  .play .pupils{animation:glance 0.8s var(--ease-out) 1.55s both;}
  .play .lw{animation:hop 0.45s var(--ease-out) both;}
  .play .lw:nth-child(1){animation-delay:1.32s;}
  .play .lw:nth-child(2){animation-delay:1.40s;}
  .play .lw:nth-child(3){animation-delay:1.48s;}
  .play .lw:nth-child(4){animation-delay:1.56s;}
  .play .tag{animation:rise 0.55s var(--ease-out) 1.95s both;}
  .play .foot{animation:fade 0.6s var(--ease-out) 2.25s both;}

  @keyframes dawn{from{background:#ECEBF1;}to{background:var(--bg-page);}}
  @keyframes glow-in{from{opacity:0;transform:translate(-50%,-46%) scale(0.88);}to{opacity:0.4;transform:translate(-50%,-54%) scale(1);}}
  @keyframes land{0%{opacity:0;transform:translateY(-52px);}30%{opacity:1;transform:translateY(0) scale(1.08,0.86);}48%{transform:translateY(-16px) scale(0.96,1.06);}64%{transform:translateY(0) scale(1.05,0.93);}78%{transform:translateY(-5px) scale(0.99,1.02);}90%{transform:translateY(0) scale(1.02,0.985);}100%{opacity:1;transform:translateY(0) scale(1,1);}}
  @keyframes sun-in{from{opacity:0;transform:translateY(13px) rotate(-24deg);}to{opacity:1;transform:translateY(0) rotate(0deg);}}
  @keyframes lids{0%{opacity:0;}18%{opacity:1;}72%{opacity:1;}100%{opacity:0;}}
  @keyframes eyes-in{from{opacity:0;transform:scale(0.82);}to{opacity:1;transform:scale(1);}}
  @keyframes blink{0%,100%{transform:scaleY(1);}50%{transform:scaleY(0.1);}}
  @keyframes glance{0%,100%{transform:translateX(0);}30%{transform:translateX(-1.3px);}68%{transform:translateX(1.3px);}}
  @keyframes hop{0%{opacity:0;transform:translateY(14px);}70%{opacity:1;transform:translateY(-3px);}100%{opacity:1;transform:translateY(0);}}
  @keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  @media (prefers-reduced-motion: reduce){
    .play,.play *{animation:none !important;}
  }
</style></head><body>
<div class="screen">
  <div class="glow"></div>
  <div class="markwrap">
    <svg class="sun" width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><g stroke="var(--gold-400)" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2" fill="var(--gold-400)" stroke="none"></circle><line x1="12" y1="1.5" x2="12" y2="4.5"></line><line x1="12" y1="19.5" x2="12" y2="22.5"></line><line x1="1.5" y1="12" x2="4.5" y2="12"></line><line x1="19.5" y1="12" x2="22.5" y2="12"></line><line x1="4.6" y1="4.6" x2="6.7" y2="6.7"></line><line x1="17.3" y1="17.3" x2="19.4" y2="19.4"></line><line x1="4.6" y1="19.4" x2="6.7" y2="17.3"></line><line x1="17.3" y1="6.7" x2="19.4" y2="4.6"></line></g></svg>
    <svg class="mark" viewBox="0 0 48 48">
      <g class="body-g">
        <path d="M24 5.6 C22.5 5.6 21 6.2 19.8 7.3 L7.1 18.9 C5.5 20.4 4.6 22.5 4.6 24.7 L4.6 35.2 C4.6 40.1 8.5 44 13.4 44 L34.6 44 C39.5 44 43.4 40.1 43.4 35.2 L43.4 24.7 C43.4 22.5 42.5 20.4 40.9 18.9 L28.2 7.3 C27 6.2 25.5 5.6 24 5.6 Z" fill="var(--brand)"/>
        <g class="lids">
          <path d="M12.9 26.4 Q17.4 29.6 21.9 26.4"></path>
          <path d="M26.1 26.4 Q30.6 29.6 35.1 26.4"></path>
        </g>
        <g class="eyes">
          <circle cx="17.4" cy="26" r="4.8" fill="#fff"/>
          <circle cx="30.6" cy="26" r="4.8" fill="#fff"/>
          <g class="pupils">
            <circle class="pupil" cx="18.3" cy="26.7" r="2.2"/>
            <circle class="pupil" cx="31.5" cy="26.7" r="2.2"/>
          </g>
        </g>
      </g>
    </svg>
  </div>
  <div class="word"><span class="lw"><span class="b" style="transform:translateY(-0.06em) rotate(-3deg)">H</span></span><span class="lw"><span class="b" style="transform:translateY(0.05em)">o</span></span><span class="lw"><span class="b" style="transform:translateY(-0.04em) rotate(2deg)">m</span></span><span class="lw"><span class="b" style="transform:translateY(0.06em) rotate(-2deg)">a</span></span></div>
  <div class="tag">homeschooling, made calm</div>
  <div class="foot">You&rsquo;ve got this</div>
</div>
<script>
  const play = () => {
    document.body.classList.remove('play');
    void document.body.offsetWidth;
    document.body.classList.add('play');
  };
  document.addEventListener('DOMContentLoaded', play);
  document.addEventListener('click', play);
</script>
</body></html>
