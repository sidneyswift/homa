<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  /* Homa thank-you card FRONT (v4, founder direction 2026-07-11 late
     afternoon: no logo on the front, the "Thank you" itself must look
     amazing; full lockup moves to the back). A2 folded landscape front
     panel: 5.5x4.25in at 300dpi = 1650x1275px.
     Composition: the family notebook page with a celebration written
     on it. Ruled cream paper + the soft margin rule ground it in
     homeschool; the hero is large flowing script in clay, baseline on
     a rule like real handwriting; one small gold sparkle doodle rides
     the tail. Dancing Script is a stationery-craft exception approved
     for this physical artifact only (the system has no lush script;
     Fredoka is wordmark-only, Caveat is margin notes). */
  @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1650px; height: 1275px; }

  body {
    background: #FBF7F0; /* --stone-50, warm cream */
    background-image: repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 99px,
      rgba(46, 107, 230, 0.07) 99px,
      rgba(46, 107, 230, 0.07) 102px
    );
    position: relative;
    overflow: hidden;
  }

  .margin-rule {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 260px;
    width: 5px;
    background: rgba(231, 96, 47, 0.35);
  }

  /* The hero. Script baseline settles onto the 816 rule; descender
     swashes fall into the band below it like real pen work. */
  h1 {
    position: absolute;
    left: 260px;
    right: 0;
    top: 385px;
    text-align: center;
    font-family: 'Dancing Script', cursive;
    font-weight: 700;
    font-size: 280px;
    line-height: 1.25;
    color: #E7602F; /* --brand clay, the one color moment */
    white-space: nowrap;
  }

  /* One gold sparkle doodle, hand-placed off the final swash. */
  .sparkle {
    position: absolute;
    left: 1390px;
    top: 350px;
    transform: rotate(12deg);
  }
  .sparkle-small {
    position: absolute;
    left: 1478px;
    top: 485px;
    transform: rotate(-9deg);
  }
</style>
</head>
<body>
  <div class="margin-rule"></div>
  <h1>Thank you</h1>
  <svg class="sparkle" width="86" height="86" viewBox="0 0 70 70" aria-hidden="true">
    <path d="M35 2 C37.5 20 40 24 58 27 C40 30 37.5 34 35 52 C32.5 34 30 30 12 27 C30 24 32.5 20 35 2 Z"
      fill="#F0BE00" transform="translate(0 8)"/>
  </svg>
  <svg class="sparkle-small" width="44" height="44" viewBox="0 0 70 70" aria-hidden="true">
    <path d="M35 2 C37.5 20 40 24 58 27 C40 30 37.5 34 35 52 C32.5 34 30 30 12 27 C30 24 32.5 20 35 2 Z"
      fill="#F0BE00" transform="translate(0 8)"/>
  </svg>
</body>
</html>
