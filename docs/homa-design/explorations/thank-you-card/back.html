<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  /* Homa thank-you card BACK (v4, founder direction: the full logo and
     wordmark live here). Same panel geometry: 1650x1275px. The lockup,
     centered, nothing else: house character + bounced Fredoka
     wordmark, exactly the Logo.tsx "full" variant. */
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1650px; height: 1275px; }

  body {
    background: #FBF7F0; /* warm cream, no rules on the back */
    position: relative;
    overflow: hidden;
  }

  .lockup {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 44px;
  }

  .wordmark {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 145px;
    line-height: 1;
    color: #221E1A;
    display: inline-flex;
    margin-top: -6px;
  }
  /* The bounced wordmark, per Logo.tsx letter offsets. */
  .wordmark span { display: inline-block; }
  .l-h { transform: translateY(-0.06em) rotate(-3deg); }
  .l-o { transform: translateY(0.05em); }
  .l-m { transform: translateY(-0.04em) rotate(2deg); }
  .l-a { transform: translateY(0.06em) rotate(-2deg); }
</style>
</head>
<body>
  <div class="lockup">
    <svg width="150" height="150" viewBox="0 0 48 48" aria-hidden="true">
      <path d="M24 5.6 C22.5 5.6 21 6.2 19.8 7.3 L7.1 18.9 C5.5 20.4 4.6 22.5 4.6 24.7 L4.6 35.2 C4.6 40.1 8.5 44 13.4 44 L34.6 44 C39.5 44 43.4 40.1 43.4 35.2 L43.4 24.7 C43.4 22.5 42.5 20.4 40.9 18.9 L28.2 7.3 C27 6.2 25.5 5.6 24 5.6 Z" fill="#E7602F"/>
      <circle cx="17.4" cy="26" r="4.8" fill="#FFFFFF"/>
      <circle cx="30.6" cy="26" r="4.8" fill="#FFFFFF"/>
      <circle cx="18.3" cy="26.7" r="2.2" fill="#221E1A"/>
      <circle cx="31.5" cy="26.7" r="2.2" fill="#221E1A"/>
    </svg>
    <span class="wordmark"><span class="l-h">H</span><span class="l-o">o</span><span class="l-m">m</span><span class="l-a">a</span></span>
  </div>
</body>
</html>
