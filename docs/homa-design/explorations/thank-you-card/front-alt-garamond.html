<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  /* Alternate front treatment (not shipped unless chosen): EB Garamond
     italic, the design system's serif accent in its standalone-moment
     role, as an editorial stationery hero. Same panel geometry. */
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@1,400;1,500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1650px; height: 1275px; }

  body {
    background: #FBF7F0;
    background-image: repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 99px,
      rgba(46, 107, 230, 0.07) 99px,
      rgba(46, 107, 230, 0.07) 102px
    );
    position: relative;
    overflow: hidden;
  }

  .margin-rule {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 260px;
    width: 5px;
    background: rgba(231, 96, 47, 0.35);
  }

  h1 {
    position: absolute;
    left: 260px;
    right: 0;
    top: 428px;
    text-align: center;
    font-family: 'EB Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 265px;
    line-height: 1;
    letter-spacing: -0.01em;
    color: #221E1A;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="margin-rule"></div>
  <h1>Thank you</h1>
</body>
</html>
