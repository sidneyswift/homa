<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 24px; font-family: var(--font-sans); background: #fff; }
  .l { font-size: 40px; margin: 0 0 10px; font-weight: 500; }
  .tag { font-size: 12px; color: #888; font-family: monospace; }
  #status { font-family: monospace; font-size: 14px; margin-top: 18px; color: #222; white-space: pre; }
</style>
</head>
<body>
<div class="tag">var(--font-display)</div>
<p class="l" style="font-family: var(--font-display)">You&rsquo;ve got this. Homa&rsquo;s got the rest.</p>
<div class="tag">EB Garamond (hard-coded)</div>
<p class="l" style="font-family: 'EB Garamond', sans-serif">You&rsquo;ve got this. Homa&rsquo;s got the rest.</p>
<div class="tag">Newsreader (hard-coded)</div>
<p class="l" style="font-family: 'Newsreader', sans-serif">You&rsquo;ve got this. Homa&rsquo;s got the rest.</p>
<div class="tag">Georgia (hard-coded)</div>
<p class="l" style="font-family: Georgia, serif">You&rsquo;ve got this. Homa&rsquo;s got the rest.</p>
<div id="status">waiting for fonts…</div>
<script>
  document.fonts.ready.then(() => {
    const checks = [
      ['EB Garamond 400', document.fonts.check('400 40px "EB Garamond"')],
      ['EB Garamond 500', document.fonts.check('500 40px "EB Garamond"')],
      ['EB Garamond 600', document.fonts.check('600 40px "EB Garamond"')],
      ['Newsreader 500', document.fonts.check('500 40px "Newsreader"')],
      ['Hanken Grotesk 400', document.fonts.check('400 16px "Hanken Grotesk"')],
      ['display var', getComputedStyle(document.querySelector('.l')).fontFamily.slice(0, 60)],
    ];
    document.getElementById('status').textContent = checks.map(c => c[0] + ': ' + c[1]).join('\n');
  });
</script>
</body>
</html>
