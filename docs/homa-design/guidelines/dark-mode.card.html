<!-- @dsCard group="Colors" viewport="700x330" name="Dark theme · quiet evening" subtitle='Experimental. data-theme="dark" on any subtree' -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<style>
  body { margin: 0; font-family: var(--font-sans); }
  .dark-stage { background: var(--bg-page); padding: 24px; min-height: 100vh; box-sizing: border-box; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .sw { display: flex; gap: 8px; margin-bottom: 16px; }
  .s { flex: 1; height: 40px; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle); display: flex; align-items: flex-end; padding: 5px 8px; box-sizing: border-box; font-family: var(--font-mono); font-size: 0.6rem; color: var(--text-subtle); }
</style>
</head>
<body>
<div class="dark-stage" data-theme="dark">
  <div id="root"></div>
</div>
<script type="text/babel">
  const { Logo, Button, Badge, Callout, Icon, ProgressBar, Chip } = window.HOMADesignSystem_113bd2;
  function Demo() {
    return (
      <div>
        <div className="sw">
          <div className="s" style={{ background: 'var(--bg-page)' }}>bg-page</div>
          <div className="s" style={{ background: 'var(--surface-card)' }}>surface-card</div>
          <div className="s" style={{ background: 'var(--surface-raised)' }}>raised</div>
          <div className="s" style={{ background: 'var(--brand)', color: '#fff' }}>brand</div>
        </div>
        <div className="row">
          <Logo size={26} tone="dark" />
          <Button size="sm">Save plan</Button>
          <Button size="sm" variant="secondary">Add subject</Button>
          <Button size="sm" variant="ghost">Cancel</Button>
          <Badge tone="sage">On track</Badge>
          <Chip selected>Math</Chip>
          <Chip>Reading</Chip>
        </div>
        <div style={{ maxWidth: 420, marginBottom: 14 }}>
          <ProgressBar label="Reading" value={82} showValue tone="sage" size="sm" />
        </div>
        <Callout tone="sage" title="A note from Homa" icon={<Icon name="sparkles" size={18} />}>
          Evening planning? The whole system holds up after dark.
        </Callout>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  setTimeout(() => window.lucide && window.lucide.createIcons(), 300);
</script>
</body>
</html>
