<!-- @dsCard group="Brand" viewport="700x430" name="Logo lockup · the bright home" subtitle="Mark, wordmark, app icon, clear-space, sizes, reversed" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,600&family=Hanken+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:var(--surface-card);font-family:var(--font-sans);padding:26px 30px;}
  .grid{display:grid;grid-template-columns:1.3fr 1fr;gap:24px 30px;align-items:start;}
  .lbl{font-size:0.66rem;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-subtle);margin-bottom:12px;}
  .lock{display:inline-flex;align-items:center;}
  .wm{font-family:var(--font-display);font-weight:600;color:var(--text-strong);letter-spacing:0.005em;line-height:1;}
  .wm.light{color:#fff;}
  .row{display:flex;align-items:flex-end;gap:26px;flex-wrap:wrap;}
  .darkbox{background:var(--stone-900);border-radius:var(--radius-lg);padding:22px 26px;display:inline-flex;gap:26px;align-items:center;}
  .softbox{background:var(--bg-page-warm);border-radius:var(--radius-lg);padding:22px 26px;display:inline-flex;align-items:center;}
  .icons{display:flex;gap:16px;align-items:center;}
  .appicon{width:72px;height:72px;border-radius:18px;background:var(--brand);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-md);}
  .appicon.soft{background:var(--clay-50);}
  .clear{position:relative;display:inline-flex;padding:18px;background:repeating-linear-gradient(45deg,var(--stone-100),var(--stone-100) 6px,transparent 6px,transparent 12px);border-radius:var(--radius-md);}
  .clear .inner{background:var(--surface-card);padding:14px;border-radius:var(--radius-sm);}
</style></head><body>
<div class="grid">

  <div>
    <div class="lbl">Primary lockup</div>
    <div class="lock">
      <svg width="44" height="44" viewBox="0 0 48 48" fill="none" stroke="var(--brand)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" style="margin-right:15px">
        <path d="M9 22 L24 9 L39 22 V37 A2 2 0 0 1 37 39 H11 A2 2 0 0 1 9 37 Z"/>
        <path d="M24 20 C24.7 25 25.5 25.8 30 26.5 C25.5 27.2 24.7 28 24 33 C23.3 28 22.5 27.2 18 26.5 C22.5 25.8 23.3 25 24 20 Z" fill="var(--brand)" stroke="none"/>
      </svg>
      <span class="wm" style="font-size:40px">HOMA</span>
    </div>
  </div>

  <div>
    <div class="lbl">App icon / favicon</div>
    <div class="icons">
      <div class="appicon">
        <svg width="40" height="40" viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
          <path d="M9 22 L24 9 L39 22 V37 A2 2 0 0 1 37 39 H11 A2 2 0 0 1 9 37 Z"/>
          <path d="M24 20 C24.7 25 25.5 25.8 30 26.5 C25.5 27.2 24.7 28 24 33 C23.3 28 22.5 27.2 18 26.5 C22.5 25.8 23.3 25 24 20 Z" fill="#fff" stroke="none"/>
        </svg>
      </div>
      <div class="appicon soft">
        <svg width="40" height="40" viewBox="0 0 48 48" fill="none" stroke="var(--brand)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
          <path d="M9 22 L24 9 L39 22 V37 A2 2 0 0 1 37 39 H11 A2 2 0 0 1 9 37 Z"/>
          <path d="M24 20 C24.7 25 25.5 25.8 30 26.5 C25.5 27.2 24.7 28 24 33 C23.3 28 22.5 27.2 18 26.5 C22.5 25.8 23.3 25 24 20 Z" fill="var(--brand)" stroke="none"/>
        </svg>
      </div>
    </div>
  </div>

  <div>
    <div class="lbl">Reversed (on dark / on warm)</div>
    <div class="row">
      <div class="darkbox">
        <svg width="30" height="30" viewBox="0 0 48 48" fill="none" stroke="var(--clay-400)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
          <path d="M9 22 L24 9 L39 22 V37 A2 2 0 0 1 37 39 H11 A2 2 0 0 1 9 37 Z"/>
          <path d="M24 20 C24.7 25 25.5 25.8 30 26.5 C25.5 27.2 24.7 28 24 33 C23.3 28 22.5 27.2 18 26.5 C22.5 25.8 23.3 25 24 20 Z" fill="var(--gold-400)" stroke="none"/>
        </svg>
        <span class="wm light" style="font-size:28px">HOMA</span>
      </div>
    </div>
  </div>

  <div>
    <div class="lbl">Clear-space · min ½× mark</div>
    <div class="clear"><div class="inner">
      <svg width="34" height="34" viewBox="0 0 48 48" fill="none" stroke="var(--brand)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
        <path d="M9 22 L24 9 L39 22 V37 A2 2 0 0 1 37 39 H11 A2 2 0 0 1 9 37 Z"/>
        <path d="M24 20 C24.7 25 25.5 25.8 30 26.5 C25.5 27.2 24.7 28 24 33 C23.3 28 22.5 27.2 18 26.5 C22.5 25.8 23.3 25 24 20 Z" fill="var(--brand)" stroke="none"/>
      </svg>
    </div></div>
  </div>

  <div style="grid-column:1 / -1">
    <div class="lbl">Size ramp, legible from 20px up</div>
    <div class="row">
      <div class="lock"><svg width="20" height="20" viewBox="0 0 48 48" fill="none" stroke="var(--brand)" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round" style="margin-right:8px"><path d="M9 22 L24 9 L39 22 V37 A2 2 0 0 1 37 39 H11 A2 2 0 0 1 9 37 Z"/><path d="M24 20 C24.7 25 25.5 25.8 30 26.5 C25.5 27.2 24.7 28 24 33 C23.3 28 22.5 27.2 18 26.5 C22.5 25.8 23.3 25 24 20 Z" fill="var(--brand)" stroke="none"/></svg><span class="wm" style="font-size:18px">HOMA</span></div>
      <div class="lock"><svg width="30" height="30" viewBox="0 0 48 48" fill="none" stroke="var(--brand)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" style="margin-right:11px"><path d="M9 22 L24 9 L39 22 V37 A2 2 0 0 1 37 39 H11 A2 2 0 0 1 9 37 Z"/><path d="M24 20 C24.7 25 25.5 25.8 30 26.5 C25.5 27.2 24.7 28 24 33 C23.3 28 22.5 27.2 18 26.5 C22.5 25.8 23.3 25 24 20 Z" fill="var(--brand)" stroke="none"/></svg><span class="wm" style="font-size:27px">HOMA</span></div>
      <div class="lock"><svg width="52" height="52" viewBox="0 0 48 48" fill="none" stroke="var(--brand)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" style="margin-right:17px"><path d="M9 22 L24 9 L39 22 V37 A2 2 0 0 1 37 39 H11 A2 2 0 0 1 9 37 Z"/><path d="M24 20 C24.7 25 25.5 25.8 30 26.5 C25.5 27.2 24.7 28 24 33 C23.3 28 22.5 27.2 18 26.5 C22.5 25.8 23.3 25 24 20 Z" fill="var(--brand)" stroke="none"/></svg><span class="wm" style="font-size:46px">HOMA</span></div>
    </div>
  </div>

</div>
</body></html>
