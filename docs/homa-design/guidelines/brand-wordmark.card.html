<!-- @dsCard group="Brand" viewport="700x160" name="Wordmark" subtitle="No logo supplied · HOMA renders in Newsreader" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Hanken+Grotesk:wght@600&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:var(--bg-page);font-family:var(--font-sans);padding:24px;display:flex;gap:40px;align-items:center;}
  .mark{font-family:var(--font-display);font-weight:600;font-size:2.6rem;letter-spacing:-0.01em;color:var(--text-strong);display:flex;align-items:center;gap:10px;}
  .dot{width:12px;height:12px;border-radius:50%;background:var(--brand);display:inline-block;margin-bottom:-4px;}
  .onclay{font-family:var(--font-display);font-weight:600;font-size:2.6rem;color:#fff;}
  .chip{background:var(--brand);border-radius:var(--radius-xl);padding:16px 28px;}
  .note{font-size:0.72rem;color:var(--text-subtle);}
</style></head><body>
<div style="display:flex;flex-direction:column;gap:8px">
  <span class="mark">HOMA<span class="dot"></span></span>
  <span class="note">Serif wordmark, lowercase-friendly. Optional clay dot.</span>
</div>
<div class="chip"><span class="onclay">HOMA</span></div>
</body></html>
