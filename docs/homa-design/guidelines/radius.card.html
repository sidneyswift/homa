<!-- @dsCard group="Spacing" viewport="700x150" name="Corner radii" subtitle="Soft and rounded · sm 10 → pill" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-card);font-family:var(--font-sans);padding:22px;}
  .row{display:flex;gap:16px;align-items:center;}
  .item{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .box{width:74px;height:74px;background:var(--clay-100);border:1.5px solid var(--clay-300);}
  .lbl{font-size:0.68rem;color:var(--text-subtle);font-family:var(--font-mono);}
</style></head><body>
<div class="row">
  <div class="item"><div class="box" style="border-radius:var(--radius-xs)"></div><span class="lbl">xs·6</span></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><span class="lbl">sm·10</span></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><span class="lbl">md·16</span></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><span class="lbl">lg·22 ·card</span></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><span class="lbl">xl·28</span></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-2xl)"></div><span class="lbl">2xl·40</span></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-pill)"></div><span class="lbl">pill</span></div>
</div>
</body></html>
