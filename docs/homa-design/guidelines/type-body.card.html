<!-- @dsCard group="Type" viewport="700x200" name="UI & body · Hanken Grotesk" subtitle="Humanist sans for interface + reading" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-card);font-family:var(--font-sans);padding:22px;color:var(--text-body);}
  .r{margin-bottom:8px;display:flex;align-items:baseline;gap:14px;}
  .lbl{font-size:0.7rem;color:var(--text-subtle);font-family:var(--font-mono);width:110px;flex-shrink:0;}
  .a{font-size:1.375rem;font-weight:700;color:var(--text-strong);}
  .b{font-size:1rem;font-weight:400;line-height:1.5;}
  .c{font-size:0.875rem;font-weight:500;}
  .d{font-size:0.75rem;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-muted);}
</style></head><body>
  <div class="r"><span class="lbl">xl · 700</span><span class="a">Section heading</span></div>
  <div class="r"><span class="lbl">base · 400</span><span class="b">Body copy, the friendly, readable default for paragraphs and lists.</span></div>
  <div class="r"><span class="lbl">sm · 500</span><span class="c">Labels, table cells, secondary UI</span></div>
  <div class="r"><span class="lbl">xs · 600 caps</span><span class="d">Overline / eyebrow</span></div>
</body></html>
