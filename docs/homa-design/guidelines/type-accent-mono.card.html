<!-- @dsCard group="Type" viewport="700x150" name="Accent & mono" subtitle="Caveat hand accent (sparingly) + JetBrains Mono" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:var(--surface-card);font-family:var(--font-sans);padding:22px;display:flex;gap:32px;align-items:center;}
  .hand{font-family:var(--font-hand);font-size:2.2rem;color:var(--brand);font-weight:600;}
  .mono{font-family:var(--font-mono);font-size:1rem;color:var(--text-body);background:var(--stone-100);padding:10px 14px;border-radius:var(--radius-sm);}
  .note{font-family:var(--font-sans);font-size:0.72rem;color:var(--text-subtle);margin-top:6px;}
  .col{display:flex;flex-direction:column;}
</style></head><body>
  <div class="col"><span class="hand">a little note from HOMA ✎</span><span class="note">Caveat, margin notes, delight only. Never body.</span></div>
  <div class="col"><span class="mono">3rd grade · 68%</span><span class="note">JetBrains Mono, data, scores, code.</span></div>
</body></html>
