<!-- @dsCard group="Colors" viewport="700x150" name="Clay · primary" subtitle="Terracotta brand scale; --brand is clay-500" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-card);font-family:var(--font-sans);padding:20px;}
  .row{display:flex;gap:10px;}
  .sw{flex:1;height:82px;border-radius:var(--radius-md);display:flex;flex-direction:column;justify-content:flex-end;padding:8px;box-sizing:border-box;color:#fff;}
  .n{font-size:0.7rem;font-weight:700;}.h{font-size:0.62rem;opacity:0.85;font-family:var(--font-mono);}
</style></head><body>
<div class="row">
  <div class="sw" style="background:var(--clay-50);color:var(--clay-700)"><span class="n">50</span><span class="h">#FFF0E8</span></div>
  <div class="sw" style="background:var(--clay-100);color:var(--clay-700)"><span class="n">100</span><span class="h">#FFDDC9</span></div>
  <div class="sw" style="background:var(--clay-200);color:var(--clay-700)"><span class="n">200</span><span class="h">#FFBE9C</span></div>
  <div class="sw" style="background:var(--clay-300)"><span class="n">300</span><span class="h">#FB9868</span></div>
  <div class="sw" style="background:var(--clay-400)"><span class="n">400</span><span class="h">#F1793F</span></div>
  <div class="sw" style="background:var(--clay-500);outline:2px solid var(--stone-900);outline-offset:2px"><span class="n">500 ·brand</span><span class="h">#E7602F</span></div>
  <div class="sw" style="background:var(--clay-600)"><span class="n">600</span><span class="h">#C44C22</span></div>
  <div class="sw" style="background:var(--clay-700)"><span class="n">700</span><span class="h">#9C3B1B</span></div>
</div>
</body></html>
