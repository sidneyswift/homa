<!-- @dsCard group="Type" viewport="700x240" name="Display · Schibsted Grotesk" subtitle="Grotesque headlines, clay accent word · the full ramp" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-card);font-family:var(--font-display);padding:22px 26px;color:var(--text-strong);}
  .hero{font-size:2.9rem;font-weight:700;line-height:1.04;letter-spacing:-0.015em;}
  .hero em{font-style:normal;color:var(--clay-600);}
  .sect{font-size:1.7rem;font-weight:700;letter-spacing:-0.01em;margin-top:14px;}
  .row{display:flex;align-items:baseline;gap:26px;margin-top:14px;}
  .cardt{font-size:1.15rem;font-weight:600;}
  .num{font-size:2.2rem;font-weight:600;font-variant-numeric:tabular-nums;}
  .num span{font-family:var(--font-sans);font-size:0.72rem;color:var(--text-subtle);font-weight:600;margin-left:4px;}
  .meta{font-family:var(--font-sans);font-size:0.72rem;color:var(--text-subtle);margin-top:16px;letter-spacing:0.04em;text-transform:uppercase;}
</style></head><body>
<div class="hero">Homeschooling, made <em>calm</em>.</div>
<div class="sect">Section &middot; 700, one size down</div>
<div class="row">
  <span class="cardt">Card title &middot; 600</span>
  <span class="num">9.5<span>HRS THIS WEEK</span></span>
</div>
<div class="meta">700 at hero scale &middot; 600 mid &middot; tracked &minus;0.015em &middot; accent word = clay color, same face, never italic &middot; body stays Hanken Grotesk</div>
</body></html>
