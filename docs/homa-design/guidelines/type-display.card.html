<!-- @dsCard group="Type" viewport="700x190" name="Display · Newsreader" subtitle="One serif, two jobs: headlines + the italic accent" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-card);font-family:var(--font-display);padding:22px;color:var(--text-strong);}
  .xl{font-size:2.9rem;font-weight:600;line-height:1.04;letter-spacing:-0.015em;}
  .xl em{font-style:italic;font-weight:400;color:var(--clay-600);}
  .lg{font-size:1.8rem;font-weight:500;margin-top:8px;}
  .meta{font-family:var(--font-sans);font-size:0.72rem;color:var(--text-subtle);margin-top:12px;letter-spacing:0.04em;text-transform:uppercase;}
</style></head><body>
<div class="xl">homeschooling, made <em>calm</em>.</div>
<div class="lg">A warm, editorial way to plan the week.</div>
<div class="meta">Newsreader · 600 / 500 · the accent word is the same family, just italic · body stays Hanken Grotesk</div>
</body></html>
