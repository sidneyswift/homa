<!-- @dsCard group="Spacing" viewport="700x180" name="Shadows" subtitle="Soft, warm-tinted elevation · xs → xl" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-page);font-family:var(--font-sans);padding:28px;}
  .row{display:flex;gap:26px;align-items:center;}
  .item{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .box{width:96px;height:70px;background:var(--surface-card);border-radius:var(--radius-md);}
  .lbl{font-size:0.68rem;color:var(--text-subtle);font-family:var(--font-mono);}
</style></head><body>
<div class="row">
  <div class="item"><div class="box" style="box-shadow:var(--shadow-xs)"></div><span class="lbl">xs</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-sm)"></div><span class="lbl">sm ·card</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><span class="lbl">md</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-lg)"></div><span class="lbl">lg ·hover</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-xl)"></div><span class="lbl">xl ·modal</span></div>
</div>
</body></html>
