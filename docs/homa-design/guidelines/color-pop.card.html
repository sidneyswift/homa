<!-- @dsCard group="Colors" viewport="700x170" name="Pops & bands" subtitle="Cobalt, blush, navy pops · full-bleed section bands" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-card);font-family:var(--font-sans);padding:20px;}
  .row{display:flex;gap:10px;margin-bottom:10px;}
  .sw{flex:1;height:52px;border-radius:var(--radius-sm);display:flex;flex-direction:column;justify-content:flex-end;padding:7px 9px;box-sizing:border-box;color:#fff;}
  .n{font-size:0.66rem;font-weight:700;}
  .h{font-size:0.58rem;opacity:0.85;font-family:var(--font-mono);}
  .dk{color:var(--stone-900);}
</style></head><body>
<div class="row">
  <div class="sw" style="background:var(--pop-cobalt)"><span class="n">pop-cobalt</span><span class="h">#2E6BE6</span></div>
  <div class="sw dk" style="background:var(--pop-blush)"><span class="n">pop-blush</span><span class="h">#F49A90</span></div>
  <div class="sw" style="background:var(--pop-navy)"><span class="n">pop-navy</span><span class="h">#23304F</span></div>
</div>
<div class="row" style="margin-bottom:0;">
  <div class="sw dk" style="background:var(--band-sky)"><span class="n">band-sky</span><span class="h">#9FE0EE</span></div>
  <div class="sw dk" style="background:var(--band-mint)"><span class="n">band-mint</span><span class="h">#BDE7C5</span></div>
  <div class="sw dk" style="background:var(--band-blush)"><span class="n">band-blush</span><span class="h">#F8B7AE</span></div>
  <div class="sw dk" style="background:var(--band-sunshine)"><span class="n">band-sunshine</span><span class="h">#FFDB4D</span></div>
</div>
</body></html>
