<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;}
  .card{width:1080px;height:1080px;box-sizing:border-box;background:var(--pop-navy);padding:96px 92px;display:flex;flex-direction:column;font-family:var(--font-sans);color:var(--stone-50);position:relative;}
  .top{display:flex;align-items:center;justify-content:space-between;}
  .wm{font-family:var(--font-display);font-weight:600;letter-spacing:-0.01em;font-size:42px;color:#fff;display:flex;align-items:center;gap:10px;}
  .wm .dot{width:11px;height:11px;border-radius:50%;background:var(--clay-400);margin-bottom:-11px;}
  .eyebrow{font-size:22px;font-weight:700;letter-spacing:0.22em;text-transform:uppercase;color:var(--clay-300);}
  .rule{height:1px;background:rgba(255,255,255,0.16);margin-top:44px;}
  .qmark{position:absolute;top:120px;left:56px;font-family:var(--font-serif);font-size:400px;line-height:1;color:rgba(241,121,63,0.16);pointer-events:none;}
  .quote{font-family:var(--font-serif);font-size:76px;font-weight:400;line-height:1.18;letter-spacing:-0.015em;margin:auto 0;position:relative;}
  .quote em{font-style:italic;color:var(--clay-300);}
  .who{display:flex;align-items:center;gap:22px;padding-top:44px;border-top:1px solid rgba(255,255,255,0.16);}
  .av{width:84px;height:84px;border-radius:50%;background:var(--clay-500);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:32px;color:#fff;}
  .name{font-weight:700;font-size:30px;}
  .role{font-size:24px;color:var(--stone-400);margin-top:4px;}
  .since{margin-left:auto;font-family:var(--font-mono);font-size:20px;letter-spacing:0.08em;color:var(--stone-400);}
</style></head><body>
