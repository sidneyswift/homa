<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;}
  .card{width:1080px;height:1080px;box-sizing:border-box;background:var(--pop-navy);padding:96px 92px;display:flex;flex-direction:column;font-family:var(--font-sans);color:var(--stone-50);position:relative;}
  .top{display:flex;align-items:center;justify-content:space-between;}
  .wm{font-family:var(--font-display);font-weight:600;letter-spacing:-0.01em;font-size:42px;color:#fff;display:flex;align-items:center;gap:10px;}
  .wm .dot{width:11px;height:11px;border-radius:50%;background:var(--clay-400);margin-bottom:-11px;}
  .eyebrow{font-size:22px;font-weight:700;letter-spacing:0.22em;text-transform:uppercase;color:var(--clay-300);}
  .rule{height:1px;background:rgba(255,255,255,0.16);margin-top:44px;}
  .quote{font-family:var(--font-serif);font-size:76px;font-weight:400;line-height:1.18;letter-spacing:-0.015em;margin:auto 0;}
  .quote em{font-style:italic;color:var(--clay-300);}
  .who{display:flex;align-items:center;gap:22px;padding-top:44px;border-top:1px solid rgba(255,255,255,0.16);}
  .av{width:84px;height:84px;border-radius:50%;background:var(--clay-500);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:32px;color:#fff;}
  .name{font-weight:700;font-size:30px;}
  .role{font-size:24px;color:var(--stone-400);margin-top:4px;}
</style></head><body>
<div class="card">
  <svg style="position:absolute;top:190px;right:110px;transform:rotate(-14deg)" width="50" height="50" viewBox="0 0 24 24"><path d="M12 1 C13.1 8.2 15.8 10.9 23 12 C15.8 13.1 13.1 15.8 12 23 C10.9 15.8 8.2 13.1 1 12 C8.2 10.9 10.9 8.2 12 1 Z" fill="var(--gold-400)"/></svg>
  <div class="top">
    <div class="wm"><svg width="38" height="38" viewBox="0 0 48 48" fill="none" stroke="var(--clay-400)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M9 22 L24 9 L39 22 V37 A2 2 0 0 1 37 39 H11 A2 2 0 0 1 9 37 Z"/><path d="M24 20 C24.7 25 25.5 25.8 30 26.5 C25.5 27.2 24.7 28 24 33 C23.3 28 22.5 27.2 18 26.5 C22.5 25.8 23.3 25 24 20 Z" fill="var(--gold-400)" stroke="none"/></svg>homa</div>
    <div class="eyebrow">In their words</div>
  </div>
  <div class="quote">“I finally have my evenings back. Homa plans our week in <em>five minutes</em>.”</div>
  <div class="who">
    <div class="av">DK</div>
    <div><div class="name">Dana K.</div><div class="role">Homeschooling three · Portland, OR</div></div>
  </div>
</div>
</body></html>
