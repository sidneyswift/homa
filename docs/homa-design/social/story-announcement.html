<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Hanken+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;}
  .story{width:1080px;height:1920px;box-sizing:border-box;background:var(--bg-page);padding:120px 96px 110px;display:flex;flex-direction:column;font-family:var(--font-sans);position:relative;}
  .wm{font-family:var(--font-display);font-weight:600;font-size:52px;color:var(--text-strong);display:flex;align-items:center;gap:12px;}
  .wm .dot{width:14px;height:14px;border-radius:50%;background:var(--brand);margin-bottom:-14px;}
  .center{margin:auto 0;}
  .eyebrow{font-size:26px;font-weight:700;letter-spacing:0.24em;text-transform:uppercase;color:var(--brand);}
  .rule{height:1px;background:var(--stone-300);margin:36px 0 40px;width:180px;}
  .headline{font-family:var(--font-display);font-size:152px;line-height:0.96;font-weight:500;color:var(--text-strong);letter-spacing:-0.03em;}
  .headline em{font-style:italic;font-weight:400;color:var(--clay-600);}
  .sub{font-family:var(--font-display);font-size:42px;color:var(--text-muted);line-height:1.42;margin-top:48px;max-width:820px;font-weight:400;}
  .cta{margin-top:72px;display:inline-flex;align-items:center;justify-content:space-between;background:var(--brand);color:#fff;font-size:38px;font-weight:700;padding:34px 46px;border-radius:999px;letter-spacing:0.01em;}
  .cta span.arr{font-size:40px;}
  .foot{display:flex;align-items:center;justify-content:space-between;color:var(--text-subtle);font-size:26px;}
  .foot .avail{font-family:var(--font-mono);letter-spacing:0.08em;}
  .foot .brand{font-family:var(--font-display);font-style:italic;font-size:32px;color:var(--text-muted);}
</style></head><body>
<div class="story">
  <div class="wm"><svg width="46" height="46" viewBox="0 0 48 48" fill="none" stroke="var(--brand)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M9 22 L24 9 L39 22 V37 A2 2 0 0 1 37 39 H11 A2 2 0 0 1 9 37 Z"/><path d="M24 20 C24.7 25 25.5 25.8 30 26.5 C25.5 27.2 24.7 28 24 33 C23.3 28 22.5 27.2 18 26.5 C22.5 25.8 23.3 25 24 20 Z" fill="var(--brand)" stroke="none"/></svg>HOMA</div>
  <div class="center">
    <div class="eyebrow">Now on iOS &amp; Android</div>
    <div class="rule"></div>
    <div class="headline">Your week,<br><em>planned</em>.</div>
    <div class="sub">Chat, plan, and track every subject, right from your pocket.</div>
    <div class="cta">Start free for 14 days <span class="arr">→</span></div>
  </div>
  <div class="foot"><span class="avail">SWIPE UP ↑</span><span class="brand">homeschooling, made calm</span></div>
</div>
</body></html>
