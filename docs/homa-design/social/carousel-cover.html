<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>

  .body{font-family:var(--font-serif);font-size:40px;line-height:1.42;color:var(--text-muted);margin-top:44px;max-width:760px;font-weight:400;}
  .num{position:absolute;bottom:60px;left:78px;font-family:var(--font-display);font-size:340px;font-weight:500;line-height:0.7;color:transparent;-webkit-text-stroke:2px var(--clay-200);letter-spacing:-0.03em;pointer-events:none;}
  .swipe{position:absolute;bottom:88px;right:90px;display:flex;align-items:center;gap:12px;font-size:24px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:var(--text-muted);}
