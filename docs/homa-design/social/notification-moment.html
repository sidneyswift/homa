<!-- @dsCard group="Social" viewport="1080x1080" name="Notification moment" subtitle="1080×1080 · the suggestion, as a lock-screen story" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;}
  .post{width:1080px;height:1080px;box-sizing:border-box;background:var(--band-sky);padding:92px 88px;display:flex;flex-direction:column;position:relative;font-family:var(--font-sans);}
  .top{display:flex;align-items:center;justify-content:space-between;}
  .wm{font-family:var(--font-display);font-weight:600;letter-spacing:-0.01em;font-size:42px;color:var(--text-strong);display:flex;align-items:center;gap:10px;}
  .idx{font-family:var(--font-mono);font-size:23px;letter-spacing:0.1em;color:var(--stone-700);white-space:nowrap;}
  .eyebrow{font-size:23px;font-weight:700;letter-spacing:0.22em;text-transform:uppercase;color:var(--brand);margin-top:74px;}
  .headline{font-family:var(--font-display);font-size:96px;line-height:0.99;font-weight:600;color:var(--text-strong);letter-spacing:-0.025em;margin:24px 0 0;}
  .headline em{font-style:normal;color:var(--clay-600);}
  .nwrap{position:relative;margin-top:64px;max-width:860px;}
  .peek{position:absolute;left:26px;right:-14px;top:22px;bottom:-16px;background:rgba(255,255,255,0.42);border-radius:36px;}
  .notif{position:relative;background:rgba(255,255,255,0.95);border-radius:36px;box-shadow:var(--shadow-xl);padding:36px 42px;transform:rotate(-1.2deg);}
  .nhead{display:flex;align-items:center;gap:16px;margin-bottom:16px;}
  .nicon{width:64px;height:64px;border-radius:16px;background:var(--brand);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .nname{font-weight:700;font-size:27px;color:var(--text-strong);}
  .ntime{font-family:var(--font-mono);font-size:21px;color:var(--text-subtle);margin-left:auto;}
  .nbody{font-size:30px;line-height:1.45;color:var(--text-body);}
  .nbtns{display:flex;gap:14px;margin-top:22px;}
  .nb{padding:14px 28px;border-radius:999px;font-size:24px;font-weight:700;white-space:nowrap;}
  .nb.go{background:var(--brand);color:#fff;}
  .nb.later{background:var(--stone-100);color:var(--text-muted);}
  .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;font-size:24px;color:var(--stone-700);}
  .foot .brand{font-family:var(--font-serif);font-style:italic;font-weight:400;font-size:30px;color:var(--text-muted);}
</style></head><body>
<div class="post">
  <div class="top">
    <div class="wm"><svg width="38" height="38" viewBox="0 0 48 48"><path d="M24 5.6 C22.5 5.6 21 6.2 19.8 7.3 L7.1 18.9 C5.5 20.4 4.6 22.5 4.6 24.7 L4.6 35.2 C4.6 40.1 8.5 44 13.4 44 L34.6 44 C39.5 44 43.4 40.1 43.4 35.2 L43.4 24.7 C43.4 22.5 42.5 20.4 40.9 18.9 L28.2 7.3 C27 6.2 25.5 5.6 24 5.6 Z" fill="var(--brand)"/><circle cx="17.4" cy="26" r="4.8" fill="#fff"/><circle cx="30.6" cy="26" r="4.8" fill="#fff"/><circle cx="18.3" cy="26.7" r="2.2" fill="#221E1A"/><circle cx="31.5" cy="26.7" r="2.2" fill="#221E1A"/></svg><span style="font-family:'Fredoka',sans-serif;font-weight:600;display:inline-flex;"><span style="display:inline-block;transform:translateY(-0.06em) rotate(-3deg)">H</span><span style="display:inline-block;transform:translateY(0.05em)">o</span><span style="display:inline-block;transform:translateY(-0.04em) rotate(2deg)">m</span><span style="display:inline-block;transform:translateY(0.06em) rotate(-2deg)">a</span></span></div>
    <div class="idx">No. 12</div>
  </div>
  <div class="eyebrow">She&rsquo;s already on it</div>
  <div class="headline">She knows what<br>Saturday is <em>for</em>.</div>
  <div class="nwrap">
    <div class="peek"></div>
    <div class="notif">
    <div class="nhead">
      <div class="nicon"><svg width="38" height="38" viewBox="0 0 48 48"><path d="M24 5.6 C22.5 5.6 21 6.2 19.8 7.3 L7.1 18.9 C5.5 20.4 4.6 22.5 4.6 24.7 L4.6 35.2 C4.6 40.1 8.5 44 13.4 44 L34.6 44 C39.5 44 43.4 40.1 43.4 35.2 L43.4 24.7 C43.4 22.5 42.5 20.4 40.9 18.9 L28.2 7.3 C27 6.2 25.5 5.6 24 5.6 Z" fill="#fff"/><circle cx="17.4" cy="26" r="4.8" fill="var(--brand)"/><circle cx="30.6" cy="26" r="4.8" fill="var(--brand)"/></svg></div>
      <span class="nname">Homa</span>
      <span class="ntime">now</span>
    </div>
    <div class="nbody">Maya&rsquo;s on her space unit this week, and the Bullock has a family space day Saturday. Want me to hold tickets?</div>
    <div class="nbtns"><span class="nb go">Get tickets</span><span class="nb later">Not this week</span></div>
    </div>
  </div>
  <svg style="position:absolute;top:560px;right:92px;transform:rotate(-12deg)" width="56" height="56" viewBox="0 0 24 24"><path d="M12 1 C13.1 8.2 15.8 10.9 23 12 C15.8 13.1 13.1 15.8 12 23 C10.9 15.8 8.2 13.1 1 12 C8.2 10.9 10.9 8.2 12 1 Z" fill="var(--gold-400)"/></svg>
  <div class="foot"><span>@thankshoma</span><span class="brand">homeschooling, made calm</span></div>
</div>
</body></html>
