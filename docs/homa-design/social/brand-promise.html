<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;}
  .poster{width:1080px;height:1350px;box-sizing:border-box;background:var(--bg-page);background-image:var(--bg-paper);position:relative;font-family:var(--font-sans);overflow:hidden;}
  /* notebook margin rule */
  .margin{position:absolute;top:0;bottom:0;left:150px;width:2px;background:var(--clay-200);}
  .content{position:absolute;top:96px;left:196px;right:90px;bottom:88px;display:flex;flex-direction:column;}
  .wm{font-family:var(--font-display);font-weight:600;letter-spacing:-0.01em;font-size:44px;color:var(--text-strong);display:flex;align-items:center;gap:10px;}
  .wm .dot{width:11px;height:11px;border-radius:50%;background:var(--brand);margin-bottom:-12px;}
  .eyebrow{font-size:23px;font-weight:700;letter-spacing:0.22em;text-transform:uppercase;color:var(--brand);margin-top:auto;}
  .headline{font-family:var(--font-display);font-size:130px;line-height:0.98;font-weight:500;color:var(--text-strong);letter-spacing:-0.03em;margin:28px 0 0;}
  .headline .em{font-style:italic;font-weight:400;color:var(--clay-600);font-family:var(--font-serif);}
  .sub{font-family:var(--font-serif);font-size:38px;line-height:1.42;color:var(--text-muted);margin-top:44px;max-width:720px;font-weight:400;}
  .note{position:absolute;top:150px;right:40px;font-family:var(--font-hand);font-weight:600;font-size:60px;color:var(--sage-600);transform:rotate(-7deg);line-height:1;text-align:center;}
  .note .arrow{display:block;font-size:44px;margin-top:2px;}
  .foot{display:flex;align-items:center;gap:14px;color:var(--text-subtle);font-size:26px;margin-top:44px;}
  .star{width:44px;height:44px;border-radius:50%;background:var(--sage-50);display:inline-flex;align-items:center;justify-content:center;}
  .brand{font-family:var(--font-serif);font-style:italic;font-size:30px;color:var(--text-muted);}
</style></head><body>
<div class="poster">
  <div class="margin"></div>
  <div class="note">you've got this ✎<span class="arrow">♡</span></div>
  <div class="content">
    <div class="wm"><svg width="40" height="40" viewBox="0 0 48 48" fill="none" stroke="var(--brand)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M9 22 L24 9 L39 22 V37 A2 2 0 0 1 37 39 H11 A2 2 0 0 1 9 37 Z"/><path d="M24 20 C24.7 25 25.5 25.8 30 26.5 C25.5 27.2 24.7 28 24 33 C23.3 28 22.5 27.2 18 26.5 C22.5 25.8 23.3 25 24 20 Z" fill="var(--brand)" stroke="none"/></svg>homa</div>
    <div class="eyebrow">For the mom doing it all</div>
    <div class="headline">You&rsquo;ve got this.<br>I&rsquo;ve got<br>the <span class="em">rest</span>.</div>
    <div class="sub">The planning, the tracking, the what-do-we-do-today. Hand it to me, and get back to the part only you can do.</div>
    <div class="foot"><span class="star"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--sage-600)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span><span class="brand">homeschooling, made calm</span></div>
  </div>
</div>
</body></html>
