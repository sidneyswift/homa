<body>
<div id="root"></div>
<script type="text/babel">
  const { Icon } = window.HOMADesignSystem_113bd2;

  function Demo() {
    return (
      <div className="grid">
        {names.map(n => (

  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  setTimeout(() => window.lucide && window.lucide.createIcons(), 300);
