<!-- @dsCard group="Components" viewport="700x420" name="Navigation" subtitle="Tabs driving a live pane · sidebar and bottom tabs, one language" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--bg-page); font-family: var(--font-sans); padding: 24px; }
  .pane { margin-top: 16px; background: var(--surface-card); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: 4px 18px; }
  .li { display: flex; align-items: center; justify-content: space-between; padding: 13px 0; border-bottom: 1px solid var(--border-subtle); font-size: 0.9rem; color: var(--text-body); font-weight: 500; }
  .li:last-child { border-bottom: none; }
  .empty { padding: 18px 0; color: var(--text-subtle); font-size: 0.88rem; }
</style>
</head>
<body>
<div role="note" data-homa-lifecycle="m1-17-prototype" style="position:fixed;left:12px;bottom:12px;z-index:9999;padding:7px 11px;border-radius:999px;background:#221E1A;color:#fff;font:600 12px/1.2 system-ui,sans-serif">M1-17 prototype input · not a production component</div>
<div id="root"></div>
<script type="text/babel">
  const { Tabs, Badge } = window.HomaDesignSystem_5e2305;
  function Demo() {
    const [tab, setTab] = React.useState('Overview');
    return (
      <div>
        <Tabs tabs={['Overview','Subjects','Reports','Standards']} value={tab} onChange={setTab} />
        <div className="pane">
          {tab === 'Overview' ? (
            <div>
              <div className="li"><span>Math · Fractions</span><Badge tone="sage">On track</Badge></div>
              <div className="li"><span>Reading · Charlotte's Web</span><Badge tone="gold">Milestone</Badge></div>
              <div className="li"><span>Science · Moon phases</span><Badge tone="info">This week</Badge></div>
            </div>
          ) : (
            <div className="empty">The {tab.toLowerCase()} pane. Same calm rhythm, tab state stays put.</div>
          )}
        </div>
        <div style={{ margin: '18px 0 10px', fontSize: '0.66rem', fontWeight: 700, letterSpacing: '0.14em', textTransform: 'uppercase', color: 'var(--text-subtle)' }}>The same journey on every device</div>
        <div style={{ display: 'flex', gap: 16, flexWrap: 'wrap', alignItems: 'flex-start' }}>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
            <div style={{ background: 'var(--surface-card)', borderRadius: 'var(--radius-lg)', boxShadow: 'var(--shadow-sm)', padding: 8, display: 'flex', flexDirection: 'column', gap: 2, width: 180 }}>
              <span style={{ background: 'var(--clay-50)', color: 'var(--clay-700)', fontWeight: 700, fontSize: '0.82rem', borderRadius: 999, padding: '8px 14px' }}>Progress</span>
              <span style={{ color: 'var(--text-muted)', fontWeight: 500, fontSize: '0.82rem', padding: '8px 14px' }}>Planner</span>
              <span style={{ color: 'var(--text-muted)', fontWeight: 500, fontSize: '0.82rem', padding: '8px 14px' }}>Discover</span>
            </div>
            <span style={{ fontFamily: 'var(--font-mono)', fontSize: '0.62rem', color: 'var(--text-subtle)' }}>sidebar · web</span>
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
            <div style={{ background: 'var(--surface-card)', borderRadius: 'var(--radius-lg)', boxShadow: 'var(--shadow-sm)', padding: '10px 14px', display: 'flex', gap: 22, width: 250, justifyContent: 'space-between' }}>
              {[['Home', true], ['Ask', false], ['Plan', false], ['Kids', false]].map(([l, on]) => (
                <span key={l} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 5 }}>
                  <span style={{ width: 9, height: 9, borderRadius: '50%', background: on ? 'var(--brand)' : 'var(--stone-300)' }}></span>
                  <span style={{ fontSize: '0.64rem', fontWeight: on ? 700 : 500, color: on ? 'var(--clay-700)' : 'var(--text-subtle)' }}>{l}</span>
                </span>
              ))}
            </div>
            <span style={{ fontFamily: 'var(--font-mono)', fontSize: '0.62rem', color: 'var(--text-subtle)' }}>bottom tabs · mobile, 44px targets</span>
          </div>
        </div>
        <div style={{ marginTop: 12, fontSize: '0.74rem', color: 'var(--text-muted)', lineHeight: 1.6 }}>Active is always a soft clay tint with deep-ink text, never a bare underline or a colored border. The sidebar becomes bottom tabs below ~720px; tab state stays put across panes.</div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
