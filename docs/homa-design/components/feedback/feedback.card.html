<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@0.525.0"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--bg-page); font-family: var(--font-sans); padding: 24px; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .lbl { font-size: 0.66rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-subtle); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Callout, Icon, Button, Toast } = window.HomaDesignSystem_5e2305;
  function Demo() {
    return (
      <div className="stack">
        <div className="lbl">Callout · Homa speaks in the page</div>
        <Callout tone="sage" title="Homa suggests" icon={<Icon name="sparkles" size={20} />}>
          Maya's flying through fractions, ready to try some word problems this week?
        </Callout>
        <Callout tone="gold" title="Milestone" icon={<Icon name="award" size={20} />}>
          Eli finished the Grade 2 reading list. Nice work!
        </Callout>
        <Callout tone="danger" title="A small hiccup" icon={<Icon name="alert-triangle" size={20} />}>
          We couldn't sync just now. Everything you've planned is safe on this device.
        </Callout>
        <div className="lbl" style={{ marginTop: 4 }}>Toast · quick and undoable</div>
        <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap' }}>
          <Toast inline message="Added to Maya's week" icon={<Icon name="check" size={16} color="var(--gold-400)" />} action="Undo" />
          <Toast inline tone="light" message="Worksheet saved" icon={<Icon name="check" size={16} color="var(--sage-600)" />} />
        </div>
        <div style={{ fontSize: '0.76rem', color: 'var(--text-muted)', lineHeight: 1.6, borderTop: '1px solid var(--stone-200)', paddingTop: 10, marginTop: 4 }}>
          <b style={{ color: 'var(--text-body)' }}>Tones:</b> sage = Homa suggests, one per screen max · gold = milestone · danger = hiccup, reassure first, never blame. <b style={{ color: 'var(--text-body)' }}>Toasts:</b> one at a time, ~4s, an Undo beats an are-you-sure · destructive actions confirm in a Dialog.
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  setTimeout(() => window.lucide && window.lucide.createIcons(), 300);
</script>
</body>
</html>
