<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@0.525.0"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--bg-page); font-family: var(--font-sans); padding: 24px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 14px; }
  .lbl { font-size: 0.66rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-subtle); margin: 0 0 8px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Button, IconButton, Icon } = window.HomaDesignSystem_5e2305;
  function Demo() {
    return (
      <div>
        <div className="lbl">Variants</div>
        <div className="row">
          <Button variant="primary">Save plan</Button>
          <Button variant="secondary">Add subject</Button>
          <Button variant="soft">Duplicate</Button>
          <Button variant="ghost">Cancel</Button>
          <Button variant="danger">Delete</Button>
        </div>
        <div className="lbl">Sizes &amp; disabled</div>
        <div className="row">
          <Button size="sm">Small</Button>
          <Button size="md">Medium</Button>
          <Button size="lg">Large</Button>
          <Button disabled>Disabled</Button>
        </div>
        <div className="lbl">With icons · IconButton</div>
        <div className="row">
          <Button iconLeft={<Icon name="sparkles" size={18} color="var(--on-brand)" />}>Ask Homa</Button>
          <IconButton variant="soft" ariaLabel="add"><Icon name="plus" /></IconButton>
          <IconButton variant="outline" ariaLabel="more"><Icon name="ellipsis" /></IconButton>
          <IconButton variant="primary" ariaLabel="send"><Icon name="arrow-up" color="var(--on-brand)" /></IconButton>
        </div>
        <div className="lbl">Pairing · one primary per view, ghost beside it</div>
        <div className="row" style={{ background: 'var(--surface-card)', borderRadius: 'var(--radius-lg)', boxShadow: 'var(--shadow-sm)', padding: '14px 18px', justifyContent: 'flex-end', maxWidth: 430, marginBottom: 16 }}>
          <Button variant="ghost">Not this week</Button>
          <Button iconLeft={<Icon name="sparkles" size={18} color="var(--on-brand)" />}>Draft my week</Button>
        </div>
        <div style={{ fontSize: '0.78rem', color: 'var(--text-subtle)', lineHeight: 1.6 }}>Labels are verbs in her words: “Draft my week,” never “Submit.” Hover darkens + lifts · press scales 0.98 · focus is a clay glow · 44px min hit target on touch · destructive actions confirm in a Dialog.</div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  setTimeout(() => window.lucide && window.lucide.createIcons(), 300);
</script>
</body>
</html>
