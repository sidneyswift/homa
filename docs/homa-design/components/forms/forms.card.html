<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--bg-page); font-family: var(--font-sans); padding: 24px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Input, Select, Checkbox, Radio, Switch, Chip, Icon } = window.HOMADesignSystem_113bd2;
  function Demo() {
    const [chk, setChk] = React.useState(true);
    const [sw, setSw] = React.useState(true);
    const [r, setR] = React.useState('1st');
    const [sel, setSel] = React.useState('Maya');
    return (
      <div className="grid">
        <div className="stack">
          <Input label="Child's name" placeholder="e.g. Maya" iconLeft={<Icon name="user" size={18} />} />
          <Select label="Grade level" options={['K','1st','2nd','3rd']} value={r} onChange={e=>setR(e.target.value)} />
          <div className="chips">
            <Chip selected>Math</Chip>
            <Chip>Reading</Chip>
            <Chip>Science</Chip>
            <Chip onRemove={()=>{}}>Art</Chip>
          </div>
        </div>
        <div className="stack">
          <Checkbox label="Include a spelling list" checked={chk} onChange={setChk} />
          <Switch label="Weekly progress email" checked={sw} onChange={setSw} />
          <Radio options={['Kindergarten','1st','2nd']} value={r} onChange={setR} />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  setTimeout(() => window.lucide && window.lucide.createIcons(), 300);
</script>
</body>
</html>
