<!-- @dsCard group="Components" viewport="700x420" name="Playful shapes" subtitle="Squiggle, doodles, blob masks, ruled paper, wavy edges · pick one or two" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--bg-page); font-family: var(--font-sans); padding: 22px 26px; }
  .grid { display: grid; grid-template-columns: 1.25fr 1fr; gap: 22px; align-items: start; }
  .lbl { font-size: 0.66rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-subtle); margin: 0 0 8px; }
  .blobs { display: flex; gap: 12px; align-items: center; }
  .paper { background: var(--surface-card); background-image: var(--bg-paper); border-radius: var(--radius-md); padding: 14px 16px 20px; box-shadow: var(--shadow-sm); }
</style>
</head>
<body>
<div role="note" data-homa-lifecycle="m1-17-prototype" style="position:fixed;left:12px;bottom:12px;z-index:9999;padding:7px 11px;border-radius:999px;background:#221E1A;color:#fff;font:600 12px/1.2 system-ui,sans-serif">M1-17 prototype input · not a production component</div>
<div id="root"></div>
<script type="text/babel">
  const { Squiggle, Doodle } = window.HomaDesignSystem_5e2305;
  function Demo() {
    return (
      <div className="grid">
        <div>
          <div className="lbl">Squiggle divider</div>
          <div style={{ fontFamily: 'var(--font-display)', fontSize: '1.3rem', fontWeight: 500, color: 'var(--text-strong)' }}>featured this week</div>
          <Squiggle style={{ margin: '8px 0 18px' }} />
          <Squiggle color="var(--pop-cobalt)" segments={4} style={{ maxWidth: 220, marginBottom: 18 }} />
          <div className="lbl" style={{ marginTop: 4 }}>Doodles, placed by hand</div>
          <div style={{ display: 'flex', gap: 16, alignItems: 'center', flexWrap: 'wrap', maxWidth: 400 }}>
            <Doodle name="star" rotate={-10} />
            <Doodle name="heart" color="var(--pop-blush)" rotate={8} />
            <Doodle name="sun" color="var(--gold-400)" />
            <Doodle name="sparkle" color="var(--sage-400)" size={20} rotate={12} />
            <Doodle name="squiggle" color="var(--pop-cobalt)" size={28} />
            <Doodle name="flower" color="var(--pop-blush)" rotate={-6} />
            <Doodle name="cloud" color="var(--sky-500)" size={28} />
            <Doodle name="moon" color="var(--gold-500)" rotate={14} size={22} />
            <Doodle name="zigzag" color="var(--sage-500)" size={26} />
            <Doodle name="loop" color="var(--clay-500)" size={30} rotate={-4} />
          </div>
        </div>
        <div>
          <div className="lbl">Blob masks + ruled paper</div>
          <div className="blobs" style={{ marginBottom: 14, flexWrap: 'wrap' }}>
            {[['var(--band-sky)', 'var(--blob-1)', '1'], ['var(--band-blush)', 'var(--blob-2)', '2'], ['var(--band-mint)', 'var(--blob-3)', '3'], ['var(--band-sunshine)', 'var(--blob-4)', '4'], ['var(--clay-100)', 'var(--blob-5)', '5']].map(([bg, br, n]) => (
              <div key={n} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4 }}>
                <div style={{ width: 60, height: 54, background: bg, borderRadius: br }}></div>
                <span style={{ fontFamily: 'var(--font-mono)', fontSize: '0.58rem', color: 'var(--text-subtle)' }}>blob-{n}</span>
              </div>
            ))}
          </div>
          <div className="paper">
            <span style={{ fontFamily: 'var(--font-hand)', fontWeight: 600, fontSize: '1.5rem', color: 'var(--pop-cobalt)' }}>today we learned about clouds</span>
          </div>
          <div style={{ marginTop: 14 }}>
            <div style={{ height: 10, background: 'radial-gradient(circle 9px at 9px 10px, var(--band-mint) 8.5px, transparent 9px) repeat-x', backgroundSize: '18px 10px' }}></div>
            <div style={{ height: 38, background: 'var(--band-mint)', borderRadius: '0 0 12px 12px', display: 'flex', alignItems: 'center', padding: '0 14px', fontSize: '0.78rem', fontWeight: 600, color: 'var(--sage-700)' }}>wavy band edge</div>
          </div>
          <div style={{ marginTop: 12, fontSize: '0.72rem', color: 'var(--text-subtle)', lineHeight: 1.55 }}>One or two playful devices per surface, never all at once. A seam gets a wave OR a squiggle ribbon, never both. Rotate blobs so neighbors never match.</div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
