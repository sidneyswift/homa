<!-- @dsCard group="Components" viewport="700x300" name="Playful shapes" subtitle="Squiggle divider, doodles, blob masks, ruled paper" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--bg-page); font-family: var(--font-sans); padding: 22px 26px; }
  .grid { display: grid; grid-template-columns: 1.25fr 1fr; gap: 22px; align-items: start; }
  .lbl { font-size: 0.66rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-subtle); margin: 0 0 8px; }
  .blobs { display: flex; gap: 12px; align-items: center; }
  .paper { background: var(--surface-card); background-image: var(--bg-paper); border-radius: var(--radius-md); padding: 14px 16px 20px; box-shadow: var(--shadow-sm); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Squiggle, Doodle } = window.HOMADesignSystem_113bd2;
  function Demo() {
    return (
      <div className="grid">
        <div>
          <div className="lbl">Squiggle divider</div>
          <div style={{ fontFamily: 'var(--font-display)', fontSize: '1.3rem', fontWeight: 500, color: 'var(--text-strong)' }}>featured this week</div>
          <Squiggle style={{ margin: '8px 0 18px' }} />
          <Squiggle color="var(--pop-cobalt)" segments={4} style={{ maxWidth: 220, marginBottom: 18 }} />
          <div className="lbl" style={{ marginTop: 4 }}>Doodles, placed by hand</div>
          <div style={{ display: 'flex', gap: 18, alignItems: 'center' }}>
            <Doodle name="star" rotate={-10} />
            <Doodle name="heart" color="var(--pop-blush)" rotate={8} />
            <Doodle name="sun" color="var(--gold-400)" />
            <Doodle name="sparkle" color="var(--sage-400)" size={20} rotate={12} />
            <Doodle name="squiggle" color="var(--pop-cobalt)" size={28} />
          </div>
        </div>
        <div>
          <div className="lbl">Blob masks + ruled paper</div>
          <div className="blobs" style={{ marginBottom: 14 }}>
            <div style={{ width: 76, height: 68, background: 'var(--band-sky)', borderRadius: 'var(--blob-1)' }}></div>
            <div style={{ width: 76, height: 68, background: 'var(--band-blush)', borderRadius: 'var(--blob-2)' }}></div>
            <div style={{ width: 76, height: 68, background: 'var(--band-mint)', borderRadius: 'var(--blob-3)' }}></div>
          </div>
          <div className="paper">
            <span style={{ fontFamily: 'var(--font-hand)', fontWeight: 600, fontSize: '1.5rem', color: 'var(--pop-cobalt)' }}>today we learned about clouds</span>
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
