research_notes:
  - at: "2026-07-16T16:20:00Z"
    surface: "retention | tasks | measurement"
    finding: >-
      Master plan written (docs/homa-planning/plans/2026-07-16-pmf-retention-master-plan.md)
      after fresh prod pull + two councils. New facts: (1) 100% of setup-done
      families already have a linked phone, so brief ENROLLMENT is the gap,
      not phone linkage; seedKind requires 20h family age + a report, so
      day-one families wait 1-3 days for the first proactive touch. (2) Brief
      reach correlates with return (9/16 reached are multi-day vs 0/18
      unreached) but is confounded; PMF-201 backfill of the 18 unreached is
      the causal test. (3) Honest return metric = parent-authored message
      days: 18/34 setup-done never messaged, 9/34 multi-day. (4) Jul 7-13
      cohort n=5 went 5/5 multi-day and 5/5 created, so the loop retains when
      it completes. Factor moved to in_progress: subject-lesson bridge
      (PMF-101) is being built by the lessons agent.
    source: "homa-prod SQL 2026-07-16 ~16:00Z + expert council d9ddc6e8 + customer council 27451bb3"
    implication_for_pmf: >-
      Wave 1 = PMF-101 lesson bridge, PMF-104 quality gate, PMF-201 brief
      enrollment + backfill experiment, PMF-401 measurement truth, PMF-301
      unopened-report follow-up. Journal ask at session one is killed; wall
      stays off until keep and return bars hit.
  - at: "2026-07-16T11:05:00Z"
    surface: "onboarding | acquisition | language"
    finding: >-
      Locked denominator language for Homa: signup-screen abandon (open),
      signed-up family (claimed), family setup done (profile_completed_at),
      test family (sandbox). Parent funnel is landing → Google/email signup
      → family setup. /api/map/start is silent session bootstrap, not a
      funnel step. Written into reality-checks.md and this log header.
    source: "founder correction in pmf-focus session 2026-07-16"
    implication_for_pmf: >-
      Any future WTF/PMF pass that says "real families" or blends open+claimed
      into "signups" is wrong on arrival; fix language before locking a factor.
  - at: "2026-07-16T10:55:00Z"
    surface: "onboarding | acquisition"
    finding: >-
      VALIDATION FAIL on "263 real families." Most non-sandbox rows were
      signup-screen abandons (open, no email). Only ~43 signed-up. Jul 14-16
      spike mostly abandons. Signed-up funnel still weak after report.
    source: "homa-prod SQL re-check + store.ts + ParentStep"
    implication_for_pmf: >-
      Acquisition claims need claimed counts. Core-loop factor still holds on
      the signed-up / setup-done cohort.
  - at: "2026-07-16T05:45:00Z"
    surface: "onboarding | chat | materials | billing"
    finding: >-
      First lock of core-loop factor after WTF subagent; used invalid
      "real families" denominator (later corrected).
    source: "homa-prod SQL + thankshoma.com live probe + WTF subagent b7e44ad4"
    implication_for_pmf: "Superseded on language; direction on signed-up cohort kept."

